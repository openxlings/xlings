[package]
name = "xlings"
version = "0.4.48"
description = "Universal package management infrastructure tool with SubOS isolation"
license = "Apache-2.0"
repo = "https://github.com/openxlings/xlings"

[build]
include_dirs = ["src/libs/json"]
cxxflags = ["-DLIBARCHIVE_STATIC", "-DXLINGS_USE_GTEST_MAIN=1", "-DUNICODE", "-D_UNICODE"]

[targets.xlings]
kind = "bin"
main = "src/main.cpp"

[toolchain]
default = "gcc@16.1.0"
macos = "llvm@20.1.7"
windows = "llvm@20.1.7"

[target.x86_64-linux-musl]
toolchain = "gcc@15.1.0-musl"
linkage = "static"

[dependencies]
ftxui = "6.1.9"

[dependencies.compat]
libarchive = "3.8.7"

[dependencies.mcpplibs]
cmdline = "0.0.2"
xpkg = "0.0.41"
tinyhttps = "0.2.3"
capi.lua = "0.0.3"

[dev-dependencies]
gtest = "1.15.2"
