# What the interaction surfaces show, independent of how they draw it.
#
#   theme   the colour scheme. Its module imports `std` and the JSON reader
#           only, so the frontends and core/log can all depend on it without
#           a cycle. It owns `Rgb` and `Background`; whether the terminal can
#           take colour at all is core/palette's question.
#   i18n    message catalogues, built in: nobody authors a translation table,
#           so embedding it removes a delivery chain and every way it fails
#           (themes, which users do copy and edit, stay files). `en` is the
#           complete base; every other language states only what it changes.
#           Adding a language is adding a file under src/i18n/. "auto"
#           resolves through platform's system-language probe.
[package]
namespace = "xlings"
name      = "ui"
version   = "0.1.0"

[targets.ui]
kind = "lib"

[dependencies]
platform = { path = "../platform" }

[build]
include_dirs = ["../libs/src/json"]
