# Guarding what cannot be undone, as its own package (design §23).
#
# Two things the xlings core and the SubOS core both need, and neither may own:
#
# - `UserConfirmed`, the token only `ask()` produces. A function that deletes
#   user data takes one, so a code path that never asked -- a repair, an
#   upgrade, a rollback -- cannot call it. That rule moved here unchanged.
# - the `Asker` port. Core code asks a question through it and never decides
#   HOW: a terminal, an agent contract (answer from -y or refuse), the NDJSON
#   interface. The interaction surfaces implement it; the core only calls it.
#
# A leaf: std only. Nothing here may know about events, homes or rendering.
[package]
namespace = "xlings"
name      = "guard"
version   = "0.1.0"

[targets.guard]
kind = "lib"
