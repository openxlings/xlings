# i18n: how a program's words reach a person in their language (design
# 2026-10-19 §7). The mechanism is the i18n kit (luban/kits/i18n), shared with
# xdesk and every program; this is xlings' face of it -- the same names under
# xlings::i18n, xlings' words the default domain, the system's language read
# through xlings.platform. Each program keeps its own words (catalogues) and
# registers them by domain, in its main.
[package]
namespace = "xlings"
name      = "i18n"
version   = "0.1.0"

[targets.i18n]
kind = "lib"

[dependencies]
platform = { path = "../platform" }   # the system's language
i18nkit  = { path = "../../luban/kits/i18n" }   # the mechanism (a kit: xdesk uses it too)
