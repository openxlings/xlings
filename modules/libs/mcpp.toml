# Self-contained libraries: what any program could use, nothing of xlings.
#
#   json        nlohmann/json wrapped as a module (`src/json/json.hpp` is the
#               vendored header, with its LICENSE). Imports nothing, not even
#               `std`.
#   sha256      SHA-256 in process: hashes are checked while a download is
#               verified, and shelling out to `sha256sum` would make that
#               depend on what the machine has installed.
#   tinyhttps   HTTPS fetch, wrapping mcpplibs.tinyhttps. It reports the proxy
#               it used through its return value: a library that logs has an
#               opinion about where its caller's output goes.
#   elfread     The loader's fields of an ELF (interpreter, search paths,
#               DT_NEEDED) read from its headers: the payload audit and a
#               Luban system's self-check both read them.
#
# One package, four module units: each is a leaf, none is big enough to be a
# package of its own, and they share one rule -- nothing here imports xlings.
[package]
namespace = "xlings"
name      = "libs"
version   = "0.1.0"

[targets.libs]
kind = "lib"

[dependencies.mcpplibs]
tinyhttps = "0.2.9"

[build]
include_dirs = ["src/json"]
