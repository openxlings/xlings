name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.0). Leave empty to use version from core/config.cppm'
        required: false
        type: string

env:
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp. Bump together with
  # XIM_PKGINDEX_REF so release uses a known-good xlings + package index pair.
  BOOTSTRAP_XLINGS_VERSION: v0.4.69
  # Must contain the mcpp version pinned in .xlings.json (2026.8.3.3).
  XIM_PKGINDEX_REF: bf969a651caae4539eea8e92e3d14cb60e0eaf53

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        id: mcpp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            !~/.mcpp/bmi
            !~/.mcpp/build-cache
            .mcpp
            !.mcpp/bmi
            !.mcpp/build-cache
          # BMIs are NOT cached, and are deleted after every restore. That
          # is the fix, and it took three prefix retirements to find.
          #
          # A restored BMI set never works. `import 'std' has CRC mismatch`
          # follows, which reads like a compiler bug. What hid it is that the
          # old guard wiped the BMIs on an INEXACT restore -- so retiring the
          # key prefix forced an inexact restore, fired the guard, and produced
          # one clean run. Each retirement therefore looked like a fix and was
          # an accident; the next run got an exact hit, skipped the guard, and
          # failed again. Read straight off two consecutive runs of THIS
          # workflow: the one that passed shows "Drop stale BMIs" as `success`,
          # the one that failed shows it `skipped`.
          #
          # So the wipe is unconditional now, and the BMI directories are
          # excluded from the cache as well -- the exclusion is an optimisation
          # (do not store bytes we delete on arrival), the unconditional wipe is
          # the guarantee, and it cannot depend on exclude-pattern semantics.
          #
          # What the cache is FOR is `registry/data/xpkgs`: ~800 MB of payloads
          # that are toolchain-independent and survive a round trip fine.
          #
          # The key still names the workflow that produced it. mcpp.toml
          # declares both the dev toolchain (gcc@16.1.0) and the release target
          # (gcc@15.1.0-musl), so a CI build and a release build hash the same
          # -- sharing one key across workflows is wrong on its own terms even
          # though it was not what caused this.
          key: mcpp-v4-release-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-v4-release-${{ runner.os }}-
      # An inexact restore (the `restore-keys` fallback) brings BMIs built
      # under a different dependency set. Mixing them with anything rebuilt
      # here fails as `import 'std' has CRC mismatch` — which reads like a
      # compiler bug and is a cache restored for the wrong inputs. Measured on
      # PR #480, where `mcpplibs.xpkg` went 0.0.47 → 0.0.48: the fallback
      # cache's tinyhttps/cmdline BMIs no longer matched the `std` the fresh
      # xpkg build produced.
      #
      # Only the BMIs go. The payload store under registry/data/xpkgs is
      # dependency-independent and is what makes the ~800 MB cache worth
      # restoring at all.
      # Evidence for task #56, gathered where the failure actually happens.
      #
      # Four hypotheses were refuted on a developer machine (2026-08-06): two
      # toolchains sharing one BMI store; the tar round trip destroying
      # metadata (the .gcm set survives byte-for-byte, mtimes included); a full
      # project rebuild against restored BMIs; and prune_registry running after
      # the restore. None reproduces it locally, so the next honest step is to
      # record what CI has that a laptop does not, rather than guess a fifth
      # hypothesis.
      #
      # What to look for: two entries that disagree on driver_identity or
      # sysroot for the same cpp_standard. That would mean the restored set is
      # internally inconsistent, which is the answer.
      #
      # continue-on-error on purpose: a diagnostic must never be the reason a
      # release is blocked. Set XLINGS_KEEP_RESTORED_BMIS=1 on a throwaway
      # branch to skip the wipe below and let the failure happen with this
      # record in hand.
      - name: Record the restored BMI set (diagnostic for #56)
        shell: bash
        continue-on-error: true
        run: |
          echo "cache-hit: ${{ steps.mcpp-cache.outputs.cache-hit }}"
          for d in ~/.mcpp/bmi .mcpp/bmi ~/.mcpp/build-cache .mcpp/build-cache; do
            if [ -d "$d" ]; then
              echo "  $d: $(du -sh "$d" 2>/dev/null | cut -f1), $(find "$d" -name '*.gcm' 2>/dev/null | wc -l) .gcm"
            else
              echo "  $d: absent"
            fi
          done
          echo "  --- build identity per BMI dir (first 40) ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null | head -40 |
          while read -r f; do
            printf '  %-18s %s %s\n' \
              "$(basename "$(dirname "$f")")" \
              "$(grep -o '"cpp_standard": *"[^"]*"' "$f" | cut -d'"' -f4)" \
              "$(grep -o '"driver_identity": *"[^"]*"' "$f" | cut -d'"' -f4)"
          done
          echo "  --- distinct driver identities ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null |
            xargs -r grep -ho '"driver_identity": *"[^"]*"' | sort -u

      - name: Drop restored BMIs
        if: env.XLINGS_KEEP_RESTORED_BMIS != '1'
        shell: bash
        run: |
          rm -rf ~/.mcpp/bmi ~/.mcpp/build-cache .mcpp/bmi .mcpp/build-cache

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings config --mirror GLOBAL
          # Refresh the index before resolving anything out of it.
          #
          # Without this the run resolves against whatever index snapshot the
          # bootstrap shipped with, which is not the one this PR needs: a
          # freshly published `mcpplibs.xpkg@0.0.50` reported as "not found"
          # while older entries from the same index downloaded fine. The
          # failure names the package, so it reads as an unpublished
          # dependency rather than as an index nobody refreshed.
          xlings update || true
          xlings install -y
          mcpp --version
          mcpp self version

      - name: Reinitialize mcpp registry (GLOBAL)
        run: |
          # Drop the resolved indexes and mirror config so they are
          # re-resolved against GLOBAL, but KEEP registry/data/xpkgs -- the
          # downloaded and extracted package payloads.
          #
          # Those payloads are sha256-pinned by their recipe, so they are
          # mirror-independent: keeping them cannot leak a CN artifact into a
          # GLOBAL build. Wiping them made every run re-fetch every transitive
          # source from its upstream host, so CI failed wholesale whenever one
          # of those hosts was unreachable -- e.g. compat.bzip2 (a transitive
          # dep of compat.libarchive, and absent from mcpp.lock, which only
          # pins direct deps) fetched from sourceware.org. It also made the
          # ~800 MB mcpp cache restored one step earlier almost worthless.
          prune_registry() {
            [ -d "$1" ] || return 0
            find "$1" -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
            [ -d "$1/data" ] || return 0
            find "$1/data" -mindepth 1 -maxdepth 1 ! -name xpkgs -exec rm -rf {} +
          }
          prune_registry "$HOME/.mcpp/registry"
          prune_registry "$GITHUB_WORKSPACE/.mcpp/registry"
          mcpp self config --mirror GLOBAL

      - name: Prepare fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      - name: Build (linux_release)
        run: |
          chmod +x ./tools/linux_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/linux_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build/xlings-*-linux-x86_64.tar.gz

  # Cross-build the aarch64-linux-musl release artefact on an x86_64 runner via
  # mcpp's cross toolchain (xim:aarch64-linux-musl-gcc). Uses the latest mcpp
  # (built from main) and a freshly-updated package index, so the produced
  # binary tracks the current ecosystem. The ELF can't execute here, so the
  # functional/network verify steps are skipped (SKIP_RUN_VERIFY/SKIP_NETWORK_VERIFY)
  # — self-init runs on the user's aarch64 device via `xlings self install`.
  build-linux-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential jq

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-aarch64-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-aarch64-${{ runner.os }}-

      - name: Bootstrap mcpp + refresh index (latest, GLOBAL)
        run: |
          xlings config --mirror GLOBAL
          xlings update -y 2>/dev/null || xlings update 2>/dev/null || true
          xlings install mcpp -y
          mcpp --version

      - name: Build cross-capable mcpp from source (latest main)
        run: |
          git clone --depth 1 https://github.com/mcpp-community/mcpp /tmp/mcpp-src
          cd /tmp/mcpp-src
          # Avoid recursively resolving mcpp's development pin while the
          # already-installed mcpp bootstraps the source tree.
          mv .xlings.json .xlings.json.bootstrap
          mcpp self config --mirror GLOBAL
          mcpp build
          MCPP=$(realpath "$(find target -type f -name mcpp -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2)")
          test -x "$MCPP"
          "$MCPP" self config --mirror GLOBAL
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"

      - name: Build (linux_release — aarch64 cross)
        run: |
          chmod +x ./tools/linux_release.sh
          MCPP_BIN="$MCPP" MCPP_TARGET=aarch64-linux-musl \
            SKIP_RUN_VERIFY=1 SKIP_NETWORK_VERIFY=1 \
            ./tools/linux_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-linux-aarch64
          path: build/xlings-*-linux-aarch64.tar.gz

  build-macos:
