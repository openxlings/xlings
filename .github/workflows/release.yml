name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.0). Leave empty to use version from core/config.cppm'
        required: false
        type: string

env:
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp. Bump together with
  # XIM_PKGINDEX_REF so release uses a known-good xlings + package index pair.
  BOOTSTRAP_XLINGS_VERSION: v0.4.49
  # Must contain the mcpp version pinned in .xlings.json (0.0.57).
  XIM_PKGINDEX_REF: fbcad0320fbf84271b710650402ac7ed1a8fa64f

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            .mcpp
          key: mcpp-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-${{ runner.os }}-

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings install -y
          mcpp --version
          mcpp self version

      - name: Refresh mcpp package index cache
        run: |
          rm -rf "$HOME/.mcpp/registry/data/mcpplibs"
          rm -rf "$GITHUB_WORKSPACE/.mcpp/registry/data/mcpplibs"

      - name: Prepare fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      - name: Build (linux_release)
        run: |
          chmod +x ./tools/linux_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/linux_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build/xlings-*-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            .mcpp
          key: mcpp-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-${{ runner.os }}-

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings install -y
          mcpp --version
          mcpp self version

      - name: Refresh mcpp package index cache
        run: |
          rm -rf "$HOME/.mcpp/registry/data/mcpplibs"
          rm -rf "$GITHUB_WORKSPACE/.mcpp/registry/data/mcpplibs"

      - name: Build (macos_release)
        env:
          # macOS min-version support: floor 14.0 (the official LLVM
          # static libc++ archives are built for macOS 14; lower needs a
          # custom libc++ build). The mcpp from the bootstrap index
          # (0.0.50+) links static LLVM libc++ via lld natively;
          # macos_release.sh asserts minos + no system libc++ dylib when
          # this env is set.
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          chmod +x ./tools/macos_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/macos_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-macosx-arm64
          path: build/xlings-*-macosx-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        shell: pwsh
        env:
          XLINGS_NON_INTERACTIVE: '1'
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "XLINGS_HOME=$env:USERPROFILE\.xlings"            >> $env:GITHUB_ENV
          "$env:USERPROFILE\.xlings\subos\current\bin"      >> $env:GITHUB_PATH
          "$env:USERPROFILE\.xlings\bin"                    >> $env:GITHUB_PATH

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~\.xlings\data\xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        uses: actions/cache@v4
        with:
          path: |
            ~\.mcpp
            .mcpp
          key: mcpp-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-${{ runner.os }}-

      - name: Prepare bootstrap package index
        shell: pwsh
        run: |
          $indexDir = Join-Path $env:USERPROFILE ".xlings\data\xim-pkgindex"
          Remove-Item -Recurse -Force $indexDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Split-Path $indexDir) | Out-Null
          git clone https://github.com/openxlings/xim-pkgindex.git $indexDir
          git -C $indexDir checkout --quiet $env:XIM_PKGINDEX_REF
          if (-not (Test-Path (Join-Path $indexDir "pkgs"))) {
            throw "bootstrap package index missing pkgs/"
          }

      - name: Install build dependencies (mcpp)
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          xlings install -y
          mcpp --version
          mcpp self version

      - name: Refresh mcpp package index cache
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:USERPROFILE\.mcpp\registry\data\mcpplibs" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\.mcpp\registry\data\mcpplibs" -ErrorAction SilentlyContinue

      - name: Build (windows_release)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows_release.ps1"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-windows-x86_64
          path: build/xlings-*-windows-x86_64.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)
            if [[ -z "$VER" ]]; then
              echo "Failed to read VERSION from src/core/config.cppm." >&2
              echo "Either fix the source path or pass an explicit version via workflow_dispatch input." >&2
              exit 1
            fi
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/xlings-linux-x86_64/xlings-*-linux-x86_64.tar.gz
            artifacts/xlings-macosx-arm64/xlings-*-macosx-arm64.tar.gz
            artifacts/xlings-windows-x86_64/xlings-*-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build + publish the xim package index as a versioned resource artifact
  # (Y-asset) to xlings-res/xim-index on GitHub (+ GitCode). Best-effort: each
  # target is skipped when its token secret is absent, and the job never blocks
  # the release. See .agents/docs/2026-06-22-index-as-resource-impl-plan.md.
  publish-index:
    needs: [create-release]
    runs-on: ubuntu-latest
    # secrets aren't available in step if: — surface them as env, gate on env.
    env:
      XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build index artifacts (main + default sub-indexes)
        run: |
          mkdir -p build/index
          VER="${{ steps.version.outputs.version }}"
          # main index
          XLINGS_RELEASE_MIRROR=GLOBAL bash tools/build_xim_index_artifact.sh \
            --version "$VER" --out build/index
          # default sub-indexes (URLs mirror the main index's xim-indexrepos.lua)
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/openxlings/xim-pkgindex-awesome.git \
            bash tools/build_xim_index_artifact.sh --name awesome --version "$VER" --out build/index
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/openxlings/xim-pkgindex-scode.git \
            bash tools/build_xim_index_artifact.sh --name scode --version "$VER" --out build/index
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/d2learn/xim-pkgindex-d2x.git \
            bash tools/build_xim_index_artifact.sh --name d2x --version "$VER" --out build/index

      - name: Publish to GitHub (xlings-res/xim-index)
        if: ${{ env.XLINGS_RES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          bash tools/publish_xim_index.sh --version "$VER" --dir build/index --skip-gitcode
          for n in awesome scode d2x; do
            bash tools/publish_xim_index.sh --version "$VER" --name "$n" --dir build/index --skip-gitcode
          done

      # GitCode publish uses the vendored tools/gtc + GITCODE_TOKEN. Non-blocking.
      - name: Publish to GitCode (xlings-res/xim-index)
        if: ${{ env.GITCODE_TOKEN != '' }}
        run: |
          chmod +x tools/gtc
          export PATH="$PWD/tools:$PATH"
          VER="${{ steps.version.outputs.version }}"
          bash tools/publish_xim_index.sh --version "$VER" --dir build/index --skip-github \
            || echo "gitcode main publish failed (non-blocking)"
          for n in awesome scode d2x; do
            bash tools/publish_xim_index.sh --version "$VER" --name "$n" --dir build/index --skip-github \
              || echo "gitcode $n publish failed (non-blocking)"
          done
