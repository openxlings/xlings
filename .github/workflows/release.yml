      - name: Reinitialize mcpp registry (GLOBAL)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:USERPROFILE\.mcpp\registry" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\.mcpp\registry" -ErrorAction SilentlyContinue
          mcpp self config --mirror GLOBAL

      - name: Build (windows_release)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows_release.ps1"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-windows-x86_64
          path: build/xlings-*-windows-x86_64.zip

  prepare-candidates:
    needs: [build-linux, build-linux-aarch64, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate source-bound sidecars
        run: bash tools/gen_release_sidecars.sh artifacts sidecars
      - uses: actions/upload-artifact@v4
        with:
          name: xlings-release-sidecars
          path: sidecars/*.sha256

  candidate-linux-x86_64:
    needs: [prepare-candidates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: xlings-linux-x86_64, path: candidate}
      - uses: actions/download-artifact@v4
        with: {name: xlings-release-sidecars, path: sidecars}
      - run: bash tests/candidate-install/smoke.sh candidate/*.tar.gz sidecars/*linux-x86_64.tar.gz.sha256

  candidate-linux-aarch64:
    needs: [prepare-candidates]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: xlings-linux-aarch64, path: candidate}
      - uses: actions/download-artifact@v4
        with: {name: xlings-release-sidecars, path: sidecars}
      - run: bash tests/candidate-install/smoke.sh candidate/*.tar.gz sidecars/*linux-aarch64.tar.gz.sha256

  candidate-macos-arm64:
    needs: [prepare-candidates]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: xlings-macosx-arm64, path: candidate}
      - uses: actions/download-artifact@v4
        with: {name: xlings-release-sidecars, path: sidecars}
      - run: bash tests/candidate-install/smoke.sh candidate/*.tar.gz sidecars/*macosx-arm64.tar.gz.sha256

  candidate-windows-x86_64:
    needs: [prepare-candidates]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: xlings-windows-x86_64, path: candidate}
      - uses: actions/download-artifact@v4
        with: {name: xlings-release-sidecars, path: sidecars}
      - shell: pwsh
        run: powershell -File tests/candidate-install/smoke.ps1 (Get-ChildItem candidate/*.zip).FullName (Get-ChildItem sidecars/*windows-x86_64.zip.sha256).FullName

  create-release:
    needs: [candidate-linux-x86_64, candidate-linux-aarch64, candidate-macos-arm64, candidate-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)
            if [[ -z "$VER" ]]; then
              echo "Failed to read VERSION from src/core/config.cppm." >&2
              echo "Either fix the source path or pass an explicit version via workflow_dispatch input." >&2
              exit 1
            fi
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/xlings-linux-x86_64/xlings-*-linux-x86_64.tar.gz
            artifacts/xlings-linux-aarch64/xlings-*-linux-aarch64.tar.gz
            artifacts/xlings-macosx-arm64/xlings-*-macosx-arm64.tar.gz
            artifacts/xlings-windows-x86_64/xlings-*-windows-x86_64.zip
            artifacts/xlings-release-sidecars/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build + publish the xim package index as a versioned resource artifact
  # (Y-asset) to xlings-res/xim-index on GitHub (+ GitCode). Best-effort: each
  # target is skipped when its token secret is absent, and the job never blocks
  # the release. See .agents/docs/2026-06-22-index-as-resource-impl-plan.md.
  publish-index:
    needs: [create-release]
    runs-on: ubuntu-latest
    # secrets aren't available in step if: — surface them as env, gate on env.
    env:
      XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build index artifacts (main + default sub-indexes)
        run: |
          mkdir -p build/index
          VER="${{ steps.version.outputs.version }}"
          # main index
          XLINGS_RELEASE_MIRROR=GLOBAL bash tools/build_xim_index_artifact.sh \
            --version "$VER" --out build/index
          # default sub-indexes (URLs mirror the main index's xim-indexrepos.lua)
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/openxlings/xim-pkgindex-awesome.git \
            bash tools/build_xim_index_artifact.sh --name awesome --version "$VER" --out build/index
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/openxlings/xim-pkgindex-scode.git \
            bash tools/build_xim_index_artifact.sh --name scode --version "$VER" --out build/index
          XLINGS_RELEASE_PKGINDEX_URL=https://github.com/d2learn/xim-pkgindex-d2x.git \
            bash tools/build_xim_index_artifact.sh --name d2x --version "$VER" --out build/index

      - name: Publish to GitHub (xlings-res/xim-index)
        if: ${{ env.XLINGS_RES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          bash tools/publish_xim_index.sh --version "$VER" --dir build/index --skip-gitcode
          for n in awesome scode d2x; do
            bash tools/publish_xim_index.sh --version "$VER" --name "$n" --dir build/index --skip-gitcode
          done

      # GitCode publish uses the vendored tools/gtc + GITCODE_TOKEN. Non-blocking.
      - name: Publish to GitCode (xlings-res/xim-index)
        if: ${{ env.GITCODE_TOKEN != '' }}
        run: |
          chmod +x tools/gtc
          export PATH="$PWD/tools:$PATH"
          VER="${{ steps.version.outputs.version }}"
          bash tools/publish_xim_index.sh --version "$VER" --dir build/index --skip-github \
            || echo "gitcode main publish failed (non-blocking)"
          for n in awesome scode d2x; do
            bash tools/publish_xim_index.sh --version "$VER" --name "$n" --dir build/index --skip-github \
              || echo "gitcode $n publish failed (non-blocking)"
          done

      # Push the rolling pointers as repo files (overwriteable, served raw) to
      # both GitHub and GitCode. This is what clients read to find the latest
      # artifact; repo files (unlike gitcode release assets) can be updated.
      - name: Push index pointers (raw repo files, gh + gtc)
        if: ${{ env.XLINGS_RES_TOKEN != '' || env.GITCODE_TOKEN != '' }}
        env:
          XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          # #476: recorded at the pointer top level so a client routed to an
          # older index snapshot can still learn a newer client exists. Without
          # it, that client reads the old snapshot's own xlings recipe, is told
          # it is current, and can never leave the snapshot it was routed to.
          XLINGS_CLIENT_LATEST: ${{ steps.version.outputs.version }}
        run: bash tools/push_index_pointers.sh build/index

  # Mirror the xlings binaries to xlings-res/xlings on GitHub + GitCode so
  # XLINGS_RES downloads resolve for all platforms (CN binary path is
  # GitCode-only). Per-file retry: a multi-file gtc upload can 502 and drop
  # later files (e.g. windows/macos missing). Best-effort, non-blocking.
  mirror-binaries:
    needs: [create-release]
    runs-on: ubuntu-latest
    # Hard backstop: normal runtime is 2-5 min. Without this, a stalled
    # GitCode upload/verify pinned the job for 40+ min (v0.4.65). The script
    # itself bounds every network call; this catches anything it can't.
    #
    # KNOWN LIMITATION — GitCode big assets: a GitHub-hosted runner CANNOT
    # upload assets larger than ~8 MiB to GitCode (cross-border runner->OBS
    # sustains only ~15-30 KB/s and times out; proven in probe PR #371). This
    # job therefore mirrors everything to GitHub + the small GitCode assets,
    # and is fail-fast (non-blocking) on the big GitCode ones. A maintainer
    # finishes the GitCode mirror AFTER release by running, from any CN
    # environment: `tools/mirror-latest.sh xlings`. Correctness does not depend
    # on it — CN clients fall back to the GitHub asset URLs. Runbook:
    # .agents/docs/2026-07-15-gitcode-large-asset-mirror-runbook.md
    timeout-minutes: 15
    env:
      XLINGS_RES_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)" >> "$GITHUB_OUTPUT"
          fi
      # See bump-index for why `|| echo` was replaced: on 2026.7.27.0 this
      # step created the GitCode release, uploaded no assets, and reported
      # success. Every CN download 404'd.
      - name: Mirror binaries to xlings-res/xlings (gh + gtc)
        id: mirror
        if: ${{ env.XLINGS_RES_TOKEN != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
        run: |
          chmod +x tools/gtc tools/mirror_xlings_res.sh
          export PATH="$PWD/tools:$PATH"
          bash tools/mirror_xlings_res.sh "${{ steps.version.outputs.version }}"

      - name: Report mirror outcome
        if: ${{ always() && env.XLINGS_RES_TOKEN != '' }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.mirror.outcome }}" == "success" ]]; then
            echo "✅ binary mirror: \`xlings-res/xlings@$VER\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ binary mirror FAILED"
              echo
              echo "CN downloads for \`$VER\` may 404, and \`bump-index\` runs after"
              echo "this job — check whether it also reported a failure."
              echo
              echo "Recover from any CN environment:"
              echo
              echo '```'
              echo "tools/mirror-latest.sh xlings"
              echo '```'
              echo
              echo "Verify with GET (HEAD returns 401 on GitCode):"
              echo
              echo '```'
              echo "curl -sL -o /dev/null -w '%{http_code}\\n' \\"
              echo "  https://gitcode.com/xlings-res/xlings/releases/download/$VER/xlings-$VER-linux-x86_64.tar.gz"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Bump the xlings entry in the official index (openxlings/xim-pkgindex) and
  # open a PR — a maintainer merges it. On merge, the index repo republishes
  # its artifact and gitee-sync mirrors it.
  #
  # needs mirror-binaries, NOT because the index is on the critical path for
  # availability (it isn't — the res mirror + index artifact cover that), but
  # because bump_index.sh cannot do its job until the mirror exists:
  # version-check.py hashes each released asset off xlings-res before writing
  # the entry. Running the two in parallel — which is what the 2026.7.27.0
  # release did — leaves it nothing to hash, so it edits nothing, and `latest`
  # stayed at 0.4.69 while the job reported success. No user could
  # `self update` until it was re-run by hand.
  bump-index:
    needs: [create-release, mirror-binaries]
    runs-on: ubuntu-latest
    env:
      XIM_PKGINDEX_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/core/config.cppm | head -1)" >> "$GITHUB_OUTPUT"
          fi
      # continue-on-error rather than `|| echo`: still non-blocking for the
      # release, but the step is marked failed and annotated instead of
      # printing a line into a log nobody reads. `|| echo` is how a job that
      # did nothing reported 7/7 success.
      - name: Open index bump PR (xim-pkgindex)
        id: bump
        if: ${{ env.XIM_PKGINDEX_TOKEN != '' }}
        continue-on-error: true
        env:
          PKGINDEX_TOKEN: ${{ secrets.XIM_PKGINDEX_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tools/bump_index.sh
          bash tools/bump_index.sh xlings "${{ steps.version.outputs.version }}"

      - name: Report bump outcome
        if: ${{ always() && env.XIM_PKGINDEX_TOKEN != '' }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.bump.outcome }}" == "success" ]]; then
            echo "✅ index bump: \`latest\` tracks \`$VER\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ index bump FAILED — users cannot \`self update\`"
              echo
              echo "\`latest\` in xim-pkgindex may still point at the previous"
              echo "version. Recover from a clone of the index repo:"
              echo
              echo '```'
              echo "python3 .github/scripts/version-check.py --workspace \"\$PWD\" --apply --only xlings"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
