name: tmp-verify-724

# TEMPORARY, never for merge: verifies and analyses issue #724 (`luban new
# agent` fails installing xim:bun@1.3.11 in the xlings WSL carrier) against the
# published release. The draft PR that carries this file targets a throwaway
# base branch so the product CI does not run on it.

on:
  pull_request:
    branches: ['tmp/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'released xlings to test (blank = the latest)'
        required: false
        default: ''

env:
  XLINGS_NON_INTERACTIVE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  # Control: a normal Linux host (it has /lib64/ld-linux-x86-64.so.2), the
  # same recipe, the same release.
  linux-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: bun@1.3.11 on a host that has the system loader
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
        run: |
          set -u
          tag="${WANT:+v$WANT}"; [ -n "$tag" ] || tag="$(gh release view -R openxlings/xlings --json tagName -q .tagName)"
          ver="${tag#v}"
          dl="$RUNNER_TEMP/dl"; mkdir -p "$dl"
          gh release download "$tag" -R openxlings/xlings -p "xlings-$ver-linux-x86_64.tar.gz" -D "$dl"
          mkdir -p "$RUNNER_TEMP/rel" && tar -xzf "$dl/xlings-$ver-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/rel"
          export XLINGS_HOME="$(echo "$RUNNER_TEMP"/rel/xlings-*)"
          export PATH="$XLINGS_HOME/bin:$XLINGS_HOME/subos/current/bin:$PATH"
          xlings --version
          xlings self init
          echo "--- system loader"; ls -l /lib64/ld-linux-x86-64.so.2
          echo "--- install"
          xlings install xim:bun@1.3.11 -y -v 2>&1 | tail -n 40
          echo "install rc=${PIPESTATUS[0]}"
          echo "--- run"
          bun --version
          echo "--- the hook log"
          find "$XLINGS_HOME/logs" -name '*bun*' -type f -exec sh -c 'echo "--- $1"; tail -n 20 "$1"' _ {} \;

  wsl-carrier:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      WANT: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the released xlings (Windows) and its Linux build (the carrier's guest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${WANT:+v$WANT}"; [ -n "$tag" ] || tag="$(gh release view -R openxlings/xlings --json tagName -q .tagName)"
          ver="${tag#v}"
          echo "release under test: $tag"
          root="$RUNNER_TEMP/x724"
          mkdir -p "$root/dl" "$root/gdl" "$root/guest"
          gh release download "$tag" -R openxlings/xlings -p "xlings-$ver-windows-x86_64.zip" -D "$root/dl"
          gh release download "$tag" -R openxlings/xlings -p "xlings-$ver-linux-x86_64.tar.gz" -D "$root/gdl"
          # Only its two programs: a Windows file system takes no Linux links.
          mkdir -p "$root/guest/x"
          # relative paths: GNU tar reads "D:" as a remote host
          (cd "$root/guest/x" && tar -xzf ../../gdl/*.tar.gz --wildcards '*/bin/xlings' '*/bin/luban')
          bin=$(find "$root/guest/x" -path '*/bin/xlings' -type f | head -1)
          [ -n "$bin" ] || { echo "::error::no bin/xlings in the Linux build"; exit 1; }
          echo "XLINGS_CARRIER_GUEST_XLINGS=$(cygpath -w "$bin")" >> "$GITHUB_ENV"
          echo "X724_RELEASE=$tag" >> "$GITHUB_ENV"

      - name: WSL 2 (the runner's environment)
        id: wsl
        continue-on-error: true
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Alpine-3.22
          wsl-version: 2

      - name: WSL 2 (the runner's environment, again)
        id: wsl_again
        if: steps.wsl.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Alpine-3.22
          wsl-version: 2

      - name: The runner's WSL 2 is there
        if: steps.wsl.outcome != 'success' && steps.wsl_again.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::the runner's WSL 2 could not be set up twice (the environment, not xlings)"
          exit 1

      - name: setup
        shell: pwsh
        run: ./.github/tmp-verify-724/verify.ps1 setup

      - name: X3 what bun's own install.js does
        shell: pwsh
        timeout-minutes: 10
        run: ./.github/tmp-verify-724/verify.ps1 x3

      - name: X1 the report's command
        shell: pwsh
        timeout-minutes: 30
        run: ./.github/tmp-verify-724/verify.ps1 x1

      - name: X2 what the carrier has after X1
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/tmp-verify-724/verify.ps1 x2

      - name: X5 plain xlings CLI in the carrier
        if: always()
        shell: pwsh
        timeout-minutes: 15
        run: ./.github/tmp-verify-724/verify.ps1 x5

      - name: X6 interface inside the carrier
        if: always()
        shell: pwsh
        timeout-minutes: 20
        run: ./.github/tmp-verify-724/verify.ps1 x6

      - name: X7 interface relayed to Windows
        if: always()
        shell: pwsh
        timeout-minutes: 20
        run: ./.github/tmp-verify-724/verify.ps1 x7

      - name: X4 counterfactual, /lib64 linked to the abi family
        if: always()
        shell: pwsh
        timeout-minutes: 15
        run: ./.github/tmp-verify-724/verify.ps1 x4

      - name: X8 the report's command with that link
        if: always()
        shell: pwsh
        timeout-minutes: 30
        run: ./.github/tmp-verify-724/verify.ps1 x8

      - name: collect
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/tmp-verify-724/verify.ps1 collect

      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-724-wsl
          path: ${{ runner.temp }}/x724/out
          if-no-files-found: warn
