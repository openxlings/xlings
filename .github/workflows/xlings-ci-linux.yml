name: xlings-ci-linux

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

# A newer push to the same PR supersedes the run in flight; main and release
# branches keep every run (each one is a commit that landed).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # An xim-pkgindex branch whose packages are not published yet (a PR's,
  # while both PRs are in flight; the repository variable is unset when the
  # index PR merges): what CI installs its tools from (tools/ci/xlings_tools.sh)
  # and what the tool table is held to (tools/lint_tools_provenance.sh).
  XLINGS_TOOLS_INDEX_REF: ${{ vars.XLINGS_INDEX_UNDER_TEST || 'main' }}
  XLINGS_PROVENANCE_INDEX_REF: ${{ vars.XLINGS_INDEX_UNDER_TEST || 'main' }}
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp.
  #
  # ⚠️ The "known-good xlings + package index pair" this used to claim is only
  # half real: XIM_PKGINDEX_REF is DECLARED in seven workflows and actually
  # checked out in three, two of which are the Windows legs. On linux/macos
  # the index this job resolves against is whatever is current, not the pin --
  # so treat that variable as documentation, not as a lock, until it is
  # either honoured everywhere or removed.
  BOOTSTRAP_XLINGS_VERSION: v2026.8.27.5
  # Must contain the mcpp version pinned in .xlings.json (2026.10.5.3).
  XIM_PKGINDEX_REF: 81c46155bbcd66826ee590319b35d3b054e37c61

# The shape of a round (tests/README.md, "Parallel runs"):
#
#   plan ─┬─ release ─────────────┬─ e2e, isolation-fix, host-matrix, arch-package, root, filesystems,
#         │  (the one release     │  plan-distro → distro → wsl-import
#         │   build)              └─ (acceptance takes it when it is ready)
#         ├─ build ─┬─ unit (i/n) ... tests/lanes.toml [unit]: n machines, each
#         │         │                 building and running whole families of tests
#         │         └─ acceptance ... checks, then the static gates on the release
#         ├─ desktop-payloads ....... the app's and xdesk's release payloads
#         └─ build-asan ─ asan (i/n)  main and `ci:asan`: [asan], instrumented
#   report (every lane's runs, one requirement map)
#
# Built once, reused: `build` makes the development build every lane runs on,
# from the last round's state (only what changed is rebuilt), and the lanes
# take it as it is; a test shard builds only the families it runs. Nothing
# waits for what it does not use: the release build is not behind the tests.
jobs:
  # Seconds, no build: the repository's rules, and each lane's matrix from
  # tests/lanes.toml. A broken rule stops the round before any machine builds.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      unit: ${{ steps.lanes.outputs.unit }}
      asan: ${{ steps.lanes.outputs.asan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs HERE, not in xlings-ci-fresh-install.yml, because that workflow
      # deliberately has no `pull_request` trigger — a rule enforced only after
      # merge is a rule that gets merged. Milliseconds, no build, no network.
      - name: fresh-install must track the published latest
        run: bash tests/fresh-install/no_xlings_version_pin_check.sh

      # Repository rules, every tools/lint_*.sh: a subos is deleted in one
      # place (user data); system headers only in modules/platform; platform
      # selection is `if constexpr`; package layers import downward only.
      # Milliseconds, no build. A new lint joins by being a tools/lint_*.sh.
      - name: repository lints (tools/lint_*.sh)
        run: |
          rc=0
          for lint in tools/lint_*.sh; do
            echo "::group::$lint"; bash "$lint" || rc=1; echo "::endgroup::"
          done
          exit $rc

      # Shards are weighed by measured durations (main's latest report), taken
      # once here so every shard of the round divides the same way.
      - name: Measured durations, from main's history
        uses: actions/cache/restore@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}
          restore-keys: xdev-history-v1-linux-

      - name: Attach them for the shards
        if: hashFiles('target/xdev/history/timings.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: linux-shard-timings
          path: target/xdev/history/timings.json

      - name: Lanes (tests/lanes.toml)
        id: lanes
        run: |
          for lane in unit asan; do
            echo "$lane=$(python3 tools/ci/lane_matrix.py "$lane")" | tee -a "$GITHUB_OUTPUT"
          done

  # The ONE release build of this commit on Linux x86_64, and nothing else:
  # every lane that runs the release (e2e, distro, the host matrix, the
  # Windows WSL 2 lane, acceptance) starts the moment it is attached.
  release:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      release_ready: ${{ steps.candidate.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          mcpp-cache: mcpp-v4-ci-linux-release-


      # The candidate and the static xdev the downstream lanes run, from the
      # last round's release build when there is one (only what changed is
      # rebuilt; a published release is built from nothing, release.yml).
      - name: The release candidate
        uses: ./.github/actions/linux-build
        with:
          profile: release
          state: produce
          attach: 'false'

      - name: Prepare release artifact
        run: |
          tarball=$(ls build/xlings-*-linux-x86_64.tar.gz 2>/dev/null | head -1)
          [[ -z "$tarball" ]] && { echo "No release tarball found"; exit 1; }
          cp "$tarball" build/release.tar.gz

      - name: Candidate cold-home lifecycle
        id: candidate
        run: |
          sha256sum build/release.tar.gz > build/release.tar.gz.sha256
          bash tests/candidate-install/smoke.sh \
            build/release.tar.gz build/release.tar.gz.sha256

      - name: Attach artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xlings-linux-x86_64
          path: |
            build/release.tar.gz
            build/xlings-*-linux-x86_64.tar.gz

      - name: Attach xdev
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xdev-linux-build
          path: target/xdev/runner/bin/xdev

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

  # The development build every test lane runs on, once per round: from the
  # last round's state, only what changed since is rebuilt
  # (.github/actions/linux-build); the lanes that need it take it as it is.
  build:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          sandbox: 'false'

      - name: The development build
        uses: ./.github/actions/linux-build
        with:
          state: produce

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

  # The Luban OS app's and xdesk's release payloads, as release.yml makes
  # them (a glibc program, the system's loader, no RPATH, its NEEDED
  # checked): a release must not be the first to find the packaging broken.
  # Its own optimized build, beside the others.
  desktop-payloads:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          mcpp-cache: mcpp-v4-ci-linux-desktop-
          sandbox: 'false'

      - name: Luban OS and xdesk release payloads
        run: |
          bash tools/ci/xlings_tools.sh patchelf
          mcpp build -p luban-os --profile dist
          bash luban/tools/luban_os_release.sh
          mcpp build -p xdesk-app --profile dist
          bash luban/tools/xdesk_release.sh

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

  # The same for the instrumented build, where the asan lane runs.
  build-asan:
    needs: plan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:asan')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          mcpp-cache: mcpp-v4-ci-linux-asan-
          sandbox: 'false'
          room: 'true'

      - name: The instrumented build
        uses: ./.github/actions/linux-build
        with:
          profile: asan
          state: produce

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

  # The C++ tests, over tests/lanes.toml [unit].shards machines. Each takes
  # the round's build, builds its share of the test binaries a family per
  # mcpp call, and runs them [unit].jobs at a time.
  unit:
    needs: [plan, build]
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.unit) }}
    env:
      # The capabilities this lane promises (tests/README.md): a test that
      # needs one of them and finds it missing FAILS instead of skipping.
      XDEV_LANE: linux-unit
      XDEV_LANE_CAPS: linux,posix,pty,xlings-bin,userns,bwrap,sandbox,pasta,landlock,network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          save: 'false'


      - name: The round's development build
        uses: ./.github/actions/linux-build
        with:
          state: consume

      - name: The fonts Luban OS ships (its layout baselines')
        run: bash tools/ci/luban_fonts.sh

      - name: Measured durations, as the plan job took them
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-shard-timings
          path: ${{ runner.temp }}/timings

      - name: Tests (shard ${{ matrix.shard }})
        run: |
          shard='${{ matrix.shard }}'
          timings=()
          [[ -f "$RUNNER_TEMP/timings/timings.json" ]] && timings=(--timings "$RUNNER_TEMP/timings/timings.json")
          "$XDEV" test --lane-config unit --shard "$shard" "${timings[@]}" --out "target/xdev/linux-unit-${shard%%/*}"

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-unit-${{ strategy.job-index }}
          path: target/xdev/
          if-no-files-found: ignore

      # The Luban OS window as its tests saw it (every view, three sizes,
      # English and Chinese, a desktop and the Host key's menu): for people.
      - name: Attach the Luban OS screenshots
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('target/xtest-artifacts/luban-os/**') != ''
        with:
          name: luban-os-screenshots
          path: target/xtest-artifacts/luban-os/

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

  # What runs on a development build and needs no release (xdev's own tests,
  # the contract scripts, openkal beside this toolchain, the lints as
  # evidence), then the static gates on the release build, fetched as soon as
  # the release job attaches it.
  acceptance:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          save: 'false'


      - name: The round's development build
        uses: ./.github/actions/linux-build
        with:
          state: consume

      - name: The fonts Luban OS ships (its layout baselines')
        run: bash tools/ci/luban_fonts.sh

      - name: The static gates' programs
        run: |
          # Built now, run on the release build once it is attached.
          for test in e2e/test_domain_source e2e/test_domain_producer e2e/test_subos_perf e2e/test_home_perf \
                      unit/test_root_generation_perf e2e/test_luban; do
            mcpp test --no-run "$test"
          done

      - name: xdev's own tests
        run: |
          mkdir -p target/xdev/linux-xdev
          printf '{"name":"linux-xdev","platform":"linux","run":"%s:%s","probes":{}}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > target/xdev/linux-xdev/lane.json
          # XDEV_BIN: the CLI cases drive the xdev just built.
          XDEV_BIN="$XDEV" \
          XTEST_META_OUT="$GITHUB_WORKSPACE/target/xdev/linux-xdev/meta.ndjson" \
          XTEST_RESULTS_OUT="$GITHUB_WORKSPACE/target/xdev/linux-xdev/cases.ndjson" \
            mcpp test -p xdev

      - name: Multiplatform contract scripts
        env:
          XDEV_LANE: linux-contracts
        run: |
          "$XDEV" test --no-mcpp --suite contract-scripts --out target/xdev/linux-contracts

      # openkal beside this toolchain's runtimes (design part 3 §4.3): glibc,
      # and the static musl target the release uses.
      - name: openkal coexistence (OPENKAL-COEXIST)
        run: |
          cd tools/openkal-coexistence
          for target in "" "--target x86_64-linux-musl"; do
            mcpp build $target
            bin="$(find target -path '*/bin/openkal-coexistence' -type f -newer mcpp.toml | xargs ls -t | head -1)"
            out="$("$bin")"
            echo "$out"
            grep -qx 'libstdc++ says: hello' <<<"$out"
            grep -qx 'openkal says: hello' <<<"$out"
            grep -q '^kal_version=' <<<"$out"
          done

      # The same repository lints as the plan job, through xdev this time,
      # so what they cover (LAYOUT-DEPS ...) is evidence in the requirement
      # report and not only a green step.
      - name: Repository lints (requirement evidence)
        env:
          XDEV_LANE: linux-lint
        run: |
          "$XDEV" test --no-mcpp --suite lint --out target/xdev/linux-lint

      - name: The release build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/ci/await_artifact.sh xlings-linux-x86_64 release candidate
          tar -xzf candidate/release.tar.gz -C candidate
          candidate="$(find "$GITHUB_WORKSPACE/candidate" -path '*/bin/xlings' -type f | head -1)"
          test -x "$candidate"
          echo "XLINGS_BIN=$candidate" >> "$GITHUB_ENV"

      - name: Static domain lifecycle, checked system source and image export
        id: static_domain
        continue-on-error: true
        env:
          XDEV_LANE: linux-static-domain
        run: |
          status=0
          "$XDEV" test e2e/test_domain_source --no-build --require-metadata \
            --out target/xdev/linux-static-domain || status=$?
          "$XDEV" test e2e/test_domain_producer --no-build --require-metadata \
            --out target/xdev/linux-static-domain-producer || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = [json.loads(line) for directory in ('linux-static-domain', 'linux-static-domain-producer')
                     for line in Path(f'target/xdev/{directory}/cases.ndjson').read_text().splitlines()]
          for case in ('DomainSourceProducer.ReusesOnlyCheckedReadonlyBytesAndExportsAnOwnedImage',
                       'RootExport.OwnsBorrowedClosureAndOmitsOtherScopeVersions',
                       'DomainProducer.InstallsAtLogicalPrefixInsideANamespaceAndPreservesHostData'):
              checked = [row for row in results if row.get('test') == case]
              assert len(checked) == 1 and checked[0]['status'] == 'pass', f'{case} must actually pass'
          PY
          exit "$status"

      - name: Static SubOS performance budgets
        id: static_perf
        continue-on-error: true
        env:
          XDEV_LANE: linux-static-perf
        run: |
          # Timing budgets are asserted here, where each case runs alone --
          # and after what the steps before wrote has reached the disk: a
          # build's writeback under a 5 ms budget is the runner measured, not
          # xlings (median 5.14 ms once, right after a release payload build).
          sync
          export XLINGS_PERF_BUDGETS=1
          status=0
          "$XDEV" test e2e/test_subos_perf --no-build --require-metadata \
            --out target/xdev/linux-static-perf || status=$?
          "$XDEV" test unit/test_root_generation_perf --no-build --require-metadata \
            --out target/xdev/linux-static-generation-perf || status=$?
          # A home of 5,000 registrations and 10 projects: one package's
          # use / install / remove / doctor within their budgets.
          "$XDEV" test e2e/test_home_perf --no-build --require-metadata \
            --out target/xdev/linux-static-home-perf || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          for directory, count in (('linux-static-perf', 4), ('linux-static-generation-perf', 3),
                                   ('linux-static-home-perf', 1)):
              results = [json.loads(line) for line in Path(f'target/xdev/{directory}/cases.ndjson').read_text().splitlines()]
              assert len(results) == count and all(row['status'] == 'pass' for row in results), results
          PY
          exit "$status"

      # Luban OS as a first-time user meets it: the quick start makes a real
      # system (downloaded, set up), its console opens and runs what is typed;
      # an exported system is imported and has what it carried. With the
      # release client: a development build cannot enter a root.
      - name: Luban OS first use, with the release client
        id: first_use
        env:
          XDEV_LANE: linux-luban-os-first-use
          XDEV_LANE_CAPS: linux,posix,pty,xlings-bin,static-xlings,userns,bwrap,sandbox,network
        run: |
          "$XDEV" test e2e/test_luban --no-build --require-metadata --out target/xdev/linux-luban-os-first-use

      - name: Attach the runs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-acceptance
          path: target/xdev/
          if-no-files-found: ignore

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

      - name: Require every static acceptance gate
        if: always()
        env:
          DOMAIN_OUTCOME: ${{ steps.static_domain.outcome }}
          PERF_OUTCOME: ${{ steps.static_perf.outcome }}
        run: |
          for outcome in "$DOMAIN_OUTCOME" "$PERF_OUTCOME"; do
            [[ "$outcome" == success ]] || { echo "::error::static acceptance is incomplete or failed"; exit 1; }
          done

  # The shell e2e suite, against the release build.
  e2e:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The runner's own tools (T0; nothing installed)
        run: |
          for t in curl git cc make jq tar xz python3; do command -v "$t" >/dev/null || { echo "::error::the runner image has no $t"; exit 1; }; done

      - name: Fetch the release artifact and xdev
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Prepare fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          bin="$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)"
          [[ -x "$bin" ]] || { echo "::error::no bin/xlings in the release artifact"; exit 1; }
          echo "XLINGS_BIN=$bin" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: "E2E-01: Bootstrap Home (portable + installed)"
        run: |
          bash tests/e2e/bootstrap_home_test.sh

      - name: "E2E suite (E2E-02..E2E-42, timed)"
        run: |
          "$XDEV" test --no-mcpp --suite e2e-shell --tarball build/release.tar.gz \
            --out target/xdev/linux-e2e

      - name: Attach the e2e run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-e2e
          path: target/xdev/
          if-no-files-found: ignore

  # The root repair for AppArmor-restricted user namespaces, on a runner
  # left exactly as the image ships it (#640's comment). It installs
  # /usr/lib/xlings/bwrap and an AppArmor profile with sudo, which is why it
  # has a runner of its own.
  isolation-fix:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-isolation-fix
      XDEV_LANE_CAPS: linux,xlings-bin,sudo,network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          echo "XLINGS_BIN=$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: self doctor --isolation --fix
        run: |
          "$XDEV" test --no-mcpp --suite isolation-fix --require-metadata --out target/xdev/linux-isolation-fix

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-isolation-fix
          path: target/xdev/
          if-no-files-found: ignore

  # The host matrix's smoke legs on this build (Luban OS design part 2 §5):
  # Ubuntu 24.04 with its user-namespace restriction as shipped, and a
  # Fedora userland -- each as an ordinary user without sudo. Every leg:
  # nightly and on demand (xlings-ci-host-matrix.yml).
  host-matrix:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    uses: ./.github/workflows/xlings-ci-host-matrix.yml
    with:
      # The label `host-matrix-full` runs every x86_64 leg on this build.
      legs: ${{ contains(github.event.pull_request.labels.*.name, 'host-matrix-full') && 'full' || 'smoke' }}
      artifact: xlings-linux-x86_64

  # xlings as the root user (design 2026-06-21-root-privilege-identity): the
  # release build in a bare ubuntu:24.04 root container with no sudo, so the
  # run exercises the root / sudo identity layer itself (P0-1: no sudo
  # dependency; P0-2: sudo chown-back). It was a workflow of its own that
  # built xlings and ran the unit suite a second time to get here.
  root:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04        # default user is root (uid 0); no sudo preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minimal deps for the e2e harness — deliberately NOT installing sudo,
      # so the pure-root scenario proves xlings never depends on it.
      - name: Install minimal deps (no sudo)
        run: |
          apt-get update -qq
          apt-get install -y curl ca-certificates tar findutils perl git  # host-dep-ok: a bare container, prepared to install xlings
          echo "sudo intentionally NOT installed:"; command -v sudo || echo "  (absent — good)"

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Confirm running as root
        run: |
          id
          [ "$(id -u)" -eq 0 ] || { echo "expected uid 0"; exit 1; }

      - name: "ROOT-01: root usability (pure root + simulated sudo)"
        run: |
          bash tests/e2e/root_usability_test.sh build/release.tar.gz

  # A home where people put one (design 2026-10-15-filesystem-capabilities):
  # on NFSv3, without renameat2's flags (mcpp-community/mcpp#809), what a
  # package places is still published and never over what is there; on FAT,
  # without symbolic links, the home is refused at its making with what to do.
  filesystems:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: An NFSv3 export of this runner and a FAT image, mounted
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nfs-kernel-server dosfstools  # host-dep-ok: the filesystems under test are the runner's
          sudo mkdir -p /srv/nfs /mnt/nfs /mnt/fat
          sudo chown "$(id -u):$(id -g)" /srv/nfs
          echo "/srv/nfs 127.0.0.1(rw,sync,no_subtree_check,all_squash,anonuid=$(id -u),anongid=$(id -g))" | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo mount -t nfs -o vers=3,nolock,local_lock=all 127.0.0.1:/srv/nfs /mnt/nfs
          truncate -s 64M "$RUNNER_TEMP/fat.img"
          mkfs.vfat "$RUNNER_TEMP/fat.img"
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" "$RUNNER_TEMP/fat.img" /mnt/fat
          grep -E " /mnt/(nfs|fat) " /proc/mounts

      - name: "NFSv3: install, place, remove"
        run: bash tests/e2e/nfs_home_test.sh build/release.tar.gz /mnt/nfs

      - name: "FAT: refused at its making"
        run: bash tests/e2e/fat_home_test.sh build/release.tar.gz /mnt/fat

  # Deployment S as a distribution ships it (design part 2 §5): the AUR
  # recipe built from THIS build's release artifact, installed with pacman,
  # used by two users. Replaces xlings-ci-archlinux.yml, which ran only when
  # config/aur changed and built a 0.4.14 download.
  arch-package:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      XDEV_LANE: linux-arch-package
      XDEV_LANE_CAPS: linux,root,network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Package, install, use
        run: |
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          "$xdev" test --no-mcpp --suite aur --tarball build/release.tar.gz \
            --out target/xdev/linux-arch-package

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-arch-package
          path: target/xdev/
          if-no-files-found: ignore

  # The root projection (SubOS design part 2): Luban roots from the published
  # editions -- entered in bwrap, exported to docker, booted under qemu with
  # their own kernel -- against THIS build's release binary (static: an
  # exported image's xlings runs with no host under it).
  plan-distro:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact
      - name: Restore measured main-branch shard weights
        uses: actions/cache/restore@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}
          restore-keys: xdev-history-v1-linux-
      - name: Plan root scenarios with the local selector
        id: plan
        run: |
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          test -n "$xdev"
          chmod +x "$xdev"
          weights=()
          if [[ -f target/xdev/history/timings.json ]]; then weights+=(--timings target/xdev/history/timings.json); fi
          matrix="$("$xdev" ci plan --no-mcpp --suite distro --platform linux --lane main --shards "$(python3 tools/ci/lane_matrix.py --count distro)" --require-metadata "${weights[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  distro:
    needs: [release, plan-distro]
    if: ${{ !cancelled() && needs.release.outputs.release_ready == 'true' && needs.plan-distro.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-distro.outputs.matrix) }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-distro-${{ strategy.job-index }}
      XDEV_LANE_CAPS: linux,xlings-bin,bwrap,userns,network,docker,qemu,sudo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Lane capabilities (bwrap, qemu, kvm)
        run: |
          # Every tool from the index (tools/ci/xlings_tools.sh): the images
          # themselves are written in-process (no xorriso, no qemu-img).
          bash tools/ci/xlings_tools.sh bwrap qemu-system e2fsprogs edk2-firmware limine
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # KVM when the runner has it: a boot in seconds instead of a minute.
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          echo "XLINGS_BIN=$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: Roots, images, boots
        run: |
          "$XDEV" test --no-mcpp --suite distro --lane main --shard '${{ matrix.shard }}' \
            --require-metadata --out target/xdev/linux-distro-${{ strategy.job-index }}

      # The luban-tiny tarball the image scenario exported, for wsl --import.
      - name: Attach the root tarball
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luban-tiny-tar
          path: /tmp/xlings-e2e-*/rootfs_image/tiny.tar.gz
          if-no-files-found: ignore

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-distro-${{ strategy.job-index }}
          path: target/xdev/
          if-no-files-found: ignore

  # EXPORT-WSL (design part 2 §13): the tarball a Linux build exported,
  # imported by Windows -- on WSL 2, which the hosted Windows runners have
  # (#672: the WSL1 action this lane used answered 403 on every run, and the
  # check it ran never read the root's os-release). Blocking: a failed import
  # or run is red. WSL 2 that cannot be set up twice is the environment's,
  # said by its own step, as in xlings-ci-windows.yml's luban-wsl2 lane.
  wsl-import:
    needs: distro
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Fetch the root tarball
        uses: actions/download-artifact@v4
        with:
          name: luban-tiny-tar
          path: root

      - name: WSL 2 (the runner's environment)
        id: setup
        continue-on-error: true
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Alpine-3.22
          wsl-version: 2

      - name: WSL 2 (the runner's environment, again)
        id: setup_again
        if: steps.setup.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Alpine-3.22
          wsl-version: 2

      - name: The runner's WSL 2 is there
        if: steps.setup.outcome != 'success' && steps.setup_again.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::the runner's WSL 2 could not be set up twice (the environment, not xlings): see the two setup steps"
          exit 1

      # --exec: the command line goes to /bin/sh as argv, not through the
      # distribution's default shell, which expanded $ID before the root's
      # os-release was read.
      - name: wsl --import, run
        id: run
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          $tar = Get-ChildItem -Recurse root -Filter tiny.tar.gz | Select-Object -First 1
          if (-not $tar) { throw "no tarball from the distro job" }
          New-Item -ItemType Directory -Force C:\luban | Out-Null
          wsl --import luban C:\luban $tar.FullName --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed" }
          $out = (wsl -d luban --exec /bin/sh -c '. /etc/os-release; echo "os=$ID/$VARIANT_ID"; xlings --version') -join "`n"
          $out
          if (-not ($out -match "os=luban/tiny")) { throw "not luban tiny: $out" }
          if (-not ($out -match "(?m)^xlings ")) { throw "no xlings: $out" }

      - name: Record
        if: always()
        shell: pwsh
        run: |
          $dir = "target/xdev/windows-wsl"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $name = "wsl: subos export --tar imports with wsl --import (WSL 2)"
          ('{"name":"windows-wsl","platform":"windows","run":"' + $env:GITHUB_RUN_ID + ':' + $env:GITHUB_RUN_ATTEMPT + '","probes":{}}') | Set-Content "$dir/lane.json"
          ('{"test":"' + $name + '","area":"scenario","covers":["EXPORT-WSL"],"requires":[],"proves":"flow"}') | Set-Content "$dir/meta.ndjson"
          if ("${{ steps.run.outcome }}" -eq "success") { $st = "pass"; $msg = "" }
          elseif ("${{ steps.setup.outcome }}" -ne "success" -and "${{ steps.setup_again.outcome }}" -ne "success") { $st = "fail"; $msg = "the runner's WSL 2 could not be set up (the environment)" }
          else { $st = "fail"; $msg = "the import or the run failed; see the job log" }
          ('{"test":"' + $name + '","status":"' + $st + '","ms":0,"message":"' + $msg + '"}') | Set-Content "$dir/scripts.ndjson"

      - name: Attach the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdev-linux-wsl
          path: target/xdev/

  # One report for the Linux lanes, in the step summary.
  report:
    needs: [release, build, unit, acceptance, asan, e2e, isolation-fix, arch-package, distro, wsl-import]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the latest artifact for each lane
        id: lane-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            | python3 tools/ci/select_run_artifacts.py xdev-linux- > "$RUNNER_TEMP/lane-artifact-ids"
          echo "ids=$(cat "$RUNNER_TEMP/lane-artifact-ids")" >> "$GITHUB_OUTPUT"

      - name: Fetch the runs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.lane-artifacts.outputs.ids }}
          path: runs

      - name: Restore main-branch execution history
        uses: actions/cache/restore@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}
          restore-keys: xdev-history-v1-linux-

      - name: Report
        run: |
          xdev="$(find runs -name xdev -type f | head -1)"
          [[ -n "$xdev" ]] || { echo "no xdev binary: the build job failed before building it"; exit 1; }
          chmod +x "$xdev"
          args=()
          for d in $(find runs -name lane.json -exec dirname {} \;); do args+=(--in "$d"); done
          # --fail-uncovered: a `required` ID in tests/requirements.toml (xlings')
          # or luban/tests/requirements.toml (Luban's) with no test, or a test
          # naming an ID neither declares, fails.
          history=()
          if [[ -f target/xdev/history/trend.json ]]; then history+=(--trend target/xdev/history/trend.json); fi
          mkdir -p target/xdev/current-report
          status=0
          "$xdev" report "${args[@]}" "${history[@]}" --summary \
            --requirements tests/requirements.toml --requirements luban/tests/requirements.toml --fail-uncovered \
            --write target/xdev/current-report --timings-out target/xdev/current-report/timings.json || status=$?
          python3 - <<'PY' || status=1
          import json
          from pathlib import Path
          report = json.loads(Path('target/xdev/current-report/report.json').read_text())
          # Windows quoting has its own mandatory Windows gate.
          elsewhere = {'SUBOS-CMD-WIN-QUOTING'}
          missing = [name for name, evidence in report['requirements'].items()
                     if name not in elsewhere and not evidence['passed_by']]
          assert not missing, f'required behavior lacks passing execution evidence: {missing}'
          PY
          if [[ -f target/xdev/current-report/trend.json && -f target/xdev/current-report/timings.json ]]; then
            mkdir -p target/xdev/history
            cp target/xdev/current-report/{trend,timings}.json target/xdev/history/
          fi
          exit "$status"

      - name: Attach reports and retained trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdev-linux-report
          path: target/xdev/current-report
          retention-days: 90
          if-no-files-found: ignore

      - name: Retain main-branch trends for subsequent plans
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('target/xdev/history/trend.json') != ''
        uses: actions/cache/save@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}

  # The C++ tests instrumented (mcpp.toml `[profile.asan]`, issue #433: a
  # use-after-free reached three releases undetected because nothing ran the
  # tests instrumented), over tests/lanes.toml [asan].shards machines: the
  # instrumented build is most of the time, and a shard builds only its
  # families. Off the PR critical path: every push to main and release/**,
  # and a PR labelled `ci:asan`. A HARD gate: a failure on main is a
  # regression to revert or fix at once.
  #
  # Its own mcpp cache key prefix: BMIs compiled with
  # `-fsanitize=address,undefined` are not interchangeable with the dev
  # profile's (the "CRC mismatch" failure mode), so no restore can hand one
  # profile's BMIs to the other.
  asan:
    needs: [plan, build-asan]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:asan')
    name: asan (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.asan) }}
    env:
      XDEV_LANE: linux-asan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain
        with:
          save: 'false'
          mcpp-cache: mcpp-v4-ci-linux-asan-
          sandbox: 'false'
          room: 'true'

      - name: The round's instrumented build
        uses: ./.github/actions/linux-build
        with:
          profile: asan
          state: consume

      - name: The fonts Luban OS ships (its layout baselines')
        run: bash tools/ci/luban_fonts.sh

      - name: Measured durations, as the plan job took them
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-shard-timings
          path: ${{ runner.temp }}/timings

      - name: Tests (asan, shard ${{ matrix.shard }})
        run: |
          shard='${{ matrix.shard }}'
          timings=()
          [[ -f "$RUNNER_TEMP/timings/timings.json" ]] && timings=(--timings "$RUNNER_TEMP/timings/timings.json")
          "$XDEV" test --lane-config asan --shard "$shard" "${timings[@]}" --out "target/xdev/linux-asan-${shard%%/*}"

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-asan-${{ strategy.job-index }}
          path: target/xdev/
          if-no-files-found: ignore

      - name: Diagnose a failed mcpp build
        if: failure()
        run: bash tools/ci/diagnose_mcpp.sh

      # E2E-00: a fresh mcpp home builds xlings for the musl target. The PR
      # build jobs and the release build prove the same build with the same
      # mcpp, so it runs where the instrumented build runs: on main, once.
      - name: "E2E-00: mcpp builds xlings from source (fresh mcpp home)"
        if: github.event_name == 'push' && startsWith(matrix.shard, '1/')
        run: |
          bash tests/e2e/prepare_fixture_index.sh
          bash tests/e2e/mcpp_build_xlings_test.sh

      - name: Sanitizer verdict
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### asan ${{ matrix.shard }}: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### asan ${{ matrix.shard }}: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
