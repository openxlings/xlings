name: xlings-ci-linux

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

# A newer push to the same PR supersedes the run in flight; main and release
# branches keep every run (each one is a commit that landed).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp.
  #
  # ⚠️ The "known-good xlings + package index pair" this used to claim is only
  # half real: XIM_PKGINDEX_REF is DECLARED in seven workflows and actually
  # checked out in three, two of which are the Windows legs. On linux/macos
  # the index this job resolves against is whatever is current, not the pin --
  # so treat that variable as documentation, not as a lock, until it is
  # either honoured everywhere or removed.
  BOOTSTRAP_XLINGS_VERSION: v2026.8.27.5
  # Must contain the mcpp version pinned in .xlings.json (2026.10.5.3).
  XIM_PKGINDEX_REF: ebf1fbb3417ec513b923279044433887b3af8850

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    outputs:
      release_ready: ${{ steps.candidate.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs HERE, not in xlings-ci-fresh-install.yml, because that workflow
      # deliberately has no `pull_request` trigger — a rule enforced only after
      # merge is a rule that gets merged. Milliseconds, no build, no network.
      - name: fresh-install must track the published latest
        run: bash tests/fresh-install/no_xlings_version_pin_check.sh

      # Repository rules, every tools/lint_*.sh: a subos is deleted in one
      # place (user data); system headers only in modules/platform; platform
      # selection is `if constexpr`; package layers import downward only.
      # Milliseconds, no build. A new lint joins by being a tools/lint_*.sh.
      - name: repository lints (tools/lint_*.sh)
        run: |
          rc=0
          for lint in tools/lint_*.sh; do
            echo "::group::$lint"; bash "$lint" || rc=1; echo "::endgroup::"
          done
          exit $rc

      # ── Phase 1: Configure Environment via xlings ─────────────────

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          # Retried, piped through a file, and asserted -- three fixes for one
          # failure mode. `curl … | bash` reports the exit status of BASH, and
          # bash fed an empty stdin exits 0, so a network reset installs
          # nothing and the step goes GREEN. Measured on the 2026.9.4.1
          # release: `curl: (35) Recv failure: Connection reset by peer` here,
          # step reported success, and the run died two steps later with
          # `xlings: command not found` (exit 127) pointing at the wrong
          # thing entirely.
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 \
              https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
              -o /tmp/xlings-quick-install.sh && break
            echo "bootstrap download failed (attempt $attempt/3); retrying"
            sleep 10
          done
          test -s /tmp/xlings-quick-install.sh \
            || { echo "::error::could not download quick_install.sh"; exit 1; }
          bash /tmp/xlings-quick-install.sh
          # The assertion that makes a silent no-op impossible: whatever the
          # installer thought it did, the binary either exists here or it does
          # not.
          test -x "$HOME/.xlings/bin/xlings" \
            || { echo "::error::bootstrap reported success but installed no xlings"; exit 1; }
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        id: mcpp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            !~/.mcpp/bmi
            !~/.mcpp/build-cache
            .mcpp
            !.mcpp/bmi
            !.mcpp/build-cache
          # BMIs are NOT cached, and are deleted after every restore. That
          # is the fix, and it took three prefix retirements to find.
          #
          # A restored BMI set never works. `import 'std' has CRC mismatch`
          # follows, which reads like a compiler bug. What hid it is that the
          # old guard wiped the BMIs on an INEXACT restore -- so retiring the
          # key prefix forced an inexact restore, fired the guard, and produced
          # one clean run. Each retirement therefore looked like a fix and was
          # an accident; the next run got an exact hit, skipped the guard, and
          # failed again. Read straight off two consecutive runs of THIS
          # workflow: the one that passed shows "Drop stale BMIs" as `success`,
          # the one that failed shows it `skipped`.
          #
          # So the wipe is unconditional now, and the BMI directories are
          # excluded from the cache as well -- the exclusion is an optimisation
          # (do not store bytes we delete on arrival), the unconditional wipe is
          # the guarantee, and it cannot depend on exclude-pattern semantics.
          #
          # What the cache is FOR is `registry/data/xpkgs`: ~800 MB of payloads
          # that are toolchain-independent and survive a round trip fine.
          #
          # The key still names the workflow that produced it. mcpp.toml
          # declares both the dev toolchain (gcc@16.1.0) and the release target
          # (gcc@15.1.0-musl), so a CI build and a release build hash the same
          # -- sharing one key across workflows is wrong on its own terms even
          # though it was not what caused this.
          key: mcpp-v4-ci-linux-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-v4-ci-linux-${{ runner.os }}-
      # An inexact restore (the `restore-keys` fallback) brings BMIs built
      # under a different dependency set. Mixing them with anything rebuilt
      # here fails as `import 'std' has CRC mismatch` — which reads like a
      # compiler bug and is a cache restored for the wrong inputs. Measured on
      # PR #480, where `mcpplibs.xpkg` went 0.0.47 → 0.0.48: the fallback
      # cache's tinyhttps/cmdline BMIs no longer matched the `std` the fresh
      # xpkg build produced.
      #
      # Only the BMIs go. The payload store under registry/data/xpkgs is
      # dependency-independent and is what makes the ~800 MB cache worth
      # restoring at all.
      # Evidence for task #56, gathered where the failure actually happens.
      #
      # Four hypotheses were refuted on a developer machine (2026-08-06): two
      # toolchains sharing one BMI store; the tar round trip destroying
      # metadata (the .gcm set survives byte-for-byte, mtimes included); a full
      # project rebuild against restored BMIs; and prune_registry running after
      # the restore. None reproduces it locally, so the next honest step is to
      # record what CI has that a laptop does not, rather than guess a fifth
      # hypothesis.
      #
      # What to look for: two entries that disagree on driver_identity or
      # sysroot for the same cpp_standard. That would mean the restored set is
      # internally inconsistent, which is the answer.
      #
      # continue-on-error on purpose: a diagnostic must never be the reason a
      # release is blocked. Set XLINGS_KEEP_RESTORED_BMIS=1 on a throwaway
      # branch to skip the wipe below and let the failure happen with this
      # record in hand.
      - name: Record the restored BMI set (diagnostic for #56)
        shell: bash
        continue-on-error: true
        run: |
          echo "cache-hit: ${{ steps.mcpp-cache.outputs.cache-hit }}"
          for d in ~/.mcpp/bmi .mcpp/bmi ~/.mcpp/build-cache .mcpp/build-cache; do
            if [ -d "$d" ]; then
              echo "  $d: $(du -sh "$d" 2>/dev/null | cut -f1), $(find "$d" -name '*.gcm' 2>/dev/null | wc -l) .gcm"
            else
              echo "  $d: absent"
            fi
          done
          echo "  --- build identity per BMI dir (first 40) ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null | head -40 |
          while read -r f; do
            printf '  %-18s %s %s\n' \
              "$(basename "$(dirname "$f")")" \
              "$(grep -o '"cpp_standard": *"[^"]*"' "$f" | cut -d'"' -f4)" \
              "$(grep -o '"driver_identity": *"[^"]*"' "$f" | cut -d'"' -f4)"
          done
          echo "  --- distinct driver identities ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null |
            xargs -r grep -ho '"driver_identity": *"[^"]*"' | sort -u

      - name: Drop restored BMIs
        if: env.XLINGS_KEEP_RESTORED_BMIS != '1'
        shell: bash
        run: |
          rm -rf ~/.mcpp/bmi ~/.mcpp/build-cache .mcpp/bmi .mcpp/build-cache

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings config --mirror GLOBAL
          # Refresh the index before resolving anything out of it.
          #
          # Without this the run resolves against whatever index snapshot the
          # bootstrap shipped with, which is not the one this PR needs: a
          # freshly published `mcpplibs.xpkg@0.0.50` reported as "not found"
          # while older entries from the same index downloaded fine. The
          # failure names the package, so it reads as an unpublished
          # dependency rather than as an index nobody refreshed.
          xlings update || true
          xlings install -y

          # Installing is not switching, and this cache makes the difference
          # visible. `xlings install` lays the payload down; the shim keeps
          # resolving whatever version was already active -- the client says so
          # ("installed, but 'x' still resolves to ..."), and with ~/.mcpp
          # restored from a cache that line is the ONLY sign that the mcpp
          # about to run is the old one. Measured 2026-08-06: .xlings.json
          # pinned 2026.8.6.1 while the run used the cached build, whose index
          # snapshot predated the dependency this PR needs -- surfacing as
          # `mcpplibs.xpkg@0.0.53 not found` against an index that demonstrably
          # had it.
          # The pin comes from .xlings.json at runtime, not a literal -- a
          # literal here is a value that changes, and the next mcpp bump would
          # leave every workflow switching to the previous one.
          pin="$(python3 -c 'import json;print(json.load(open(".xlings.json"))["workspace"]["mcpp"])' 2>/dev/null || true)"
          [ -n "$pin" ] && xlings use mcpp "$pin" || true

          mcpp self version

      - name: Reinitialize mcpp registry (GLOBAL)
        run: |
          # Drop the resolved indexes and mirror config so they are
          # re-resolved against GLOBAL, but KEEP registry/data/xpkgs -- the
          # downloaded and extracted package payloads.
          #
          # Those payloads are sha256-pinned by their recipe, so they are
          # mirror-independent: keeping them cannot leak a CN artifact into a
          # GLOBAL build. Wiping them made every run re-fetch every transitive
          # source from its upstream host, so CI failed wholesale whenever one
          # of those hosts was unreachable -- e.g. compat.bzip2 (a transitive
          # dep of compat.libarchive, and absent from mcpp.lock, which only
          # pins direct deps) fetched from sourceware.org. It also made the
          # ~800 MB mcpp cache restored one step earlier almost worthless.
          prune_registry() {
            [ -d "$1" ] || return 0
            find "$1" -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
            [ -d "$1/data" ] || return 0
            find "$1/data" -mindepth 1 -maxdepth 1 ! -name xpkgs -exec rm -rf {} +
          }
          prune_registry "$HOME/.mcpp/registry"
          prune_registry "$GITHUB_WORKSPACE/.mcpp/registry"
          mcpp self config --mirror GLOBAL

          # Force the index refresh, then ASSERT what landed.
          #
          # The prune above drops the resolved indexes, and mcpp's own
          # re-fetch happily uses whatever it finds in the restored cache --
          # so a freshly published dependency reads as "not found" against an
          # index that demonstrably has it. Measured 2026-08-06:
          # `mcpplibs.xpkg@0.0.53 not found`, while the index commit, the
          # published artifact, the rolling pointer and releases/latest all
          # carried the entry.
          #
          # `mcpp index update` is the refresh; `mcpp index status` prints the
          # revision each index landed on, which is the one datum that makes a
          # stale-index failure readable instead of surfacing two layers away
          # as `<pkg>@<ver> not found`.
          mcpp index update || true
          mcpp index status || true
          # PER PLATFORM, not a whole-file grep.
          #
          # A grep for `["0.0.53"]` passes on a file where the entry exists
          # only under `xpm.linux` -- which is exactly the bug this assert was
          # written to catch and did not: both bumps edited the linux section
          # alone, linux CI went green, and macOS/Windows failed against a
          # file that literally contains the string. Slice the section for
          # THIS platform first.

      - name: Prepare unit fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh ../xim-pkgindex

      # ── Phase 1.5: Unit Tests ────────────────────────────────────

      # The capabilities this lane promises (tests/README.md). A test that
      # needs one of them and finds it missing FAILS here instead of skipping:
      # an isolation test that quietly skips on the one machine that runs it is
      # F13 in the SubOS design. GitHub's ubuntu-24.04 image restricts
      # unprivileged user namespaces through AppArmor; the lane lifts that for
      # itself -- what a user does about it is `xlings self doctor --isolation`.
      - name: Lane capabilities (user namespaces, bwrap)
        run: |
          sudo apt-get install -y -qq bubblewrap passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "XDEV_LANE=linux-unit" >> "$GITHUB_ENV"
          echo "XDEV_LANE_CAPS=linux,posix,pty,xlings-bin,userns,bwrap,sandbox,pasta,landlock,network" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          # `mcpp build` can transiently fail with "dependency '...': index
          # entry not found in local clone" when the cached package index is
          # stale: mcpp triggers an index auto-refresh ON that failure, so the
          # first attempt resolves against the stale clone and dies, but a
          # second attempt (post-refresh) succeeds. Retry once to absorb the race.
          mcpp build || {
            echo "::warning::mcpp build failed (likely stale index entry); retrying after auto-refresh"
            mcpp build
          }
          # luban, beside the xlings the e2e tests run (tests/e2e/test_luban.cpp
          # finds bin/luban-tool/luban next to bin/xlings).
          mcpp build -p luban-tool
          # xdev runs `mcpp test` and renders the report; the step summary is
          # rendered once, by the report job, from every lane. Built static
          # (musl) so the e2e and report jobs can run this same binary: a glibc
          # dev build's loader lives in this runner's mcpp registry.
          mcpp build -p xdev --target x86_64-linux-musl
          # A member's binary lands under the root's target/ or the member's
          # own, depending on the mcpp version.
          xdev="$(find target apps/xdev -path '*musl*' -name xdev -type f -perm -111 2>/dev/null | head -1)"
          [[ -n "$xdev" ]] || { echo "::error::mcpp build -p xdev produced no xdev"; find . -name 'xdev*' -not -path './.git/*' | head; exit 1; }
          # linux_release.sh cleans the musl target; retain the static runner
          # outside that tree for candidate acceptance and downstream lanes.
          mkdir -p target/xdev/runner/bin
          cp "$xdev" target/xdev/runner/bin/xdev
          xdev="$GITHUB_WORKSPACE/target/xdev/runner/bin/xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"
          export XDEV_BIN="$xdev"
          mkdir -p target/xdev/linux-xdev
          printf '{"name":"linux-xdev","platform":"linux","run":"%s:%s","probes":{}}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > target/xdev/linux-xdev/lane.json
          XTEST_META_OUT="$GITHUB_WORKSPACE/target/xdev/linux-xdev/meta.ndjson" \
          XTEST_RESULTS_OUT="$GITHUB_WORKSPACE/target/xdev/linux-xdev/cases.ndjson" \
            mcpp test -p xdev
          mcpp test --no-run --message-format json
          "$xdev" test --no-build --out target/xdev/linux-unit
          # Retain only the already-built candidate acceptance programs.
          for test in e2e/test_domain_source e2e/test_domain_producer e2e/test_subos_perf unit/test_root_generation_perf; do
            binary="$(find target -type f -path "*/bin/$test" | head -1)"
            test -x "$binary"
            destination="target/xdev/retained/bin/$test"
            mkdir -p "$(dirname "$destination")"
            cp -p "$binary" "$destination"
          done

      # A separate step, `if: failure()`, and not an `|| { ... }` on one
      # command.
      #
      # The diagnostics used to hang off `mcpp test || { ... }` with
      # `mcpp build` running unguarded above it. The shell is `bash -e`, so a
      # failing `mcpp build` aborted the step before the block was ever
      # reached: the diagnostic existed, never ran, and the failure looked
      # exactly the same as if it had. Measured 2026-08-06 -- a whole CI round
      # spent adding index-content output that could not print.
      - name: Diagnose a failed mcpp build
        if: failure()
        run: |
          # What index does this runner actually hold? `mcpplibs.xpkg@<ver>
          # not found` was diagnosed repeatedly from the outside -- index
          # commit, published artifact, rolling pointer, releases/latest,
          # publish lag, the mcpp version pin, install-vs-use, and the
          # lockfile hash were each checked and each was correct. All of that
          # is inference about a file only the runner can see.
          for idx in "$HOME/.mcpp/registry/data/mcpplibs/pkgs/x/xpkg.lua" \
                     "$GITHUB_WORKSPACE/.mcpp/registry/data/mcpplibs/pkgs/x/xpkg.lua"; do
            if [ -f "$idx" ]; then
              echo "--- $idx"
              grep -oE '\["[0-9]+\.[0-9]+\.[0-9]+"\]' "$idx" | head -8
            else
              echo "--- $idx : ABSENT"
            fi
          done
          for root in "$HOME/.mcpp/registry" "$GITHUB_WORKSPACE/.mcpp/registry"; do
            [ -d "$root" ] || continue
            echo "--- $root"
            ls -1 "$root" 2>/dev/null | head -8
            ls -1 "$root/data" 2>/dev/null | head -8
            ls -1 "$root/index-snapshots" 2>/dev/null | head -8
          done
          mcpp --version 2>&1 | head -2 || true
          mcpp self version 2>&1 | head -3 || true
          xlings --version 2>&1 | head -2 || true

      - name: Multiplatform contract scripts
        env:
          XDEV_LANE: linux-contracts
        run: |
          "$XDEV" test --no-mcpp --suite contract-scripts --out target/xdev/linux-contracts

      # openkal beside this toolchain's runtimes (design part 3 §4.3): glibc,
      # and the static musl target the release uses.
      - name: openkal coexistence (OPENKAL-COEXIST)
        run: |
          cd tools/openkal-coexistence
          for target in "" "--target x86_64-linux-musl"; do
            mcpp build $target
            bin="$(find target -path '*/bin/openkal-coexistence' -type f -newer mcpp.toml | xargs ls -t | head -1)"
            out="$("$bin")"
            echo "$out"
            grep -qx 'libstdc++ says: hello' <<<"$out"
            grep -qx 'openkal says: hello' <<<"$out"
            grep -q '^kal_version=' <<<"$out"
          done

      # The same repository lints as the first step, through xdev this time,
      # so what they cover (LAYOUT-DEPS ...) is evidence in the requirement
      # report and not only a green step.
      - name: Repository lints (requirement evidence)
        env:
          XDEV_LANE: linux-lint
        run: |
          "$XDEV" test --no-mcpp --suite lint --out target/xdev/linux-lint

      # ── Phase 2: Build via Release Script ───────────────────────
      # The ONE release build of this commit on Linux x86_64. The e2e job
      # below takes this artifact instead of building its own (it used to be a
      # separate workflow with a second source build and a third release
      # build of the same commit).

      - name: Build (linux_release)
        run: |
          chmod +x ./tools/linux_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/linux_release.sh

      - name: Prepare release artifact
        run: |
          tarball=$(ls build/xlings-*-linux-x86_64.tar.gz 2>/dev/null | head -1)
          [[ -z "$tarball" ]] && { echo "No release tarball found"; exit 1; }
          cp "$tarball" build/release.tar.gz

      - name: Candidate cold-home lifecycle
        id: candidate
        run: |
          sha256sum build/release.tar.gz > build/release.tar.gz.sha256
          bash tests/candidate-install/smoke.sh \
            build/release.tar.gz build/release.tar.gz.sha256

      - name: Attach artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xlings-linux-x86_64
          path: |
            build/release.tar.gz
            build/xlings-*-linux-x86_64.tar.gz

      - name: Static domain lifecycle, checked system source and image export
        id: static_domain
        continue-on-error: true
        env:
          XDEV_LANE: linux-static-domain
        run: |
          candidate="$(find "$GITHUB_WORKSPACE/build" -path '*/bin/xlings' -type f | head -1)"
          test -x "$candidate"
          export XLINGS_BIN="$candidate"
          status=0
          "$XDEV" test e2e/test_domain_source --no-build --require-metadata \
            --out target/xdev/linux-static-domain || status=$?
          "$XDEV" test e2e/test_domain_producer --no-build --require-metadata \
            --out target/xdev/linux-static-domain-producer || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = [json.loads(line) for directory in ('linux-static-domain', 'linux-static-domain-producer')
                     for line in Path(f'target/xdev/{directory}/cases.ndjson').read_text().splitlines()]
          for case in ('DomainSourceProducer.ReusesOnlyCheckedReadonlyBytesAndExportsAnOwnedImage',
                       'RootExport.OwnsBorrowedClosureAndOmitsOtherScopeVersions',
                       'DomainProducer.InstallsAtLogicalPrefixInsideANamespaceAndPreservesHostData'):
              checked = [row for row in results if row.get('test') == case]
              assert len(checked) == 1 and checked[0]['status'] == 'pass', f'{case} must actually pass'
          PY
          exit "$status"

      - name: Static SubOS performance budgets
        id: static_perf
        continue-on-error: true
        env:
          XDEV_LANE: linux-static-perf
        run: |
          candidate="$(find "$GITHUB_WORKSPACE/build" -path '*/bin/xlings' -type f | head -1)"
          test -x "$candidate"
          export XLINGS_BIN="$candidate"
          # Timing budgets are asserted here, where each case runs alone.
          export XLINGS_PERF_BUDGETS=1
          status=0
          "$XDEV" test e2e/test_subos_perf --no-build --require-metadata \
            --out target/xdev/linux-static-perf || status=$?
          "$XDEV" test unit/test_root_generation_perf --no-build --require-metadata \
            --out target/xdev/linux-static-generation-perf || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          for directory, count in (('linux-static-perf', 4), ('linux-static-generation-perf', 3)):
              results = [json.loads(line) for line in Path(f'target/xdev/{directory}/cases.ndjson').read_text().splitlines()]
              assert len(results) == count and all(row['status'] == 'pass' for row in results), results
          PY
          exit "$status"

      - name: Attach xdev and its runs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-build
          path: |
            ${{ env.XDEV }}
            target/xdev/
          if-no-files-found: ignore

      - name: Require every static acceptance gate
        if: always()
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          DOMAIN_OUTCOME: ${{ steps.static_domain.outcome }}
          PERF_OUTCOME: ${{ steps.static_perf.outcome }}
        run: |
          for outcome in "$CANDIDATE_OUTCOME" "$DOMAIN_OUTCOME" "$PERF_OUTCOME"; do
            [[ "$outcome" == success ]] || { echo "::error::static acceptance is incomplete or failed"; exit 1; }
          done

  # The shell e2e suite, against the artifact built above.
  e2e:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Fetch the release artifact and xdev
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Prepare fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          bin="$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)"
          [[ -x "$bin" ]] || { echo "::error::no bin/xlings in the release artifact"; exit 1; }
          echo "XLINGS_BIN=$bin" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: "E2E-01: Bootstrap Home (portable + installed)"
        run: |
          bash tests/e2e/bootstrap_home_test.sh

      - name: "E2E suite (E2E-02..E2E-42, timed)"
        run: |
          "$XDEV" test --no-mcpp --suite e2e-shell --tarball build/release.tar.gz \
            --out target/xdev/linux-e2e

      - name: Attach the e2e run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-e2e
          path: target/xdev/
          if-no-files-found: ignore

  # The root repair for AppArmor-restricted user namespaces, on a runner
  # left exactly as the image ships it (#640's comment). It installs
  # /usr/lib/xlings/bwrap and an AppArmor profile with sudo, which is why it
  # has a runner of its own.
  isolation-fix:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-isolation-fix
      XDEV_LANE_CAPS: linux,xlings-bin,sudo,network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          echo "XLINGS_BIN=$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: self doctor --isolation --fix
        run: |
          "$XDEV" test --no-mcpp --suite isolation-fix --require-metadata --out target/xdev/linux-isolation-fix

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-isolation-fix
          path: target/xdev/
          if-no-files-found: ignore

  # The host matrix's smoke legs on this build (Luban OS design part 2 §5):
  # Ubuntu 24.04 with its user-namespace restriction as shipped, and a
  # Fedora userland -- each as an ordinary user without sudo. Every leg:
  # nightly and on demand (xlings-ci-host-matrix.yml).
  host-matrix:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' }}
    uses: ./.github/workflows/xlings-ci-host-matrix.yml
    with:
      legs: smoke
      artifact: xlings-linux-x86_64

  # Deployment S as a distribution ships it (design part 2 §5): the AUR
  # recipe built from THIS build's release artifact, installed with pacman,
  # used by two users. Replaces xlings-ci-archlinux.yml, which ran only when
  # config/aur changed and built a 0.4.14 download.
  arch-package:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      XDEV_LANE: linux-arch-package
      XDEV_LANE_CAPS: linux,root,network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Package, install, use
        run: |
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          "$xdev" test --no-mcpp --suite aur --tarball build/release.tar.gz \
            --out target/xdev/linux-arch-package

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-arch-package
          path: target/xdev/
          if-no-files-found: ignore

  # The root projection (SubOS design part 2): Luban roots from the published
  # editions -- entered in bwrap, exported to docker, booted under qemu with
  # their own kernel -- against THIS build's release binary (static: an
  # exported image's xlings runs with no host under it).
  plan-distro:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact
      - name: Restore measured main-branch shard weights
        uses: actions/cache/restore@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}
          restore-keys: xdev-history-v1-linux-
      - name: Plan root scenarios with the local selector
        id: plan
        run: |
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          test -n "$xdev"
          chmod +x "$xdev"
          weights=()
          if [[ -f target/xdev/history/timings.json ]]; then weights+=(--timings target/xdev/history/timings.json); fi
          matrix="$("$xdev" ci plan --no-mcpp --suite distro --platform linux --lane main --shards 3 --require-metadata "${weights[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  distro:
    needs: [build-and-test, plan-distro]
    if: ${{ !cancelled() && needs.build-and-test.outputs.release_ready == 'true' && needs.plan-distro.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-distro.outputs.matrix) }}
    runs-on: ubuntu-24.04
    env:
      XDEV_LANE: linux-distro-${{ strategy.job-index }}
      XDEV_LANE_CAPS: linux,xlings-bin,bwrap,userns,network,docker,qemu,sudo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-linux-x86_64
          path: build

      - name: Fetch xdev
        uses: actions/download-artifact@v4
        with:
          name: xdev-linux-build
          path: xdev-artifact

      - name: Lane capabilities (bwrap, qemu, kvm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap qemu-system-x86 e2fsprogs ovmf xorriso fdisk build-essential
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # KVM when the runner has it: a boot in seconds instead of a minute.
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Binary under test
        run: |
          mkdir -p build/extracted
          tar -xzf build/release.tar.gz -C build/extracted
          echo "XLINGS_BIN=$(find "$GITHUB_WORKSPACE/build/extracted" -path '*/bin/xlings' -type f | head -1)" >> "$GITHUB_ENV"
          xdev="$(find "$GITHUB_WORKSPACE/xdev-artifact" -name xdev -type f | head -1)"
          chmod +x "$xdev"
          echo "XDEV=$xdev" >> "$GITHUB_ENV"

      - name: Roots, images, boots
        run: |
          "$XDEV" test --no-mcpp --suite distro --lane main --shard '${{ matrix.shard }}' \
            --require-metadata --out target/xdev/linux-distro-${{ strategy.job-index }}

      # The luban-tiny tarball the image scenario exported, for wsl --import.
      - name: Attach the root tarball
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luban-tiny-tar
          path: /tmp/xlings-e2e-*/rootfs_image/tiny.tar.gz
          if-no-files-found: ignore

      - name: Attach the run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdev-linux-distro-${{ strategy.job-index }}
          path: target/xdev/
          if-no-files-found: ignore

  # EXPORT-WSL (design part 2 §13): the tarball a Linux build exported,
  # imported by Windows. GitHub's Windows runners offer WSL1 only, through a
  # third-party action; per the design's decision this lane REPORTS and does
  # not block (a WSL1 failure says nothing about WSL2): a pass or a skip
  # with the reason, in the same report as everything else.
  wsl-import:
    needs: distro
    if: always()
    runs-on: windows-2022
    steps:
      - name: Fetch the root tarball
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: luban-tiny-tar
          path: root

      - name: WSL
        id: setup
        continue-on-error: true
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Alpine
          wsl-version: 1

      - name: wsl --import, run
        id: run
        continue-on-error: true
        shell: pwsh
        run: |
          $tar = Get-ChildItem -Recurse root -Filter tiny.tar.gz | Select-Object -First 1
          if (-not $tar) { throw "no tarball from the distro job" }
          New-Item -ItemType Directory -Force C:\luban | Out-Null
          wsl --import luban C:\luban $tar.FullName --version 1
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed" }
          $out = wsl -d luban -- /bin/sh -c '. /etc/os-release; echo "os=$ID/$VARIANT_ID"; xlings --version'
          $out
          if (-not ($out -match "os=luban/tiny")) { throw "not luban tiny: $out" }
          if (-not ($out -match "^xlings ")) { throw "no xlings: $out" }

      - name: Record
        if: always()
        shell: pwsh
        run: |
          $dir = "target/xdev/windows-wsl"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $name = "wsl: subos export --tar imports with wsl --import (WSL1)"
          ('{"name":"windows-wsl","platform":"windows","run":"' + $env:GITHUB_RUN_ID + ':' + $env:GITHUB_RUN_ATTEMPT + '","probes":{}}') | Set-Content "$dir/lane.json"
          ('{"test":"' + $name + '","area":"scenario","covers":["EXPORT-WSL"],"requires":[],"proves":"flow"}') | Set-Content "$dir/meta.ndjson"
          if ("${{ steps.run.outcome }}" -eq "success") { $st = "pass"; $msg = "" }
          elseif ("${{ steps.setup.outcome }}" -ne "success") { $st = "skip"; $msg = "WSL1 could not be set up on this runner" }
          else { $st = "skip"; $msg = "best effort on WSL1 (design part 2 §17.1): the import or the run failed; see the job log" }
          ('{"test":"' + $name + '","status":"' + $st + '","ms":0,"message":"' + $msg + '"}') | Set-Content "$dir/scripts.ndjson"

      - name: Attach the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdev-linux-wsl
          path: target/xdev/

  # One report for the Linux lanes, in the step summary.
  report:
    needs: [build-and-test, e2e, isolation-fix, arch-package, distro, wsl-import]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the runs
        uses: actions/download-artifact@v4
        with:
          pattern: xdev-linux-*
          path: runs

      - name: Restore main-branch execution history
        uses: actions/cache/restore@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}
          restore-keys: xdev-history-v1-linux-

      - name: Report
        run: |
          xdev="$(find runs -name xdev -type f | head -1)"
          [[ -n "$xdev" ]] || { echo "no xdev binary: the build job failed before building it"; exit 1; }
          chmod +x "$xdev"
          args=()
          for d in $(find runs -name lane.json -exec dirname {} \;); do args+=(--in "$d"); done
          # --fail-uncovered: a `required` ID in tests/requirements.toml with
          # no test, or a test naming an ID the file does not declare, fails.
          history=()
          if [[ -f target/xdev/history/trend.json ]]; then history+=(--trend target/xdev/history/trend.json); fi
          mkdir -p target/xdev/current-report
          status=0
          "$xdev" report "${args[@]}" "${history[@]}" --summary \
            --requirements tests/requirements.toml --fail-uncovered \
            --write target/xdev/current-report --timings-out target/xdev/current-report/timings.json || status=$?
          python3 - <<'PY' || status=1
          import json
          from pathlib import Path
          report = json.loads(Path('target/xdev/current-report/report.json').read_text())
          # Windows quoting has its own mandatory Windows gate; WSL1 is the
          # design's explicit best-effort lane and remains visible as such.
          elsewhere = {'SUBOS-CMD-WIN-QUOTING', 'EXPORT-WSL'}
          missing = [name for name, evidence in report['requirements'].items()
                     if name not in elsewhere and not evidence['passed_by']]
          assert not missing, f'required behavior lacks passing execution evidence: {missing}'
          PY
          if [[ -f target/xdev/current-report/trend.json && -f target/xdev/current-report/timings.json ]]; then
            mkdir -p target/xdev/history
            cp target/xdev/current-report/{trend,timings}.json target/xdev/history/
          fi
          exit "$status"

      - name: Attach reports and retained trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdev-linux-report
          path: target/xdev/current-report
          retention-days: 90
          if-no-files-found: ignore

      - name: Retain main-branch trends for subsequent plans
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('target/xdev/history/trend.json') != ''
        uses: actions/cache/save@v4
        with:
          path: target/xdev/history
          key: xdev-history-v1-linux-${{ github.sha }}

  unit-asan:
    # Off the PR critical path (design §24.5): it is the slowest job (~27 min,
    # most of it the instrumented build) and gates nothing a PR changes more
    # often than main does. It runs on every push to main and release/**,
    # and on a PR that carries the `ci:asan` label. A failure on main is a
    # regression to revert or fix at once.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:asan')
    #
    # Sanitizer profile for the unit suite (mcpp.toml `[profile.asan]`,
    # issue #433: a use-after-free reached three releases undetected because
    # nothing ever ran the tests instrumented). Measured locally 2026-09-12:
    # `mcpp test --profile asan` is 54/54 green, build ~18 min -- so this is
    # a HARD gate (no continue-on-error), not a diagnostic-only job.
    #
    # Steps mirror build-and-test's bootstrap/toolchain/cache/index sequence
    # exactly, up to "Build and run unit tests" -- see that job for the
    # reasoning behind each one (BMI wipe, registry prune, index refresh
    # retry). The one thing that MUST differ is the mcpp cache key: BMIs are
    # compiled with `-fsanitize=address,undefined` and are not interchangeable
    # with the dev profile's BMI set (same "CRC mismatch" failure mode
    # documented on that cache step) -- so this job's key carries a distinct
    # "-asan-" segment that appears nowhere in build-and-test's key or
    # restore-keys, and vice versa, so an inexact restore can never hand one
    # profile's BMIs to the other.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 \
              https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
              -o /tmp/xlings-quick-install.sh && break
            echo "bootstrap download failed (attempt $attempt/3); retrying"
            sleep 10
          done
          test -s /tmp/xlings-quick-install.sh \
            || { echo "::error::could not download quick_install.sh"; exit 1; }
          bash /tmp/xlings-quick-install.sh
          test -x "$HOME/.xlings/bin/xlings" \
            || { echo "::error::bootstrap reported success but installed no xlings"; exit 1; }
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages (asan profile)
        id: mcpp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            !~/.mcpp/bmi
            !~/.mcpp/build-cache
            .mcpp
            !.mcpp/bmi
            !.mcpp/build-cache
          # "-asan-" is the whole point of this key: it cannot collide, by
          # prefix or by restore-keys fallback, with build-and-test's
          # "mcpp-v4-ci-linux-${{ runner.os }}-..." key. See the job comment.
          key: mcpp-v4-ci-linux-asan-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-v4-ci-linux-asan-${{ runner.os }}-

      # Verbatim from build-and-test's identically-named step -- the job
      # comment above claims to mirror that job's sequence exactly, and a
      # cache-class failure (an inexact restore mixing BMI sets) needs the
      # same visibility here as it does there. `steps.mcpp-cache` resolves
      # to THIS job's own cache step (same id, different job -- no
      # collision), so no path/key literal needs to change.
      - name: Record the restored BMI set (diagnostic for #56)
        shell: bash
        continue-on-error: true
        run: |
          echo "cache-hit: ${{ steps.mcpp-cache.outputs.cache-hit }}"
          for d in ~/.mcpp/bmi .mcpp/bmi ~/.mcpp/build-cache .mcpp/build-cache; do
            if [ -d "$d" ]; then
              echo "  $d: $(du -sh "$d" 2>/dev/null | cut -f1), $(find "$d" -name '*.gcm' 2>/dev/null | wc -l) .gcm"
            else
              echo "  $d: absent"
            fi
          done
          echo "  --- build identity per BMI dir (first 40) ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null | head -40 |
          while read -r f; do
            printf '  %-18s %s %s\n' \
              "$(basename "$(dirname "$f")")" \
              "$(grep -o '"cpp_standard": *"[^"]*"' "$f" | cut -d'"' -f4)" \
              "$(grep -o '"driver_identity": *"[^"]*"' "$f" | cut -d'"' -f4)"
          done
          echo "  --- distinct driver identities ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null |
            xargs -r grep -ho '"driver_identity": *"[^"]*"' | sort -u

      - name: Drop restored BMIs
        if: env.XLINGS_KEEP_RESTORED_BMIS != '1'
        shell: bash
        run: |
          rm -rf ~/.mcpp/bmi ~/.mcpp/build-cache .mcpp/bmi .mcpp/build-cache

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings config --mirror GLOBAL
          xlings update || true
          xlings install -y
          pin="$(python3 -c 'import json;print(json.load(open(".xlings.json"))["workspace"]["mcpp"])' 2>/dev/null || true)"
          [ -n "$pin" ] && xlings use mcpp "$pin" || true
          mcpp self version

      - name: Reinitialize mcpp registry (GLOBAL)
        run: |
          prune_registry() {
            [ -d "$1" ] || return 0
            find "$1" -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
            [ -d "$1/data" ] || return 0
            find "$1/data" -mindepth 1 -maxdepth 1 ! -name xpkgs -exec rm -rf {} +
          }
          prune_registry "$HOME/.mcpp/registry"
          prune_registry "$GITHUB_WORKSPACE/.mcpp/registry"
          mcpp self config --mirror GLOBAL
          mcpp index update || true
          mcpp index status || true

      - name: Prepare unit fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh ../xim-pkgindex

      - name: Build and run unit tests (asan profile)
        run: |
          # No continue-on-error: measured green (54/54) locally before this
          # job was added, so a red run here is a real regression, not noise
          # to route around.
          mcpp build --profile asan || {
            echo "::warning::mcpp build --profile asan failed (likely stale index entry); retrying after auto-refresh"
            mcpp build --profile asan
          }
          mcpp test --profile asan

      # Verbatim from build-and-test's identically-named step. Same generic
      # $HOME/.mcpp and $GITHUB_WORKSPACE/.mcpp paths as that job -- neither
      # job's diagnostic references its cache key literal, only the
      # runner-local registry directories, so nothing here needs to change
      # for the asan profile.
      - name: Diagnose a failed mcpp build
        if: failure()
        run: |
          for idx in "$HOME/.mcpp/registry/data/mcpplibs/pkgs/x/xpkg.lua" \
                     "$GITHUB_WORKSPACE/.mcpp/registry/data/mcpplibs/pkgs/x/xpkg.lua"; do
            if [ -f "$idx" ]; then
              echo "--- $idx"
              grep -oE '\["[0-9]+\.[0-9]+\.[0-9]+"\]' "$idx" | head -8
            else
              echo "--- $idx : ABSENT"
            fi
          done
          for root in "$HOME/.mcpp/registry" "$GITHUB_WORKSPACE/.mcpp/registry"; do
            [ -d "$root" ] || continue
            echo "--- $root"
            ls -1 "$root" 2>/dev/null | head -8
            ls -1 "$root/data" 2>/dev/null | head -8
            ls -1 "$root/index-snapshots" 2>/dev/null | head -8
          done
          mcpp --version 2>&1 | head -2 || true
          mcpp self version 2>&1 | head -3 || true
          xlings --version 2>&1 | head -2 || true

      # E2E-00: a fresh mcpp home builds xlings for the musl target. It
      # used to run on every PR in the e2e workflow; the PR build job and the
      # release build above already prove the same build with the same mcpp,
      # so it now runs where the instrumented build runs: on main.
      - name: "E2E-00: mcpp builds xlings from source (fresh mcpp home)"
        if: github.event_name == 'push'
        run: |
          bash tests/e2e/prepare_fixture_index.sh
          bash tests/e2e/mcpp_build_xlings_test.sh

      - name: Sanitizer verdict
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### unit-asan: PASS (mcpp test --profile asan)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### unit-asan: FAIL (mcpp test --profile asan)" >> "$GITHUB_STEP_SUMMARY"
          fi
