name: xlings-ci-linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp. Bump together with
  # XIM_PKGINDEX_REF so CI uses a known-good xlings + package index pair.
  BOOTSTRAP_XLINGS_VERSION: v0.4.49
  # Must contain the mcpp version pinned in .xlings.json (0.0.56).
  XIM_PKGINDEX_REF: e692575099151d1f2c12c288d17aaa50f97e4e5d

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Phase 1: Configure Environment via xlings ─────────────────

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"           >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin"     >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"                   >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            .mcpp
          # idxfmt2 salt: abandon pre-2026-06-08 caches whose materialized
          # compat xpkgs predate the mcpp-index GLOBAL/CN url schema (#41).
          # The "Refresh mcpp package index cache" step re-fetches the index
          # but not the materialized xpkgs, so a stale cache here resurfaces
          # the old format and fails compat.zlib resolution.
          key: mcpp-${{ runner.os }}-idxfmt2-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-${{ runner.os }}-idxfmt2-

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings install -y
          mcpp --version
          mcpp self version

      - name: Refresh mcpp package index cache
        run: |
          rm -rf "$HOME/.mcpp/registry/data/mcpplibs"
          rm -rf "$GITHUB_WORKSPACE/.mcpp/registry/data/mcpplibs"

      - name: Prepare unit fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh ../xim-pkgindex

      # ── Phase 1.5: Unit Tests ────────────────────────────────────

      - name: Build and run unit tests
        run: |
          mcpp build
          mcpp test || {
            status=$?
            echo "::group::mcpp build diagnostics"
            ninja_bin="$(command -v ninja || true)"
            if [[ -z "$ninja_bin" ]]; then
              ninja_bin="$(find "$HOME/.mcpp" "$XLINGS_HOME" -name ninja -type f -perm -111 2>/dev/null | head -1 || true)"
            fi
            if [[ -z "$ninja_bin" ]]; then
              echo "ninja not found"
            else
              while IFS= read -r build_file; do
                build_dir="$(dirname "$build_file")"
                echo "\$ $ninja_bin -C $build_dir -v"
                "$ninja_bin" -C "$build_dir" -v || true
              done < <(find target -name build.ninja -type f | sort)
            fi
            echo "::endgroup::"
            exit "$status"
          }

      - name: Prepare fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      - name: "E2E-00: mcpp builds xlings from source"
        run: |
          bash tests/e2e/mcpp_build_xlings_test.sh

      # ── Phase 2: Build via Release Script ───────────────────────

      - name: Build (linux_release)
        run: |
          chmod +x ./tools/linux_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/linux_release.sh

      - name: "E2E-01: Bootstrap Home (portable + installed)"
        run: |
          bash tests/e2e/bootstrap_home_test.sh

      - name: Uninstall old Xlings
        run: |
          xlings self uninstall -y || rm -rf "$HOME/.xlings"

      - name: Prepare release artifact
        run: |
          tarball=$(ls build/xlings-*-linux-x86_64.tar.gz 2>/dev/null | head -1)
          [[ -z "$tarball" ]] && { echo "No release tarball found"; exit 1; }
          cp "$tarball" build/release.tar.gz

      - name: "E2E-02: Release Self Install"
        run: |
          bash tests/e2e/release_self_install_test.sh build/release.tar.gz

      - name: "E2E-02a: Release Packaged Index"
        run: |
          bash tests/e2e/release_packaged_index_test.sh build/release.tar.gz

      - name: "E2E-02b: Self Uninstall (dry-run / safety / keep-data / full)"
        run: |
          bash tests/e2e/self_uninstall_test.sh build/release.tar.gz

      - name: "E2E-03: Quick Install Smoke"
        continue-on-error: true  # may fail due to GitHub rate limits
        env:
          XLINGS_NON_INTERACTIVE: 1
        run: |
          bash tests/e2e/release_quick_install_test.sh

      - name: "E2E-04: Release Subos + d2x Reuse + RPATH"
        run: |
          bash tests/e2e/release_subos_smoke_test.sh build/release.tar.gz

      - name: "E2E-05: Fixed Project Scenarios"
        run: |
          bash tests/e2e/project_e2e_test.sh

      - name: "E2E-06: Sub-Index Search + pkgindex-build"
        run: |
          bash tests/e2e/sub_index_search_test.sh

      - name: "E2E-07: Sub-Index Install (namespace + bare name)"
        run: |
          bash tests/e2e/sub_index_install_test.sh

      - name: "E2E-08: Index Cache"
        run: |
          bash tests/e2e/index_cache_test.sh

      - name: "E2E-09: Legacy config.xlings Compatibility"
        run: |
          bash tests/e2e/legacy_config_test.sh

      - name: "E2E-10: linux-headers install (pkginfo.install_dir)"
        run: |
          bash tests/e2e/pkginfo_install_dir_test.sh

      - name: "E2E-11: Script-type package install/export/uninstall"
        run: |
          bash tests/e2e/script_type_install_test.sh

      - name: "E2E-12: Elfpatch install verify (d2x interpreter + rpath)"
        run: |
          bash tests/e2e/elfpatch_install_verify_test.sh build/release.tar.gz

      - name: "E2E-13: Remove preserves other versions (multi-version regression)"
        run: |
          bash tests/e2e/remove_multi_version_test.sh

      - name: "E2E-14: TUI UTF-8 output regression"
        run: |
          bash tests/e2e/tui_utf8_test.sh

      - name: "E2E-15: bootstrap self-replace on install/use (xlings/xim/xvm)"
        run: |
          bash tests/e2e/xlings_self_replace_test.sh

      - name: "E2E-16: self doctor (workspace/shim/payload invariants)"
        run: |
          bash tests/e2e/self_doctor_test.sh

      - name: "E2E-17: CLI target-spec compatibility (name@ver / name ver)"
        run: |
          bash tests/e2e/cli_target_compat_test.sh

      - name: "E2E-18: short-command aliases removal (xim/xvm/xself/xsubos/xinstall)"
        run: |
          bash tests/e2e/cli_short_alias_removal_test.sh

      - name: "E2E-19: GitHub mirror fallback wiring (HTTP / git / index)"
        run: |
          bash tests/e2e/mirror_fallback_test.sh

      - name: "E2E-20: remove xim:xlings — single-version guard (regression: silent terminate on Windows)"
        run: |
          bash tests/e2e/remove_self_guard_test.sh

      - name: "E2E-21: build/runtime deps split (kind=Build skip-activate + build_dep API)"
        run: |
          bash tests/e2e/build_deps_split_test.sh

      - name: "E2E-22: subos workspace C2 schema (active+installed[] form, lazy migration)"
        run: |
          bash tests/e2e/subos_workspace_c2_schema_test.sh

      - name: "E2E-23: subos install/remove isolation (no cross-subos workspace leak)"
        run: |
          bash tests/e2e/subos_install_remove_isolation_test.sh

      - name: "E2E-24: nested xlings home (project discovery boundary)"
        run: |
          bash tests/e2e/nested_xlings_home_test.sh

      - name: "E2E-25: subos sandbox (proot-based fs isolation)"
        run: |
          bash tests/e2e/subos_sandbox_test.sh

      - name: "E2E-26: subos sandbox --gpu opt-in passthrough"
        run: |
          bash tests/e2e/subos_sandbox_gpu_test.sh

      - name: "E2E-27: cmd_install silent failure regression"
        run: |
          bash tests/e2e/install_silent_failure_test.sh

      - name: "E2E-28: shim owner anchoring (owner -> env -> default)"
        run: |
          bash tests/e2e/shim_owner_anchoring_test.sh

      - name: Attach artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xlings-linux-x86_64
          path: build/release.tar.gz
