name: xlings-ci-linux-root

# Verifies xlings usability under the Linux root user. Builds the latest
# xlings from source with mcpp (job: build), then runs the root scenarios
# inside a bare ubuntu:24.04 *root* container that deliberately has no sudo
# installed — so the run genuinely exercises the root / sudo identity layer
# (P0-1: no sudo dependency; P0-2: sudo chown-back).
# Design: .agents/docs/2026-06-21-root-privilege-identity-design.md

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

env:
  GIT_TERMINAL_PROMPT: 0
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Keep in sync with xlings-ci-linux.yml.
  BOOTSTRAP_XLINGS_VERSION: v0.4.69
  XIM_PKGINDEX_REF: 20e53c6a4967346282af21c8fd2af91e6af75cc7

jobs:
  # ── Build the latest xlings from source via mcpp ──────────────────
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"       >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"               >> "$GITHUB_PATH"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        id: mcpp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            .mcpp
          # `mcpp-v2-`: the v1 keyspace holds entries saved by runs that
          # built against a fallback-restored BMI set and failed. Those are
          # poisoned at their exact key, so the guard below -- which only fires
          # on an INEXACT restore -- can never reach them. Retiring the prefix
          # is what discards them; the guard is what stops it recurring.
          key: mcpp-v2-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-v2-${{ runner.os }}-
      # An inexact restore (the `restore-keys` fallback) brings BMIs built
      # under a different dependency set. Mixing them with anything rebuilt
      # here fails as `import 'std' has CRC mismatch` — which reads like a
      # compiler bug and is a cache restored for the wrong inputs. Measured on
      # PR #480, where `mcpplibs.xpkg` went 0.0.47 → 0.0.48: the fallback
      # cache's tinyhttps/cmdline BMIs no longer matched the `std` the fresh
      # xpkg build produced.
      #
      # Only the BMIs go. The payload store under registry/data/xpkgs is
      # dependency-independent and is what makes the ~800 MB cache worth
      # restoring at all.
      - name: Drop stale BMIs when the cache key did not match exactly
        if: steps.mcpp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf ~/.mcpp/bmi ~/.mcpp/build-cache .mcpp/bmi .mcpp/build-cache

      - name: Prepare bootstrap package index
        run: |
          rm -rf "$XLINGS_HOME/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$XLINGS_HOME/data/xim-pkgindex"

      - name: Install build dependencies (mcpp)
        run: |
          cd "$GITHUB_WORKSPACE"
          xlings config --mirror GLOBAL
          xlings install -y
          mcpp --version

      - name: Reinitialize mcpp registry (GLOBAL)
        run: |
          # Drop the resolved indexes and mirror config so they are
          # re-resolved against GLOBAL, but KEEP registry/data/xpkgs -- the
          # downloaded and extracted package payloads.
          #
          # Those payloads are sha256-pinned by their recipe, so they are
          # mirror-independent: keeping them cannot leak a CN artifact into a
          # GLOBAL build. Wiping them made every run re-fetch every transitive
          # source from its upstream host, so CI failed wholesale whenever one
          # of those hosts was unreachable -- e.g. compat.bzip2 (a transitive
          # dep of compat.libarchive, and absent from mcpp.lock, which only
          # pins direct deps) fetched from sourceware.org. It also made the
          # ~800 MB mcpp cache restored one step earlier almost worthless.
          prune_registry() {
            [ -d "$1" ] || return 0
            find "$1" -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
            [ -d "$1/data" ] || return 0
            find "$1/data" -mindepth 1 -maxdepth 1 ! -name xpkgs -exec rm -rf {} +
          }
          prune_registry "$HOME/.mcpp/registry"
          prune_registry "$GITHUB_WORKSPACE/.mcpp/registry"
          mcpp self config --mirror GLOBAL

      - name: Prepare unit fixture index repo
        run: |
          bash tests/e2e/prepare_fixture_index.sh ../xim-pkgindex

      - name: Build + unit tests (incl. identity layer)
        run: |
          mcpp build
          mcpp test

      - name: Build static release (linux_release)
        run: |
          chmod +x ./tools/linux_release.sh
          SKIP_NETWORK_VERIFY=1 ./tools/linux_release.sh
          tarball=$(ls build/xlings-*-linux-x86_64.tar.gz 2>/dev/null | head -1)
          [[ -z "$tarball" ]] && { echo "No release tarball found"; exit 1; }
          cp "$tarball" build/release.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlings-root-ci-release
          path: build/release.tar.gz

  # ── Verify root usability in a bare root container (no sudo) ───────
  verify-root:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04        # default user is root (uid 0); no sudo preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minimal deps for the e2e harness — deliberately NOT installing sudo,
      # so the pure-root scenario proves xlings never depends on it.
      - name: Install minimal deps (no sudo)
        run: |
          apt-get update -qq
          apt-get install -y curl ca-certificates tar findutils perl git
          echo "sudo intentionally NOT installed:"; command -v sudo || echo "  (absent — good)"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: xlings-root-ci-release
          path: build

      - name: Confirm running as root
        run: |
          id
          [ "$(id -u)" -eq 0 ] || { echo "expected uid 0"; exit 1; }

      - name: "ROOT-01: root usability (pure root + simulated sudo)"
        run: |
          bash tests/e2e/root_usability_test.sh build/release.tar.gz
