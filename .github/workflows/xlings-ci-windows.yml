name: xlings-ci-windows

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

env:
  GIT_TERMINAL_PROMPT: 0
  # CI runs on github.com; force GLOBAL mirror so xim doesn't try gitee
  # endpoints (which need auth and aren't reachable in CI).
  XLINGS_RELEASE_MIRROR: GLOBAL
  # Pinned bootstrap xlings used to install mcpp.
  #
  # ⚠️ The "known-good xlings + package index pair" this used to claim is only
  # half real: XIM_PKGINDEX_REF is DECLARED in seven workflows and actually
  # checked out in three, two of which are the Windows legs. On linux/macos
  # the index this job resolves against is whatever is current, not the pin --
  # so treat that variable as documentation, not as a lock, until it is
  # either honoured everywhere or removed.
  BOOTSTRAP_XLINGS_VERSION: v2026.8.27.5
  # Must contain the mcpp version pinned in .xlings.json (2026.8.8.4).
  XIM_PKGINDEX_REF: 3d80079485ded53d161212857027122ee6029419

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Phase 1: Configure Environment via xlings ─────────────────

      - name: Install bootstrap xlings (pinned ${{ env.BOOTSTRAP_XLINGS_VERSION }})
        shell: pwsh
        env:
          XLINGS_NON_INTERACTIVE: '1'
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          # Same failure mode as the POSIX bootstrap, same three fixes: `irm |
          # iex` reports whether iex ran, not whether irm fetched anything,
          # so a reset connection installs nothing and the step goes green.
          # `-ErrorAction Stop` on the call, NOT $ErrorActionPreference: the
          # preference would stay set for `& $script` below and turn any
          # non-terminating error the installer writes into an abort -- a
          # behaviour change well outside what this fixes.
          $script = "$env:TEMP\xlings-quick-install.ps1"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -ErrorAction Stop `
                    -Uri https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 `
                    -OutFile $script; break }
            catch { Write-Host "bootstrap download failed (attempt $i/3); retrying"; Start-Sleep 10 }
          }
          if (-not (Test-Path $script) -or (Get-Item $script).Length -eq 0) {
            Write-Host "::error::could not download quick_install.ps1"; exit 1
          }
          & $script
          # Whatever the installer thought it did, the binary is either here or
          # it is not.
          if (-not (Test-Path "$env:USERPROFILE\.xlings\bin\xlings.exe")) {
            Write-Host "::error::bootstrap reported success but installed no xlings"; exit 1
          }
          "XLINGS_HOME=$env:USERPROFILE\.xlings"            >> $env:GITHUB_ENV
          "$env:USERPROFILE\.xlings\subos\current\bin"      >> $env:GITHUB_PATH
          "$env:USERPROFILE\.xlings\bin"                    >> $env:GITHUB_PATH

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~\.xlings\data\xpkgs
          key: xlings-deps-${{ runner.os }}-${{ hashFiles('.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            xlings-deps-${{ runner.os }}-

      - name: Cache mcpp sandbox and project packages
        id: mcpp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.mcpp
            !~\.mcpp/bmi
            !~\.mcpp/build-cache
            .mcpp
            !.mcpp/bmi
            !.mcpp/build-cache
          # BMIs are NOT cached, and are deleted after every restore. That
          # is the fix, and it took three prefix retirements to find.
          #
          # A restored BMI set never works. `import 'std' has CRC mismatch`
          # follows, which reads like a compiler bug. What hid it is that the
          # old guard wiped the BMIs on an INEXACT restore -- so retiring the
          # key prefix forced an inexact restore, fired the guard, and produced
          # one clean run. Each retirement therefore looked like a fix and was
          # an accident; the next run got an exact hit, skipped the guard, and
          # failed again. Read straight off two consecutive runs of THIS
          # workflow: the one that passed shows "Drop stale BMIs" as `success`,
          # the one that failed shows it `skipped`.
          #
          # So the wipe is unconditional now, and the BMI directories are
          # excluded from the cache as well -- the exclusion is an optimisation
          # (do not store bytes we delete on arrival), the unconditional wipe is
          # the guarantee, and it cannot depend on exclude-pattern semantics.
          #
          # What the cache is FOR is `registry/data/xpkgs`: ~800 MB of payloads
          # that are toolchain-independent and survive a round trip fine.
          #
          # The key still names the workflow that produced it. mcpp.toml
          # declares both the dev toolchain (gcc@16.1.0) and the release target
          # (gcc@15.1.0-musl), so a CI build and a release build hash the same
          # -- sharing one key across workflows is wrong on its own terms even
          # though it was not what caused this.
          key: mcpp-v4-ci-windows-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', '.xlings.json') }}-${{ env.BOOTSTRAP_XLINGS_VERSION }}
          restore-keys: |
            mcpp-v4-ci-windows-${{ runner.os }}-
      # An inexact restore (the `restore-keys` fallback) brings BMIs built
      # under a different dependency set. Mixing them with anything rebuilt
      # here fails as `import 'std' has CRC mismatch` — which reads like a
      # compiler bug and is a cache restored for the wrong inputs. Measured on
      # PR #480, where `mcpplibs.xpkg` went 0.0.47 → 0.0.48: the fallback
      # cache's tinyhttps/cmdline BMIs no longer matched the `std` the fresh
      # xpkg build produced.
      #
      # Only the BMIs go. The payload store under registry/data/xpkgs is
      # dependency-independent and is what makes the ~800 MB cache worth
      # restoring at all.
      # Evidence for task #56, gathered where the failure actually happens.
      #
      # Four hypotheses were refuted on a developer machine (2026-08-06): two
      # toolchains sharing one BMI store; the tar round trip destroying
      # metadata (the .gcm set survives byte-for-byte, mtimes included); a full
      # project rebuild against restored BMIs; and prune_registry running after
      # the restore. None reproduces it locally, so the next honest step is to
      # record what CI has that a laptop does not, rather than guess a fifth
      # hypothesis.
      #
      # What to look for: two entries that disagree on driver_identity or
      # sysroot for the same cpp_standard. That would mean the restored set is
      # internally inconsistent, which is the answer.
      #
      # continue-on-error on purpose: a diagnostic must never be the reason a
      # release is blocked. Set XLINGS_KEEP_RESTORED_BMIS=1 on a throwaway
      # branch to skip the wipe below and let the failure happen with this
      # record in hand.
      - name: Record the restored BMI set (diagnostic for #56)
        shell: bash
        continue-on-error: true
        run: |
          echo "cache-hit: ${{ steps.mcpp-cache.outputs.cache-hit }}"
          for d in ~/.mcpp/bmi .mcpp/bmi ~/.mcpp/build-cache .mcpp/build-cache; do
            if [ -d "$d" ]; then
              echo "  $d: $(du -sh "$d" 2>/dev/null | cut -f1), $(find "$d" -name '*.gcm' 2>/dev/null | wc -l) .gcm"
            else
              echo "  $d: absent"
            fi
          done
          echo "  --- build identity per BMI dir (first 40) ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null | head -40 |
          while read -r f; do
            printf '  %-18s %s %s\n' \
              "$(basename "$(dirname "$f")")" \
              "$(grep -o '"cpp_standard": *"[^"]*"' "$f" | cut -d'"' -f4)" \
              "$(grep -o '"driver_identity": *"[^"]*"' "$f" | cut -d'"' -f4)"
          done
          echo "  --- distinct driver identities ---"
          find ~/.mcpp/bmi .mcpp/bmi -name std-module.json 2>/dev/null |
            xargs -r grep -ho '"driver_identity": *"[^"]*"' | sort -u

      - name: Drop restored BMIs
        if: env.XLINGS_KEEP_RESTORED_BMIS != '1'
        shell: bash
        run: |
          rm -rf ~/.mcpp/bmi ~/.mcpp/build-cache .mcpp/bmi .mcpp/build-cache

      - name: Prepare bootstrap package index
        shell: pwsh
        run: |
          $indexDir = Join-Path $env:USERPROFILE ".xlings\data\xim-pkgindex"
          Remove-Item -Recurse -Force $indexDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Split-Path $indexDir) | Out-Null
          git clone https://github.com/openxlings/xim-pkgindex.git $indexDir
          git -C $indexDir checkout --quiet $env:XIM_PKGINDEX_REF
          if (-not (Test-Path (Join-Path $indexDir "pkgs"))) {
            throw "bootstrap package index missing pkgs/"
          }

      - name: Install build dependencies (mcpp)
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          xlings config --mirror GLOBAL
          # Refresh the index before resolving out of it. Without this the run
          # resolves against the snapshot the bootstrap shipped with, and a
          # freshly published dependency reads as "not found" while older
          # entries from the same index download fine.
          xlings update
          $global:LASTEXITCODE = 0
          xlings install -y

          # Installing is not switching. `xlings install` lays the payload
          # down; the shim keeps resolving whatever version was already
          # active, and with ~/.mcpp restored from a cache that is the old
          # build -- whose index snapshot can predate the dependency this PR
          # needs. Measured 2026-08-06 as `mcpplibs.xpkg@0.0.53 not found`
          # against an index that demonstrably had it.
          # The pin comes from .xlings.json at runtime, not a literal.
          $pin = (Get-Content .xlings.json | ConvertFrom-Json).workspace.mcpp
          if ($pin) { xlings use mcpp "$pin" }
          $global:LASTEXITCODE = 0

          mcpp --version
          $global:LASTEXITCODE = 0
          mcpp self version

      - name: Reinitialize mcpp registry (GLOBAL)
        shell: pwsh
        run: |
          # See xlings-ci-linux.yml for the rationale: keep registry/data/xpkgs
          # (sha256-pinned payloads) so a single unreachable upstream source
          # host cannot fail the whole run, and so the mcpp cache restored one
          # step earlier is actually worth something.
          function Prune-Registry($root) {
            if (-not (Test-Path $root)) { return }
            Get-ChildItem -Force $root | Where-Object { $_.Name -ne 'data' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            $data = Join-Path $root 'data'
            if (Test-Path $data) {
              Get-ChildItem -Force $data | Where-Object { $_.Name -ne 'xpkgs' } |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Prune-Registry "$env:USERPROFILE\.mcpp\registry"
          Prune-Registry "$env:GITHUB_WORKSPACE\.mcpp\registry"
          mcpp self config --mirror GLOBAL

          # Force the index refresh, then assert what landed -- see the note
          # in xlings-ci-linux.yml. Calling update without checking leaves
          # "refreshed" and "still stale" producing identical output.
          mcpp index update
          $global:LASTEXITCODE = 0
          mcpp index status
          $global:LASTEXITCODE = 0

      - name: Prepare unit fixture index repo
        shell: bash
        run: |
          bash tests/e2e/prepare_fixture_index.sh ../xim-pkgindex

      # ── Phase 1.5: Unit Tests ────────────────────────────────────

      # `continue-on-error`, with the verdict re-asserted at the end of the
      # job.
      #
      # This step both BUILDS and tests, and a failure here skipped the 15
      # steps after it -- every E2E, on the one platform whose defects the E2E
      # suite exists to catch. Observed on main: a timing-sensitive unit test
      # flaked (the same commit was green on its PR branch) and the Windows
      # leg produced no end-to-end signal at all for a Windows-only fix.
      #
      # A red job with full signal beats a red job with none. The `Unit test
      # verdict` step below is what keeps it red.
      - name: Build and run unit tests
        id: unit
        continue-on-error: true
        shell: pwsh
        run: |
          mcpp build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mcpp test
          if ($LASTEXITCODE -ne 0) {
            $status = $LASTEXITCODE
            Write-Host "::group::mcpp build diagnostics"
            $ninjaCmd = Get-Command ninja -ErrorAction SilentlyContinue
            $ninja = if ($ninjaCmd) { $ninjaCmd.Source } else { "" }
            if (-not $ninja) {
              $ninjaFile = Get-ChildItem -Path "$env:USERPROFILE\.mcpp", "$env:XLINGS_HOME" -Filter ninja.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($ninjaFile) { $ninja = $ninjaFile.FullName }
            }
            if (-not $ninja) {
              Write-Host "ninja not found"
            } else {
              $buildFiles = Get-ChildItem -Path target -Filter build.ninja -Recurse -ErrorAction SilentlyContinue
              foreach ($buildFile in $buildFiles) {
                $buildDir = $buildFile.DirectoryName
                Write-Host "`$ $ninja -C $buildDir -v"
                & $ninja -C $buildDir -v
              }
            }
            Write-Host "::endgroup::"
            exit $status
          }

      # If the BUILD failed there is nothing to run E2E against, and every
      # step below would fail for a reason that has nothing to do with it.
      # Distinguished from "the unit tests failed", which the E2E suite is
      # perfectly able to run past.
      - name: Stop if the build itself failed
        if: steps.unit.outcome == 'failure'
        shell: pwsh
        run: |
          if (-not (Test-Path "target")) {
            Write-Host "::error::build produced no target/ -- skipping E2E"
            exit 1
          }
          Write-Host "unit tests failed but the build succeeded; E2E continues"

      - name: Prepare fixture index repo
        shell: bash
        run: |
          bash tests/e2e/prepare_fixture_index.sh

      # ── Phase 2: Build via Release Script ───────────────────────

      - name: Build (windows_release)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows_release.ps1"

      - name: SubOS sandbox command contract
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\tests\e2e\subos_cmd_contract_test.ps1"'

      - name: Fresh XLINGS_HOME first install
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\tests\e2e\fresh_xlings_home_install_test.ps1"'

      - name: "E2E-01: Bootstrap Home (portable + installed)"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\bootstrap_home_test.ps1"

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem "build\xlings-*-windows-x86_64.zip" | Select-Object -First 1
          if (-not $zip) { throw "No release zip found" }
          Copy-Item $zip.FullName "build\release.zip"

      - name: Candidate cold-home lifecycle
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "build\release.zip").Hash.ToLowerInvariant()
          "$hash  release.zip" | Set-Content "build\release.zip.sha256"
          & "$env:GITHUB_WORKSPACE\tests\candidate-install\smoke.ps1" -Archive "build\release.zip" -Sidecar "build\release.zip.sha256"

      # ── Phase 3: E2E Tests ─────────────────────────────────────

      - name: "E2E-02: Release Self Install"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\release_self_install_test.ps1" "build\release.zip"

      - name: "E2E-02a: Release Packaged Index"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\release_packaged_index_test.ps1" "build\release.zip"

      - name: "E2E-03: Quick Install Smoke"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\scripts\test_quick_install.ps1"

      - name: "E2E-04: Release Subos + d2x"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\release_subos_smoke_test.ps1" "build\release.zip"

      - name: "E2E-05: Project Shim Mirror"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\project_shim_mirror_test.ps1"

      - name: "E2E-06: Shim Project Context"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\shim_project_context_test.ps1"

      - name: "E2E-07: Sub-Index Search + pkgindex-build"
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\e2e\sub_index_search_test.ps1" "build\release.zip"

      - name: Attach artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xlings-windows-x86_64
          path: build/release.zip

      # The unit step is `continue-on-error` so it cannot skip the E2E suite;
      # this is where its result becomes the job's. Without it a unit failure
      # would report success, which is the opposite defect and a worse one.
      - name: Unit test verdict
        if: always() && steps.unit.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::unit tests failed (see the 'Build and run unit tests' step)"
          exit 1
