name: xlings-ci-aarch64

# aarch64 / Android closed-loop CI for xlings.
#
# xlings is built by mcpp, so an aarch64 xlings is produced exactly like an
# aarch64 mcpp: cross-compile with `mcpp build --target aarch64-linux-musl`
# using the cross toolchain from the xlings ecosystem
# (xim:aarch64-linux-musl-gcc -> xlings-res), then run under qemu-aarch64.
#
# The aarch64 cross support lives in mcpp itself, so we self-host a fresh
# cross-capable mcpp from source (mcpp main) rather than relying on the pinned
# bootstrap mcpp. The artifact is a fully static musl aarch64 ELF — runnable
# natively in Termux on an Android phone (no bionic dependency).

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A bootstrap pin is not neutral setup: the client that lays down
  # `subos/default` decides the runtime binding, so this line has to name a
  # client whose binding the index can satisfy.
  #
  # It went v2026.8.10.1 -> v2026.8.27.1 while the index offered glibc 2.44.2,
  # and back again when 2.44.2 was withdrawn (xim-pkgindex#700: three
  # consumers pinned the binding name and none of them moved together).
  # v2026.8.10.1 said `glibc@2.44` and the index offered it, so it worked --
  # but it worked because a constant happened to match, not because anything
  # connected the two.
  #
  # 2026.8.27.5 is where it stops being luck. Its binding comes from the
  # index, and resolution honours what the subos DECLARES over what the index
  # calls newest, so the two cannot drift apart:
  #
  #   declares glibc@X  ->  installs glibc@X, whatever `latest` moves to
  #
  # Measured across four client versions against an index carrying both 2.44
  # and 2.44.2: every client whose binding is a compiled-in CONSTANT installs
  # one version while declaring another; every client that reads the index --
  # 2026.8.27.4 and .5 -- stays consistent. This pin was the last constant.
  #
  # ⚠️ Do not move it back below 2026.8.27.2 without re-running that probe:
  # this is the pin that decides whether a packaging revision can ever be
  # published for a runtime package again.
  BOOTSTRAP_XLINGS_VERSION: v2026.8.27.5

jobs:
  native-contracts:
    name: native aarch64 compatibility contracts
    needs: cross-build-and-run
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xlings-linux-aarch64-candidate
          path: candidate
      - name: Run native contracts from the cross-built candidate
        run: |
          bash tests/e2e/prepare_fixture_index.sh
          package_root=$(mktemp -d)
          tar -xzf candidate/*.tar.gz -C "$package_root"
          bin=$(find "$package_root" -path '*/bin/xlings' -type f | head -1)
          test -x "$bin"
          "$bin" --version
          XLINGS_BIN="$bin" bash tests/e2e/aarch64_compat_contract_test.sh
      - name: Candidate cold-home and aarch64 fail-closed lifecycle
        run: |
          bash tests/candidate-install/smoke.sh \
            candidate/*.tar.gz candidate/*.tar.gz.sha256

  cross-build-and-run:
    name: cross-build xlings aarch64 (host x86_64) + qemu run
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout xlings
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/microsoft*.sources
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential

      - name: Install bootstrap xlings
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"       >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"               >> "$GITHUB_PATH"

      - name: qemu from the ecosystem, not from apt
        run: |
          # This job cross-builds a release candidate and then RUNS it, which
          # needs USER-mode qemu. It used to come from
          # `apt-get install qemu-user-static`, and on 2026-08-27 that failed
          # on every run: the runner image ships Microsoft apt sources that
          # answer 403, so `apt-get update` failed the whole step over a
          # repository this job installs nothing from. An ecosystem that
          # supplies its own toolchain should not have a test that cannot run
          # because a distribution repository is unhappy.
          #
          # xim:qemu-user-aarch64 is the same binary from upstream
          # multiarch/qemu-user-static, statically linked (zero DT_NEEDED), so
          # it brings no closure of its own.
          xlings install xim:qemu-user-aarch64 -y
          qemu-aarch64-static --version | head -1

      # NO payload cache here.
      #
      # The reason is sound on its own: caching `~/.xlings/data/xpkgs` (the
      # PAYLOADS) without `~/.xlings/.xlings.json` (the xvm registry that records
      # what is installed) leaves the runner with payload directories that no
      # version is registered for. `xlings install` then treats a present payload
      # directory as already installed and skips the install AND its config()
      # hook. Either cache both halves or neither; caching both would restore
      # registrations pointing at payloads a different `.xlings.json` would have
      # changed, so neither is the safe choice.
      #
      # BUT: dropping this cache did NOT fix the red cell, so it was not the
      # cause. Four changes were committed here as fixes -- pinning mcpp, pinning
      # the package index, dropping the from-source mcpp build, and dropping this
      # cache -- and ALL FOUR left the failure identical:
      #
      #   build.mcpp compiling / build.mcpp running
      #   error: posix_spawnp('.../xpkg@0.0.54/build.mcpp.bin') failed (error 2)
      #
      # Each was an inference from outside the runner. None was measured there.
      # The `if: failure()` diagnostic at the end of this job exists to end that:
      # it prints what the host toolchain actually produced, which is the one
      # thing none of the four diagnoses ever looked at.
      - name: Bootstrap mcpp + GLOBAL mirror
        run: |
          xlings config --mirror GLOBAL
          xlings update -y 2>/dev/null || xlings update 2>/dev/null || true
          # This job deliberately takes the LATEST mcpp, not the pin -- it
          # exists to catch cross-build breakage against the current client.
          xlings install mcpp -y
          mcpp --version

      - name: Cross-build release candidate -> aarch64 static, run under qemu
        run: |
          # No MCPP_BIN: drive the cross-build with the mcpp this job INSTALLED,
          # not one built from source here.
          #
          # This step used to clone mcpp and build it, on the premise that a
          # released mcpp could not cross-compile. That premise is false: the
          # released client cross-compiles fine. Removing the source build was
          # still right, but it did NOT fix the red cell -- see the note above the
          # bootstrap step for the four diagnoses that all failed.
          #
          # Do not "fix" this cell by pinning mcpp. This job deliberately takes the
          # LATEST mcpp -- it exists to catch cross-build breakage against the
          # current client, and pinning would quietly retire the canary. If a
          # future released mcpp cannot cross-compile, this cell going red is the
          # intended signal.
          #
          # Measured locally against released mcpp 2026.8.8.4, both with a warm
          # sandbox and with a wiped one (fresh MCPP_HOME, cold build.mcpp
          # compile): both succeed and produce
          #
          #   ELF 64-bit LSB executable, ARM aarch64, statically linked
          #
          # So the failure is environmental to the runner, not in mcpp, xlings,
          # the index, or the dependency versions. That is what the diagnostic
          # below is for.
          MCPP_TARGET=aarch64-linux-musl \
            SKIP_RUN_VERIFY=1 SKIP_NETWORK_VERIFY=1 \
            bash tools/linux_release.sh
          archive=$(find build -maxdepth 1 -name 'xlings-*-linux-aarch64.tar.gz' | head -1)
          test -f "$archive"
          sha256sum "$archive" > "$archive.sha256"
          package_root=$(mktemp -d)
          tar -xzf "$archive" -C "$package_root"
          bin=$(find "$package_root" -path '*/bin/xlings' -type f | head -1)
          echo "== file =="; file "$bin"
          file "$bin" | grep -q "ARM aarch64" || { echo "NOT aarch64"; exit 1; }
          file "$bin" | grep -q "statically linked" || { echo "NOT static"; exit 1; }
          echo "== qemu xlings --version =="
          ver=$(qemu-aarch64-static "$bin" --version)
          echo "$ver"
          echo "$ver" | grep -q "xlings" || { echo "xlings --version failed under qemu"; exit 1; }

      # Runs ONLY on failure, as its own step.
      #
      # A previous diagnostic here never executed: it hung off the build command
      # with `||`, and under `bash -e` the failing build aborted the step before
      # the diagnostic could print. A whole CI round produced output that could
      # not print. Hence `if: failure()` and a separate step.
      #
      # What it is for: `mcpp` reports the build.mcpp failure as
      #
      #   posix_spawnp('.../xpkg@0.0.54/build.mcpp.bin') failed (error 2)
      #
      # which reads as "the binary is missing". It usually is not. `execve`
      # returns ENOENT when a binary's PT_INTERP -- its dynamic loader -- does
      # not exist, and names the BINARY, not the missing loader. The xlings gcc
      # rewrites PT_INTERP to an absolute path inside whichever home configured
      # its specs, so a loader path that is valid on the packaging machine can
      # be absent on a runner. This step prints that path and whether it exists.
      - name: Why the host build script could not run (diagnostic)
        if: failure()
        run: |
          # `set +e` is load-bearing. GitHub runs this with `bash -e`, and the
          # FIRST version of this diagnostic aborted at `"$bin" --help` (exit
          # 127 -- the very failure being diagnosed), so the half that inspects
          # the toolchain never printed. That is the same trap that killed the
          # diagnostic before it, one level down.
          set +e
          echo "=== build.mcpp artifacts ==="
          find target/.build-mcpp -maxdepth 3 \( -name 'build.mcpp.bin' -o -name '*.cache' \) -printf '%p\t%s bytes\n' 2>/dev/null || echo "(no target/.build-mcpp)"

          bin=$(find target/.build-mcpp -name 'build.mcpp.bin' 2>/dev/null | head -1)
          if [ -n "$bin" ]; then
            echo "=== PT_INTERP of $bin ==="
            interp=$(readelf -p .interp "$bin" 2>/dev/null | sed -n 's/.*\]  //p' | head -1)
            echo "interp = ${interp:-<none/static>}"
            if [ -n "$interp" ]; then
              if [ -e "$interp" ]; then
                echo "interp EXISTS -> ENOENT was NOT the loader"
              else
                echo "interp MISSING -> this is the ENOENT. The loader, not the binary."
              fi
            fi
            echo "=== can it run? ==="
            "$bin" --help >/dev/null 2>&1; echo "exit=$?"
          else
            echo "build.mcpp.bin was never produced -> the host COMPILE failed, not the exec"
          fi

          echo "=== host gcc as the sandbox resolved it ==="
          mcpp self env || true
          for root in "$HOME/.mcpp/registry/data/xpkgs" "$HOME/.xlings/data/xpkgs"; do
            echo "--- $root ---"
            ls "$root" 2>/dev/null | grep -E 'gcc|glibc' || echo "(none)"
            for specs in "$root"/xim-x-gcc/*/lib/gcc/*/*/specs; do
              [ -f "$specs" ] || continue
              echo "specs: $specs"
              grep -aoE '/[^ }%]*ld-linux-x86-64\.so\.2' "$specs" | sort -u | while read -r p; do
                [ -e "$p" ] && echo "  OK      $p" || echo "  MISSING $p"
              done
            done
          done

      - name: Upload aarch64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: xlings-linux-aarch64-candidate
          path: |
            build/xlings-*-linux-aarch64.tar.gz
            build/xlings-*-linux-aarch64.tar.gz.sha256
