name: xlings-ci-aarch64

# aarch64 / Android closed-loop CI for xlings.
#
# xlings is built by mcpp, so an aarch64 xlings is produced exactly like an
# aarch64 mcpp: cross-compile with `mcpp build --target aarch64-linux-musl`
# using the cross toolchain from the xlings ecosystem
# (xim:aarch64-linux-musl-gcc -> xlings-res), then run under qemu-aarch64.
#
# The aarch64 cross support lives in mcpp itself, so we self-host a fresh
# cross-capable mcpp from source (mcpp main) rather than relying on the pinned
# bootstrap mcpp. The artifact is a fully static musl aarch64 ELF — runnable
# natively in Termux on an Android phone (no bionic dependency).

# Release-train integration branches (release/**) run the same matrix as
# main: PRs land on the integration branch first and only reach main once
# the whole train is green, so CI must gate them there, not at merge time.
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOTSTRAP_XLINGS_VERSION: v0.4.69
  # The build tool, pinned for the same reason the index is.
  MCPP_REF: 463dedfa5a36a510df57108a9c562d350d6f9967
  # The package index, pinned to the same ref release.yml and the Windows CI
  # already trust. This job resolved it from `main` -- the last unpinned input
  # after MCPP_REF -- which is why an index bump could break a cross-build that
  # contains none of our commits. Bump together with BOOTSTRAP_XLINGS_VERSION.
  XIM_PKGINDEX_REF: bf969a651caae4539eea8e92e3d14cb60e0eaf53

jobs:
  native-contracts:
    name: native aarch64 compatibility contracts
    needs: cross-build-and-run
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xlings-linux-aarch64-candidate
          path: candidate
      - name: Run native contracts from the cross-built candidate
        run: |
          bash tests/e2e/prepare_fixture_index.sh
          package_root=$(mktemp -d)
          tar -xzf candidate/*.tar.gz -C "$package_root"
          bin=$(find "$package_root" -path '*/bin/xlings' -type f | head -1)
          test -x "$bin"
          "$bin" --version
          XLINGS_BIN="$bin" bash tests/e2e/aarch64_compat_contract_test.sh
      - name: Candidate cold-home and aarch64 fail-closed lifecycle
        run: |
          bash tests/candidate-install/smoke.sh \
            candidate/*.tar.gz candidate/*.tar.gz.sha256

  cross-build-and-run:
    name: cross-build xlings aarch64 (host x86_64) + qemu run
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout xlings
        uses: actions/checkout@v4

      - name: Install system deps + qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl git build-essential qemu-user-static
          qemu-aarch64-static --version | head -1

      - name: Install bootstrap xlings
        env:
          XLINGS_NON_INTERACTIVE: 1
          XLINGS_VERSION: ${{ env.BOOTSTRAP_XLINGS_VERSION }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings"       >> "$GITHUB_ENV"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin"               >> "$GITHUB_PATH"

      - name: Prepare pinned package index
        run: |
          # The same helper release.yml and the Windows CI use, so all three
          # resolve packages from one known-good index rather than from whatever
          # `main` happens to be mid-run.
          rm -rf "$HOME/.xlings/data/xim-pkgindex"
          bash tests/e2e/prepare_fixture_index.sh "$HOME/.xlings/data/xim-pkgindex"
          test -d "$HOME/.xlings/data/xim-pkgindex/pkgs" \
            || { echo "pinned index has no pkgs/"; exit 1; }
          # Assert the pin actually landed. A silently-wrong ref would look like
          # a normal build until something in the index moved under it -- which is
          # exactly the failure this step exists to prevent.
          echo "index at $(git -C "$HOME/.xlings/data/xim-pkgindex" rev-parse HEAD)"

      - name: Cache xlings package payloads
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs
          key: xlings-deps-aarch64-${{ runner.os }}-${{ hashFiles('.xlings.json') }}
          restore-keys: |
            xlings-deps-aarch64-${{ runner.os }}-

      - name: Bootstrap mcpp + GLOBAL mirror
        run: |
          xlings config --mirror GLOBAL
          xlings update -y 2>/dev/null || xlings update 2>/dev/null || true
          xlings install mcpp -y
          # This job deliberately takes the LATEST mcpp, not the pin -- it
          # exists to catch cross-build breakage against the current client.
          mcpp --version

      - name: Build cross-capable mcpp from source (pinned)
        run: |
          # PINNED, not `main`. This is the build TOOL, and it was the one
          # unpinned input in workflows that pin everything else -- the bootstrap
          # xlings and the package index both have refs.
          #
          # It broke on 2026-08-08 and the bisect window contains nothing of ours:
          # xlings main went from green at 2026-08-07T18:29Z to red at
          # 08-08T07:45Z with exactly ONE commit in between -- docs only -- and
          # neither mcpp.toml nor mcpp.lock moved (`xpkg = "0.0.54"` before and
          # after). What moved was mcpp main, which this step cloned unpinned.
          #
          # The symptom is silent, which is why it cost a bisect rather than a
          # glance:
          #
          #   Resolved host toolchain for build.mcpp: gcc 16.1.0 (x86_64-linux-gnu)
          #   build.mcpp compiling
          #   build.mcpp running
          #   error: dependency 'xpkg': build.mcpp exited with 127
          #   posix_spawnp('.../xpkg@0.0.54/build.mcpp.bin') failed (error 2):
          #   No such file or directory
          #
          # "compiling", then "running" a second later, then ENOENT on the output:
          # the compile failed and said nothing, so the first visible error names
          # a missing FILE instead of a failed COMPILE.
          #
          # Likely culprit is mcpp fdad165b ("编译器是能力,不是配置 -- payload
          # 版本权威 + specs 污染", 08-08T03:34Z): it is in the compiler-resolution
          # code this step depends on and lands 43 minutes before the first
          # failure. Correlation, not proof -- and it barely matters, because the
          # fix is the same whichever commit did it. A build tool that can change
          # under a tagged release is not a reproducible build.
          #
          # TO BUMP: change MCPP_REF and let this job be the gate. If it goes red,
          # the new mcpp broke cross-compilation -- that is a finding to report
          # upstream, not a reason to go back to `main`.
          #
          # Shallow AND exact: `--depth 1` cannot check out an arbitrary SHA, so
          # fetch that one commit instead of the whole history.
          mkdir -p /tmp/mcpp-src && cd /tmp/mcpp-src
          git init -q
          git remote add origin https://github.com/mcpp-community/mcpp
          git fetch -q --depth 1 origin "$MCPP_REF"
          git checkout -q FETCH_HEAD
          echo "mcpp source pinned at $MCPP_REF"
          # We are bootstrapping mcpp itself with the already-installed mcpp.
          # Do not let the cloned project's .xlings.json recursively request
          # an older mcpp version that may have left the rolling package index.
          mv .xlings.json .xlings.json.bootstrap
          mcpp self config --mirror GLOBAL

          # Force the index refresh, then ASSERT what landed.
          #
          # The prune above drops the resolved indexes, and mcpp's own
          # re-fetch happily uses whatever it finds in the restored cache --
          # so a freshly published dependency reads as "not found" against an
          # index that demonstrably has it. Measured 2026-08-06:
          # `mcpplibs.xpkg@0.0.53 not found`, while the index commit, the
          # published artifact, the rolling pointer and releases/latest all
          # carried the entry.
          #
          # `mcpp index update` is the refresh; `mcpp index status` prints the
          # revision each index landed on, which is the one datum that makes a
          # stale-index failure readable instead of surfacing two layers away
          # as `<pkg>@<ver> not found`.
          mcpp index update || true
          mcpp index status || true
          # PER PLATFORM, not a whole-file grep.
          #
          # A grep for `["0.0.53"]` passes on a file where the entry exists
          # only under `xpm.linux` -- which is exactly the bug this assert was
          # written to catch and did not: both bumps edited the linux section
          # alone, linux CI went green, and macOS/Windows failed against a
          # file that literally contains the string. Slice the section for
          # THIS platform first.
          mcpp build
          MCPP=$(realpath "$(find target -type f -name mcpp -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2)")
          test -x "$MCPP"
          "$MCPP" self config --mirror GLOBAL
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"

      - name: Cross-build release candidate -> aarch64 static, run under qemu
        run: |
          MCPP_BIN="$MCPP" MCPP_TARGET=aarch64-linux-musl \
            SKIP_RUN_VERIFY=1 SKIP_NETWORK_VERIFY=1 \
            bash tools/linux_release.sh
          archive=$(find build -maxdepth 1 -name 'xlings-*-linux-aarch64.tar.gz' | head -1)
          test -f "$archive"
          sha256sum "$archive" > "$archive.sha256"
          package_root=$(mktemp -d)
          tar -xzf "$archive" -C "$package_root"
          bin=$(find "$package_root" -path '*/bin/xlings' -type f | head -1)
          echo "== file =="; file "$bin"
          file "$bin" | grep -q "ARM aarch64" || { echo "NOT aarch64"; exit 1; }
          file "$bin" | grep -q "statically linked" || { echo "NOT static"; exit 1; }
          echo "== qemu xlings --version =="
          ver=$(qemu-aarch64-static "$bin" --version)
          echo "$ver"
          echo "$ver" | grep -q "xlings" || { echo "xlings --version failed under qemu"; exit 1; }

      - name: Upload aarch64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: xlings-linux-aarch64-candidate
          path: |
            build/xlings-*-linux-aarch64.tar.gz
            build/xlings-*-linux-aarch64.tar.gz.sha256
