name: xlings-ci-luban-fresh

# Luban as a person meets it, from a fresh install of the RELEASED xlings
# (what `latest` is; never a pinned version): every edition made and used on
# the hosts people have, the window, archives, machines, an environment that
# outlives an upgrade, and what macOS and Windows say. The suites are
# tests/fresh-install/luban.sh (bash) and smoke.ps1 (Windows). It tests the
# published experience; the code in the tree is xlings-ci-linux*.yml's.

on:
  workflow_dispatch:
    inputs:
      index_ref:
        description: 'xim-pkgindex branch/tag to test against (blank = the published index)'
        required: false
        default: ''
  # After a release, as xlings-ci-fresh-install does (release.yml's own
  # GITHUB_TOKEN cannot trigger workflows; workflow_run can).
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: '30 6 * * *'

concurrency:
  group: xlings-ci-luban-fresh-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'
  XIM_PKGINDEX_REF: ${{ inputs.index_ref }}
  XLINGS_RELEASE_MIRROR: GLOBAL
  GIT_TERMINAL_PROMPT: '0'

jobs:
  # After a release, the suites wait for the published index to carry it:
  # its bump is merged after the release, and a suite that ran before made
  # systems from the previous luban-os (2026.10.16.1, luban-window), or met
  # the previous luban (luban-host asserts it is the release's).
  index:
    name: the published index carries the release
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Wait for xlings, luban and luban-os latest to be the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          version="${version#v}"
          pointer=https://raw.githubusercontent.com/xlings-res/xim-index/main/xim-index-pointers.json
          for _ in $(seq 120); do
            commit="$(curl -fsSL "$pointer" | jq -r '.indexes.xim.source_commit' || true)"
            carried=0
            if [ -n "$commit" ] && [ "$commit" != null ]; then
              carried=1
              for f in pkgs/x/xlings.lua pkgs/luban/luban.lua pkgs/luban/luban-os.lua; do
                curl -fsSL "https://raw.githubusercontent.com/openxlings/xim-pkgindex/$commit/$f" \
                  | grep -qF "[\"latest\"] = { ref = \"$version\" }" || carried=0
              done
            fi
            if [ "$carried" = 1 ]; then echo "the published index ($commit) carries $version"; exit 0; fi
            sleep 120
          done
          echo "the published index does not carry $version after four hours" >&2
          exit 1

  luban:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    needs: index
    if: >-
      ${{ !cancelled()
          && (needs.index.result == 'success' || needs.index.result == 'skipped')
          && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # nano, tiny and core made and used: x86_64, aarch64, an older host.
          - { suite: luban-console, os: ubuntu-24.04 }
          - { suite: luban-console, os: ubuntu-24.04-arm }
          - { suite: luban-console, os: ubuntu-22.04 }
          # the window: the quick start, the desktop editions (sandbox; KVM machine)
          - { suite: luban-window, os: ubuntu-24.04 }
          # .luban, a directory, a tar
          - { suite: luban-archive, os: ubuntu-24.04 }
          - { suite: luban-archive, os: ubuntu-24.04-arm }
          # the environment as a machine, and an image booted (KVM)
          - { suite: luban-machine, os: ubuntu-24.04 }
          # made by the release before, used after `xlings self update`
          - { suite: luban-upgrade, os: ubuntu-24.04 }
          # a home used for a while (default on an older glibc, its tools, a
          # system of the old layout), then the new client
          - { suite: luban-lived-in, os: ubuntu-24.04 }
          # what a computer that cannot run Luban systems says
          - { suite: luban-host, os: macos-14 }
          - { suite: luban-host, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      # Deliberately no cache: a fresh install is the thing tested.
      - name: KVM
        if: runner.os == 'Linux'
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "no /dev/kvm on this runner"; fi
      - name: Run ${{ matrix.suite }}
        if: runner.os != 'Windows'
        env:
          LUBAN_SCREENSHOTS: ${{ github.workspace }}/luban-fresh
          GH_TOKEN: ${{ github.token }}
        run: bash tests/fresh-install/smoke.sh ${{ matrix.suite }}
      - name: Run ${{ matrix.suite }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File tests/fresh-install/smoke.ps1 -Suite ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luban-fresh-${{ matrix.suite }}-${{ matrix.os }}
          path: luban-fresh/
          if-no-files-found: ignore
