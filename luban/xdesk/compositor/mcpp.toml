# xdesk-compositor: the parts of xdesk that serve Wayland and draw, over
# wlroots and the C graphics libraries:
#
#   xdesk.compositor  a Wayland compositor whose output is an opensal surface
#                     (no screencopy, no injected input): wlroots' headless
#                     backend and pixman renderer, so it runs with no GPU
#   xdesk.draw        2D drawing and text for what the compositor draws itself
#   xdesk.shell       the desktop around the windows: panel, launcher,
#                     notifications, canvas navigation
#   xdesk.native.*    the C libraries' headers, read only here (wayland:
#                     xkbcommon, pixman; text: FreeType, HarfBuzz) -- the rest
#                     imports them (tools/lint_c_headers.sh)
#
# The layout engine it arranges windows with is xdesk.layout (xdesk-layout).
# Like every xdesk package it imports nothing of xlings or Luban.
[package]
namespace = "xdesk"
name      = "xdesk-compositor"
version   = "0.1.0"

[targets.xdesk-compositor]
kind = "lib"

[dependencies]
xdesk-base   = { path = "../base" }
xdesk-layout = { path = "../layout" }
opensal    = { path = "../../specs/opensal" }

[dependencies.wlroots]
# No DRM, libinput, session or GLES: headless and pixman are what a machine
# or a sandbox without a GPU runs, and they are always built.
wlroots = { version = "0.20.2", default-features = false }

[dependencies.freedesktop]
wayland-server = "1.26.0"
libxkbcommon   = "1.13.2"

[dependencies.compat]
pixman   = "0.46.4"
# xdesk.draw's text: stable releases (libraries no user meets).
freetype = "2.13.3"
harfbuzz = "14.3.0"
