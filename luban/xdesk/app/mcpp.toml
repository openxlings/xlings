# xdesk: one desktop session -- the compositor, its shell and its settings
# (share/xdesk/xdesk.ini: WuXian's workspaces, tiled or free), an opensal consumer whose standard input and output are opensal.wire (Luban OS
# desktop part 2 §2).
[package]
namespace = "xdesk"
name      = "xdesk-app"
version   = "0.1.0"

[targets.xdesk]
kind = "bin"
main = "src/main.cpp"

[dependencies]
xdesk-compositor = { path = "../compositor" }
opensal          = { path = "../../specs/opensal" }
xdesk-base       = { path = "../base" }

[build]
# What wlroots' package links and xdesk does not call stays out of NEEDED
# (libEGL, libGLESv2 and libgbm stay: the GLES renderer, chosen at start).
ldflags = ["-Wl,--as-needed"]
