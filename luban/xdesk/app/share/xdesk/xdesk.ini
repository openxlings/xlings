# xdesk's own session: each workspace tiled, stacked or a canvas, as it was
# left (Super+m), a panel, a launcher.
# A system's own settings go in /etc/xdg/xdesk/xdesk.ini, a person's in
# ~/.config/xdesk/xdesk.ini; each wins key by key over what is here.

[desktop]
# The terminal Super+Return (Alt+Return) opens, as an Exec= line.
# Unset: the system's default terminal (share/xdg-terminals).
# terminal = foot
# Programs started with the session (one per line; shell syntax).
# autostart = foot
gap = 8
workspaces = 4

[theme]
accent = #5e9cff
background = #1b1e25

[keyboard]
# An xkb layout (us, de, fr, ...); other than us needs xkeyboard-config.
layout = us
repeat_rate = 30
repeat_delay = 500
