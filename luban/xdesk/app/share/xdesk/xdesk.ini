# xdesk's settings: workspaces on WuXian (the infinite canvas), each tiled or
# stacked (Super+M), a status bar, a launcher. Every xdesk session reads this
# (the xdesk-classic and xdesk-canvas sessions of before too).
# A system's own settings go in /etc/xdg/xdesk/xdesk.ini, a person's in
# ~/.config/xdesk/xdesk.ini; each wins key by key over what is here (the
# settings window writes the person's, and puts a page back to these).

[desktop]
# The terminal Super+Return (Alt+Return) opens, as an Exec= line.
# Unset: the system's default terminal (share/xdg-terminals).
# terminal = foot
# Programs started with the session (one per line; shell syntax).
# autostart = foot
# Between windows, and at the edges (pixels; 4 and 0 when not set here or in
# a system's or a person's file -- `gap` of before is the one between).
# inner_gap = 4
# outer_gap = 0
# A new workspace's rule: tile or stack.
rule = tile
# The status bar shows the other workspaces beside the current one.
status_others = on

[wuxian]
minimap = on
snap = on

[switchers]
# Super+Tab held on an application this long: its windows (ms).
hold_ms = 500
# The window chosen stays lit this long, the others dimmed (ms; 0: not at all).
highlight_ms = 500
dim = 0.5

[scroll]
# slow, medium or fast; a tiled strip's scroll lands on a column.
speed = medium
snap = on

[theme]
accent = #5e9cff
background = #1b1e25

[keyboard]
# An xkb layout (us, de, fr, ...); other than us needs xkeyboard-config.
layout = us
repeat_rate = 30
repeat_delay = 500
