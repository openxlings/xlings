# xdesk's classic profile: windows side by side, a panel, a launcher.
# A system's own settings go in /etc/xdg/xdesk/classic.ini, a person's in
# ~/.config/xdesk/classic.ini; each wins key by key over what is here.

[desktop]
# The terminal Super+Return (Alt+Return) opens, as an Exec= line.
terminal = foot
# Programs started with the session (one per line; shell syntax).
# autostart = foot
gap = 8
workspaces = 4

[theme]
accent = #5e9cff
background = #1b1e25

[keyboard]
# An xkb layout (us, de, fr, ...); other than us needs xkeyboard-config.
layout = us
repeat_rate = 30
repeat_delay = 500
