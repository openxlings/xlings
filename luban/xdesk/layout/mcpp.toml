# xdesk-layout: where a desktop puts its windows -- pure logic, no drawing, no
# Wayland, so every arrangement and every operation is a unit test (design
# 2026-10-19 §17, §21):
#
#   xdesk.layout  workspaces, each with its arrangement -- tile (scrolling
#                 columns), stack (overlapping, snapped), canvas (pan, zoom,
#                 overview, tiled groups) -- switched reversibly; floating,
#                 focus moves and springs
#
# Any compositor can use it; xdesk-compositor does. Like every xdesk package
# it imports nothing of xlings or Luban (tools/lint_layer_deps.sh).
[package]
namespace = "xdesk"
name      = "xdesk-layout"
version   = "0.1.0"

[targets.xdesk-layout]
kind = "lib"
