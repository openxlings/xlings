# xdesk-layout: where a desktop puts its windows -- pure logic, no drawing, no
# Wayland, so every arrangement and every operation is a unit test (design
# 2026-10-19 §17, §21):
#
#   xdesk.layout  WuXian (openwx): one infinite plane, workspaces on it --
#                 tile (scrolling columns) or stack (overlapping, snapped),
#                 switched reversibly -- free windows beside them, the
#                 workspace view and the WuXian view, drag and drop on a
#                 frozen arrangement, wuxian.json; floating, focus, springs
#
# Any compositor can use it; xdesk-compositor does. Like every xdesk package
# it imports nothing of xlings or Luban (tools/lint_layer_deps.sh); it
# implements openwx, a specification.
[package]
namespace = "xdesk"
name      = "xdesk-layout"
version   = "0.1.0"

[targets.xdesk-layout]
kind = "lib"

[dependencies]
openwx = { path = "../../specs/openwx" }
