# opensal: a surface -- something that is given pixels and gives back events --
# its optional interfaces, and opensal.wire, which carries them across an
# address space. A
# specification with more than one implementer: a window that shows a
# surface (the Luban OS window), a desktop that draws one (xdesk), a bridge
# that makes any wlroots compositor one (opensal-wlr). It depends on nothing
# but the standard library, so anything may use it.
[package]
namespace = "opensal"
name      = "opensal"
version   = "0.1.0"

[targets.opensal]
kind = "lib"
