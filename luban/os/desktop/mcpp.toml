# opensal's provider on the host (Luban OS architecture design §9, §14.6): a
# window this machine's display gives -- its input, the host's input method,
# its clipboard, its density -- and imgui drawn into it. Implemented on SDL3
# (compat.sdl3: X11 on Linux, native on Windows and macOS), one backend for
# every platform; a native backend can take its place without the app
# changing. Dynamically linked, like everything that opens a window: static
# musl has no dlopen.
#
# The headers stay here: luban.desktop.imgui exports what the app draws with,
# so the app imports ImGui instead of including it (tools/lint_c_headers.sh).
[package]
namespace = "luban"
name      = "luban-desktop-host"
version   = "0.1.0"

[targets.luban-desktop-host]
kind = "lib"

[dependencies]
opensal = { path = "../../specs/opensal" }

[dependencies.compat]
sdl3  = "3.4.2"
imgui = "1.92.8-docking"
