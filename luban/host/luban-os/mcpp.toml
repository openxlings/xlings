# Luban OS, the app (Luban OS architecture design §14): a window that is a
# display -- a list of systems, then the system itself, its console or its
# desktop -- and a management panel for everything else. It reaches
# environments and machines through luban.service and luban.vm only, so it can
# do nothing the luban command cannot; what it adds is showing them.
#
# Dynamically linked (it opens a window); shipped as the index package
# `luban-os`, which also installs its desktop entry.
[package]
namespace = "luban"
name      = "luban-os"
version   = "0.1.0"

[targets.luban-os]
kind = "bin"
main = "src/main.cpp"

[dependencies]
i18n               = { path = "../../../modules/i18n" }
luban-compat = { path = "../../os/compat" }
libs               = { path = "../../../modules/libs" }
platform           = { path = "../../../modules/platform" }
runtime            = { path = "../../../modules/runtime" }
subos              = { path = "../../../modules/subos" }
luban-service      = { path = "../../os/service" }
luban-vm           = { path = "../../os/vm" }
opensal            = { path = "../../specs/opensal" }
openhal            = { path = "../../specs/openhal" }
xdesk-base = { path = "../../xdesk/base" }
luban-desktop-host = { path = "../../os/window" }
imkit              = { path = "../../kits/imkit" }
tray               = { path = "../../kits/tray" }
opensal-wlr        = { path = "../../kits/opensal-wlr" }
xbus               = { path = "../../services/xbus" }
openbus            = { path = "../../specs/openbus" }

[dependencies.compat]
imgui = "1.92.8-docking"
