# Luban: what exists only when a SubOS is a machine (SubOS design part 3 §8).
#
#   stage0   the machine's first process -- before /proc, before any home or
#            Config is read; apps/luban started as luban-init
#   cli      the luban command (apps/luban): environments and the machine,
#            each command an xlings command run on the same terminal
#
# The formats both sides read live in modules/: boot.json (xlings.subos.boot),
# a root's /etc (xlings.subos.root_etc), images (xlings.image).
#
# It depends on modules/ (the shared layer) and never on the xlings frontend
# (src/): tools/lint_layer_deps.sh fails an `import xlings.core.*` here, which
# is how "nothing on stage-0's path reads Config" is a build rule and not a
# convention.
[package]
namespace = "luban"
name      = "luban"
version   = "0.1.0"

[targets.luban]
kind = "lib"

[dependencies]
libs     = { path = "../modules/libs" }
platform = { path = "../modules/platform" }
runtime  = { path = "../modules/runtime" }
subos    = { path = "../modules/subos" }
cli      = { path = "../modules/cli" }
image    = { path = "../modules/image" }

[build]
include_dirs = ["../modules/libs/src/json"]
