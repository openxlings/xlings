# A terminal's screen and the byte stream that paints it (Luban OS
# architecture design §14): what the Luban OS window shows of an environment's
# console. It knows nothing of pixels, processes or windows -- bytes in, a grid
# of cells and the replies a program expects out -- which is the part worth
# testing on its own.
[package]
namespace = "luban"
name      = "luban-desktop-term"
version   = "0.1.0"

[targets.luban-desktop-term]
kind = "lib"
