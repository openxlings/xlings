# XBus: a base service of Luban OS, openbus's implementation -- the router
# (one per host and per system), the node library programs reach it with,
# links between routers over any byte stream, and the `xbus` command (tool/).
# The system calls are read only under src/native/ (xbus.native).
[package]
namespace = "xbus"
name      = "xbus"
version   = "0.1.0"

[targets.xbus]
kind = "lib"

[dependencies]
openbus = { path = "../../specs/openbus" }

[dependencies.nlohmann]
json = "3.12.0"

[target.windows.build]
ldflags = ["-lws2_32"]
