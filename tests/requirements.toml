[F11]
text = "--keep / --ttl mean session idle time (the keeper is replaced by the session)"
status = "required"

[F12]
text = "a failed probe reports the raw error and least-privilege fixes, never a global sysctl"
status = "required"

[F13]
text = "a lane that declares a capability fails when it is missing"
status = "required"

[F14]
text = "a system install's shared config is not world-writable"
status = "required"

[F15]
text = "a supervisor outside the sandbox writes the audit; the sandbox cannot reach it"
