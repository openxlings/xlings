status = "required"

[PROCESS-TERMINAL-JOB]
text = "a child run with a deadline in its own process group holds the caller's terminal while it runs, and the terminal comes back"
status = "required"

[TK-HOME]
text = "an isolated home lives outside the user's home and is removed"
status = "required"

[TK-CAPS]
text = "an unknown capability fails; network is opt-in"
status = "required"

[TK-META]
text = "XTEST metadata is registered before tests run"
status = "required"

