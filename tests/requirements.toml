status = "required"

[LUBAN-SHARE-PROJECTION]
text = "a payload's share/ reaches /usr/share: directories many packages write into are merged file by file, one package's directory is claimed whole, and a link never has a link above or below it"
status = "required"

[XIM-INDEX-DIR-STORE]
