text = "the Intent IR and the confine registry produce byte-identical bwrap argv to the code they replaced"
status = "required"

[GATE-CONFORM]
text = "the platform matrix is the implementations' probes, not a hand-kept table"
status = "required"

[CARRIER-LOCAL]
text = "where a SubOS runs is chosen by what it is (part 3 §5.6), recorded and listed; a carrier is reached through a launcher prefix and the NDJSON interface"
status = "required"

[CARRIER-WSL-LIFECYCLE]
text = "a wsl2 carrier is created per home on first need, reached through wsl.exe, stopped when idle, unregistered only by a confirmed removal"
status = "required"

[CARRIER-WSL-INTEROP-OFF]
text = "inside a wsl2 carrier, Windows executables cannot run and /mnt/c is not mounted"
status = "required"

[CARRIER-WSL-GRANT]
text = "only granted host directories are visible in a wsl2 carrier, and only for the session"
status = "required"

[CARRIER-UNAVAILABLE]
text = "without a usable carrier a Must refuses with the route and a native SubOS is unaffected"
status = "required"

[VIEW-CARRIER-EQ]
text = "one content declaration yields the same root view on every carrier"
status = "deferred"
why = "needs a real guest kernel (WSL2 or a VZ VM): hosted runners have no nested virtualization, and the stand-in wsl.exe runs on the host kernel -- it proves routing, not the guest root; tests/e2e/windows_carrier_wsl2_test.ps1 runs it wherever WSL2 exists"

[CARRIER-VZ-LIFECYCLE]
text = "a vz carrier VM is created per home on first need through its helper's contract, started when stopped, reached through it, and grants are the helper's virtiofs shares"
status = "required"

[CARRIER-VZ-HELPER]
text = "xlings-vm, the signed Virtualization.framework helper that answers the vz carrier's contract, is published as a payload"
status = "deferred"
why = "a separate Swift package signed with com.apple.security.virtualization; hosted macOS runners cannot nest a VM to test it. Until it is published the vz carrier is refused with `xlings install xlings-vm` as its route (CARRIER-UNAVAILABLE)"

[SESSION-NATIVE-SUPERVISED]
text = "a native SubOS on macOS runs under the supervisor (start, join, stop, --timeout, the exit-code table); on Windows its command runs in a Job Object (tree ended at --timeout, the command's exit code); joining a running session on Windows needs a CreateProcess supervisor and is part 3 §6.3's next step"
status = "required"

[OPENKAL-COEXIST]
text = "openkal-linux links and runs beside xlings' C and C++ runtimes (glibc and the static musl release target)"
status = "deferred"
why = "evidence, not a product behaviour: the xlings-ci-linux step 'openkal coexistence' builds and runs tools/openkal-coexistence for both targets on every PR; nothing of xlings links openkal yet (part 3 §19, C53)"

[LUBAN-INIT]
text = "stage-0 is its own static binary and reads no Config"
status = "required"

[TOOLS-PROVENANCE]
text = "every external tool is a package of the index, for every architecture it is released for, unless the operating system itself is the tool (and the table says why); a missing tool's remedy is `xlings install <package>`, never a machine's package manager"
status = "required"

[HOST-DEPS-T0]
text = "what xlings and its tests take from the machine is the T0 list (kernel, sudo, apparmor_parser, mount, the OS's own tools); CI and tests install everything else through xlings (tools/lint_host_deps.sh)"
status = "required"

[LUBAN-ISO-UEFI]
text = "an exported ISO boots on UEFI without xorriso: an El Torito EFI entry written in-process (beside the BIOS default where the machine has a BIOS, as the default where it does not)"
status = "required"

[LUBAN-ISO-HYBRID]
text = "an exported ISO written to a drive boots it too: a hybrid GPT whose EFI system partition is the El Torito image, the backup table appended, still an ISO 9660 image"
status = "required"

[LUBAN-QCOW2]
text = "--qcow2 is written in-process (qcow2 v3, zero clusters unallocated) and reads back as the raw disk"
status = "required"

[CARRIER-WSL-SETUP]
text = "a Windows machine's first Linux SubOS gets its one-time setup from xlings -- WSL from the index (xim:wsl-installer, Microsoft's MSI) and the Virtual Machine Platform through the elevation door -- asked where it is needed, never a command to find and type"
status = "required"

[XVM-PROJECTION-DELTA]
text = "a change to a scope's activation (use, a registration, a removal) materialises the names that move and nothing else: the cost of switching one package does not grow with the SubOS"
status = "required"

# ── remove: versions (2026.10.12.2) ─────────────────────────────────

[XIM-REMOVE-GUARD-VERSION]
text = "removing a version is refused only when it breaks a dependent: one that links that payload, or runs its programs and has no other installed version meeting its constraint"
status = "required"

[XIM-REMOVE-OLDER-THAN]
text = "remove <name> --older-than V removes every older version nothing uses, keeps (and says why) what is active in a subos or project or linked, asks first, and --dry-run changes nothing"
status = "required"

[UX-THEME-ONCE]
text = "a configured theme that cannot be used is reported once per setting and cause, and never inside a SubOS view or a Luban root, where the default is used silently"
status = "required"

[SES-TTY-JOBCTL]
text = "a command on a terminal whose foreground is another process group (a background job, a brokered command on a session's terminal) never changes the terminal's modes, so the kernel never stops it -- nor `luban enter` with it"
status = "required"

[UPGRADE-OLD-HOME-LUBAN]
text = "an environment made from an edition on a home an older client filled (payloads without resolution records, or recorded against another runtime) is made without failures: the plan migrates the record or reinstalls the payload, and never asks the user to run --reconfig"
status = "required"

[SUBOS-OWN-HOME-INSIDE]
text = "inside a sandbox, a command for a home the sandbox owns (XLINGS_HOME it can write, e.g. mcpp's registry) runs there; only the session's read-only home goes to the broker or is owner-only"
status = "required"

[PERF-LARGE-HOME]
text = "in a home of thousands of targets and several known projects, use / install --use / remove / remove --older-than / list / self doctor of one package stay within their budgets: their cost is what the change moves, not what the home holds"
status = "required"

[LUBAN-NEW-OUTPUT]
text = "luban new / subos new --from names the edition and its chain once, prints no per-template or per-generation lines, and reports packages that failed only because a dependency did as one line under that cause"
status = "required"

[LUBAN-NEW-RERUN]
text = "an environment a failure left unfinished is finished by running the same luban new / subos new --from again; another edition under the same name is refused with the command that finishes it"
status = "required"

# ── upgrade and fault isolation (docs/specs/upgrade-and-compatibility.md) ──

[UPGRADE-LADDER]
text = "the first command of a new client runs the home's upgrade steps by itself, records {from, to, pending} and logs/upgrade.ndjson, and says nothing when nothing is pending"
status = "required"

[UPGRADE-PENDING-ONCE]
text = "what the upgrade cannot do by itself is said once, by the command that found it: how many root causes, the one command that repairs them and where the items are (each with its command in logs/upgrade.ndjson; -v prints them); the command asked for still runs"
status = "required"

[UPGRADE-FIRST-RECORD]
text = "a home without an upgrade record reports what it finds as already there, not as something this version could not do, and offers no way back"
status = "required"

[DOCTOR-REMEDY-CLEARS]
text = "a finding doctor reports with a repair is one the repair clears: the package's own registration at its payload root (`xvm.add(package.name)`) is not a broken program"
status = "required"

[HOME-FORMAT-STEPS]
text = "the steps that bring an older home to this client's layout are ordered, idempotent and recorded, each its own failure domain; the upgrade runs them and so does `self doctor --fix`"
status = "required"

[HOME-FORMAT-SWITCH-NOTE]
text = "switching the client to an older one says what of this home's layout it will not see, whether it can still write it, and the way back"
status = "required"

[LAYER-LUBAN-OWNS-MACHINE]
text = "a machine's boot entries and the images a machine boots are Luban's: xlings says where `subos boot` and `subos export --iso/--drive/--qcow2` went, keeps the implementation behind plumbing names, never imports luban.*, and a home whose stage-0 was xlings boots luban-init after the upgrade"
status = "required"

[OPS-JOURNAL]
text = "every command writes one operation journal (logs/ops/<date>/<trace>.ndjson) that the processes it runs join under the trace they inherit; credentials never reach it; `self log` lists and shows operations and bundles one without the home's paths or the user's name"
status = "required"

[LUBAN-PERSIST]
text = "an environment's persist setting decides what a session keeps of a root's own state: all, only /home, or nothing (a memory overlay, gone when the session ends); a backend without a mount namespace refuses it with the route"
status = "required"

[LUBAN-SETTINGS]
text = "an environment's machine settings (mode, persist, desktop, on-close) are checked values in its machine.json; every key another luban wrote survives a change, and a file that cannot be read is an error, never the defaults"
status = "required"

[LUBAN-ARCHIVE]
text = "`luban export <n> x.luban` writes the manifest (edition, packages, policy, settings) and the root's own state, links as links, nothing of /usr, no persona; import refuses a path that leaves the environment, an existing name, and a policy looser than the edition's without -y"
status = "required"

[LUBAN-OUTPUT]
text = "luban's default output is one line per phase, the conclusion and the next step in luban's own commands; a step's own lines are -v's; --json is one event per line and the result"
status = "required"

[LUBAN-SHELL]
text = "an environment's login shell is its passwd's: a root made now gets the best shell its /usr has (fish, bash, else sh), luban config --shell changes it, a shell the root lacks is refused with the install that brings it, and every way in reads the same answer"
status = "required"

[SUBOS-INSTANCES-APART]
text = "a sandboxed SubOS shares the home's common part (payloads, indexes, shims) read-only and never another instance: other instances' trees and their config (policy, persona, record) are out of sight; its own config is read-only; a backend that cannot hide them (proot) says so as a degradation and a policy that requires the file-system gate refuses it"
status = "required"

[LUBAN-MACHINE]
text = "luban enter <n> --mode machine boots the environment itself with its own kernel: its tree and the home are shared with the guest (9p), a supervisor outlives the terminal and serves every session over one socket, each session a pty with the root's login shell and the terminal's size; persist home/none and --temp boot a copy that goes with the machine; an image file boots as it is with its console on the terminal; closing follows the environment's on-close setting"
status = "required"

[LUBAN-TERM]
text = "the Luban OS window's console is a terminal whose screen follows what shells and full-screen programs write (cursor motion, erase, scroll regions, the alternate screen, SGR in three colour depths, wide characters, bracketed paste, the title), answers what a shell asks, keeps history, and sends keys as xterm does"
status = "required"

[LUBAN-DESKTOP-WIRE]
text = "opensal.wire carries a surface across an address space: damaged rectangles of pixels and every opensal event, whole whatever the cut of the stream, refusing what is not the protocol"
status = "required"

[LUBAN-OS-APP]
text = "the Luban OS app is a window that is a display: no system yet is quick start, one or more is the launcher (one list, the default first, a countdown that any input cancels, 0 for none), the system's console or desktop fills the window, the management panel holds everything else; it reaches environments and machines only through luban.service and luban.vm"
status = "required"

[LUBAN-AUDIO]
text = "sound is existing standards, no new protocol: a sandbox's audio grant maps the host's PipeWire / PulseAudio socket; a machine whose policy grants audio reaches it through a forwarded port relayed by luban (__pipe-unix), its sessions told PULSE_SERVER"
status = "required"

[ELEVATION-NOBODY-TO-ASK]
text = "administrator rights are never asked for where nobody can answer (agent mode, no terminal, the background of one): rights that need no question are used, otherwise nothing runs and the command that needs them is named; doctor's repair children run unattended with the null device as input"
status = "required"

[UPGRADE-DOWNGRADE]
text = "a client older than the one that last upgraded the home changes no record and says how to go back to the newer one"
status = "required"

[FAULT-HOME-CONFIG]
text = "a home config that is not readable JSON, or a field of the wrong shape, is named by every command with its fix; self doctor reports it; --fix keeps the file and rebuilds the version records and the SubOS registry"
status = "required"

[FAULT-ISOLATION]
text = "an unreadable SubOS state stops nothing else: the other SubOS and the commands that do not need it carry on"
status = "required"

[LUBAN-DESKTOP-WLR]
text = "opensal-wlr shows a wlroots compositor's output as an opensal surface through its standard protocols only: screencopy into shared memory (the whole output first, then what it says changed, opaque), keys as evdev codes on a US keymap with the modifiers beside them (a host's repeat is not repeated), the pointer absolute on the output, the window's size as a custom mode; a compositor without screencopy is said so; a session is a wayland-sessions file with X-Opensal-Interfaces"
status = "required"

[LUBAN-MACHINE-DESKTOP]
text = "a machine whose root declares a desktop session shows it to the Luban OS window: the guest starts the session headless with its /run and /tmp its own, bridges it on a channel of the machine (opensal.wire), at the size the window asks; what is typed into it runs there"
status = "required"

[SUBOS-CMD-STDOUT]
text = "`subos use <n> --cmd <c>` is a script: its standard output is the command's alone, byte for byte -- no announcement of the entry"
status = "required"

[LUBAN-BOOT-ENTRIES]
text = "`luban boot` shows a machine's boot entries -- default, fallback, the next boot once -- and what this boot was (the entry, how it was chosen, whether it was marked good), as stage-0 recorded it"
status = "required"
