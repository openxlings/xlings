# ── findings (design §1) ────────────────────────────────────────────

[F1]
text = "inside a sandbox the xlings home is read-only except the instance's own tree"
kind = "isolation"
status = "required"

[F2]
text = "X11 is unreachable unless granted (no host abstract sockets)"
kind = "isolation"
status = "required"

[F3]
text = "only allow-listed environment variables enter the sandbox"
kind = "isolation"
status = "required"

[F4]
text = "host processes are invisible (pid namespace)"
kind = "isolation"
status = "required"

[F5]
text = "net=nat/none hides the host's network identity (ARP, interfaces)"
kind = "isolation"
status = "required"

[F6]
text = "other instances' trees are invisible"
kind = "isolation"
status = "required"

[F7]
text = "hostname, timezone and locale are neutral under private/locked"
kind = "isolation"
status = "required"

[F8]
text = "terminal injection (TIOCSTI) is blocked"
kind = "isolation"
status = "required"

[F10]
text = "backend lookup: root-owned bwrap, then a system bwrap that probes, then the payload; no setuid"
status = "required"

[F11]
text = "--keep / --ttl mean session idle time (the keeper is replaced by the session)"
status = "required"

[F12]
text = "a failed probe reports the raw error and least-privilege fixes, never a global sysctl"
status = "required"

[F13]
text = "a lane that declares a capability fails when it is missing"
status = "required"

[F14]
text = "a system install's shared config is not world-writable"
status = "required"

[F15]
text = "a supervisor outside the sandbox writes the audit; the sandbox cannot reach it"
kind = "isolation"
status = "required"

[F16]
text = "subos exec runs argv without a shell, from outside the instance"
status = "required"

