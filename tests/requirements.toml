# Requirement IDs and their status (design §24.4).
#
# Every ID here names a behaviour the SubOS design (or a finding it fixes)
# promises. Tests claim IDs with `covers = {...}` in their XTEST metadata;
# `xdev report --requirements tests/requirements.toml --fail-uncovered`
# fails when
#   - a `required` ID has no test, or
#   - a test names an ID this file does not declare (a typo would otherwise
#     cover nothing and look like coverage).
#
# kind   = "flow"       any test covers it
#        = "isolation"  only a test with `proves = "isolation"` (one that runs
#                       a real sandbox) covers it; the fake provider proves
#                       that the path is wired, not that anything is isolated
# status = "required"   built; must be covered
#        = "planned"    designed, its checkpoint has not landed yet; the
#                       commit that lands it flips the status
#        = "deferred"   not in this PR; `why` says so

# ── testkit (T1) ────────────────────────────────────────────────────

[TK-RUN]
text = "the runner reports exit code, stdout and stderr"
status = "required"

[TK-HERMETIC]
text = "a run starts from the environment the test names, nothing inherited"
status = "required"

[TK-TIMEOUT]
text = "a timed-out run is killed with its process group"
status = "required"

[TK-PTY]
text = "a pty with nothing typed exposes a program that waits for input"
status = "required"

[TK-HOME]
text = "an isolated home lives outside the user's home and is removed"
status = "required"

[TK-CAPS]
text = "an unknown capability fails; network is opt-in"
status = "required"

[TK-META]
text = "XTEST metadata is registered before tests run"
status = "required"

# ── findings (design §1) ────────────────────────────────────────────

[F1]
text = "inside a sandbox the xlings home is read-only except the instance's own tree"
kind = "isolation"
status = "required"

[F2]
text = "X11 is unreachable unless granted (no host abstract sockets)"
kind = "isolation"
status = "required"

[F3]
text = "only allow-listed environment variables enter the sandbox"
kind = "isolation"
status = "required"

[F4]
text = "host processes are invisible (pid namespace)"
kind = "isolation"
status = "required"

[F5]
text = "net=nat/none hides the host's network identity (ARP, interfaces)"
kind = "isolation"
status = "required"

[F6]
text = "other instances' trees are invisible"
kind = "isolation"
status = "required"

[F7]
text = "hostname, timezone and locale are neutral under private/locked"
kind = "isolation"
status = "required"

[F8]
text = "terminal injection (TIOCSTI) is blocked"
kind = "isolation"
status = "required"

[F10]
text = "backend lookup: root-owned bwrap, then a system bwrap that probes, then the payload; no setuid"
status = "required"

[F11]
text = "--keep / --ttl mean session idle time (the keeper is replaced by the session)"
status = "required"

[F12]
text = "a failed probe reports the raw error and least-privilege fixes, never a global sysctl"
status = "required"

[F13]
text = "a lane that declares a capability fails when it is missing"
status = "required"

[F14]
text = "a system install's shared config is not world-writable"
status = "required"

[F15]
text = "a supervisor outside the sandbox writes the audit; the sandbox cannot reach it"
kind = "isolation"
status = "required"

[F16]
text = "subos exec runs argv without a shell, from outside the instance"
status = "required"

