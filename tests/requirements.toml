status = "required"

[ROOT-ROLLBACK]
text = "rollback moves the pointer; it does not re-run use"
status = "required"

[ROOT-ETC-FACTORY]
text = "factory /etc fills only what is missing; sysusers only appends"
status = "required"

[ROOT-LIBSEARCH]
text = "a host-built program (PT_INTERP /lib64/ld-linux) runs in a root, finding its libraries through /lib64 = the root's /usr/lib"
status = "required"

[ROOT-NO-HOST]
text = "a process in a root maps nothing from outside it"
status = "required"

[ROOT-SURVIVES-GLIBC]
text = "with glibc broken, the static xlings rolls the root back"
status = "required"

[ROOT-SELF-UPDATE]
text = "in deployment R, self update is a new generation of the host SubOS and can be rolled back"
status = "required"

[INST-ROOTFS]
text = "--rootfs instance: uid 0 inside, no host /usr, policy, broker and audit as for any instance"
status = "required"

[EXPORT-OCI]
text = "subos export --tar is a root docker imports and runs"
status = "required"

[EXPORT-WSL]
text = "subos export --tar imports with wsl --import, and the imported root is the edition (WSL 2 on CI; blocking)"
status = "required"

[EXPORT-DISK]
text = "subos export --disk boots under qemu"
status = "required"

[BOOT-STAGE0]
text = "stage-0 picks the host from boot.json, points /usr at it and execs its init"
status = "required"

[BOOT-ONCE-FALLBACK]
text = "a trial boot not marked good falls back; marked good it becomes the default"
status = "required"

[BOOT-NOW]
text = "subos boot --now switches user space where the init supports it, refuses elsewhere"
status = "required"

[LUBAN-TINY]
text = "luban-tiny: created from its xpkg, exported, booted, installs inside"
status = "required"

[LUBAN-CORE]
text = "luban-core: compiles and runs a program inside"
status = "required"

[LUBAN-DESKTOP-RENDER]
text = "luban-desktop: a GL program compiled inside renders a frame offscreen, every GL object from the payloads"
status = "required"

[LUBAN-FROM-CHAIN]
text = "an xpkg's from chain merges workspaces, the upper one winning; subos new --dry-run says each layer (its index, its manifest as written) and the packages merged, making nothing; an instance records the index of each layer"
status = "required"

[ROOT-LDCACHE]
text = "a root's own /etc/ld.so.cache (ldconfig) is read by programs that enter through /lib64"
status = "required"

[OUTPUT-PRESERVE]
text = "pack/export refuse existing outputs; cleanup only removes exclusively owned staging"
status = "required"

[STATE-STRICT]
text = "missing legacy metadata defaults; invalid or unreadable present SubOS/boot metadata is refused"
status = "required"

[STATE-KEEP-UNKNOWN]
text = "SubOS/boot metadata writes preserve unknown fields"
status = "required"

[OBS-AUDIT-FAIL]
text = "locked refuses startup and terminates execution when its audit journal cannot be written"
status = "required"

[ROOT-REFRESH-FAIL]
text = "workspace write commands fail when their root projection cannot be updated"
status = "required"

[POLICY-MIN-CLIENT]
text = "policy declares a minimum client; unsupported clients refuse and doctor explains compatibility"
status = "required"

[REPORT-EXECUTION-EVIDENCE]
text = "report distinguishes declaration coverage from passed evidence; skipped tests cannot verify requirements"
status = "required"

[CI-TEST-SELECTION]
text = "ci plan and test share real discovery, transitive change impact, capability selection and deterministic duration-aware shards without duplicates or omissions"
status = "required"

[CI-RESOURCE-LOCKS]
text = "test resources are locked across concurrent runners with deterministic acquisition and automatic release"
status = "required"

[TEST-HTTP-FIXTURE]
text = "local HTTP fixtures serve owned test data on loopback without external network access"
status = "required"

[CI-TRENDS]
text = "Reports retain per-platform execution trends, flag intermittent results, and export measured shard weights"
kind = "flow"
status = "required"

[ROOT-STORE-CLOSURE]
text = "Root sessions expose only checked runtime payloads and immutable generations, with synchronous broker refresh"
kind = "isolation"
status = "required"

[DOM-SOURCE]
text = "A private logical-prefix domain borrows only proved read-only system payloads and exports its checked closure as image-owned data"
kind = "isolation"
status = "required"

[PERF-GEN-BUILD]
text = "Building a root generation from 300 package payloads takes at most one second"
kind = "flow"
status = "required"

[PERF-GEN-SWITCH]
text = "Switching an existing root generation takes at most ten milliseconds"
kind = "flow"
status = "required"

[PERF-STAGE0]
text = "Real PID 1 startup through preparing exec init takes at most 200 milliseconds, including fallback and boot --now"
kind = "flow"
status = "required"

# ── SubOS design part 3 (C43-C53) ───────────────────────────────────

[LAYOUT-DEPS]
text = "packages import downward only: luban -> modules, modules -/-> luban or the frontend; platform selection is if constexpr"
status = "required"

[LAYOUT-SPECS]
text = "luban/ holds specs (standard library and themselves only), kits (never xlings or Luban) and os (Luban OS; its service imports no presentation)"
status = "required"

[ROOT-GC-ROOT]
text = "a payload a retained generation links into is not deleted by remove; rolling back to that generation finds every target"
status = "required"

[ROOT-GEN-RETAIN]
text = "a SubOS keeps kKeepGenerations besides its current one; what only pruned ones held is released; a pointer naming no generation prunes nothing"
status = "required"

[ROOT-GEN-DURABLE]
text = "a generation and its pointer reach stable storage before the switch is reported (fsync of files and directories)"
status = "required"

[ROOT-SWITCH-SCALE]
text = "a checked switch reads a generation's change stamps, not every link: 300 payloads within 10 ms, 3000 within 20 ms"
status = "required"

[TOOL-RESOLVE]
text = "every external tool is resolved in one place (in-process > xlings payload > declared host tool) and reported with its source"
status = "required"

[INTENT-EQ]
text = "the Intent IR and the confine registry produce byte-identical bwrap argv to the code they replaced"
status = "required"

[GATE-CONFORM]
text = "the platform matrix is the implementations' probes, not a hand-kept table"
status = "required"

[CARRIER-LOCAL]
text = "where a SubOS runs is chosen by what it is (part 3 §5.6), recorded and listed; a carrier is reached through a launcher prefix and the NDJSON interface"
status = "required"

[CARRIER-WSL-LIFECYCLE]
text = "a wsl2 carrier is created per home on first need, reached through wsl.exe, stopped when idle, unregistered only by a confirmed removal"
status = "required"

[CARRIER-WSL-INTEROP-OFF]
text = "inside a wsl2 carrier, Windows executables cannot run and /mnt/c is not mounted"
status = "required"

[CARRIER-WSL-GRANT]
text = "only granted host directories are visible in a wsl2 carrier, and only for the session"
status = "required"

[CARRIER-UNAVAILABLE]
text = "without a usable carrier a Must refuses with the route and a native SubOS is unaffected"
status = "required"

[VIEW-CARRIER-EQ]
text = "one content declaration yields the same root view on every carrier"
status = "deferred"
why = "needs a real guest kernel (WSL2 or a VZ VM): hosted runners have no nested virtualization, and the stand-in wsl.exe runs on the host kernel -- it proves routing, not the guest root; tests/e2e/windows_carrier_wsl2_test.ps1 runs it wherever WSL2 exists"

[CARRIER-VZ-LIFECYCLE]
text = "a vz carrier VM is created per home on first need through its helper's contract, started when stopped, reached through it, and grants are the helper's virtiofs shares"
status = "required"

[CARRIER-VZ-HELPER]
text = "the vz carrier's helper is the release's luban (`luban __vm`, Virtualization.framework through luban.vm.native.vz, signed with its entitlement): its agent runs a command on pipes (bytes as written, standard error apart, input closed on request, the exit code) or on a terminal; its framework binding is validated on macOS; a VM boots on a Mac (real Apple silicon, the maintainers' lane)"
status = "required"

[SESSION-NATIVE-SUPERVISED]
text = "a native SubOS on macOS runs under the supervisor (start, join, stop, --timeout, the exit-code table); on Windows its command runs in a Job Object (tree ended at --timeout, the command's exit code); joining a running session on Windows needs a CreateProcess supervisor and is part 3 §6.3's next step"
status = "required"

[OPENKAL-COEXIST]
text = "openkal-linux links and runs beside xlings' C and C++ runtimes (glibc and the static musl release target)"
status = "deferred"
why = "evidence, not a product behaviour: the xlings-ci-linux step 'openkal coexistence' builds and runs tools/openkal-coexistence for both targets on every PR; nothing of xlings links openkal yet (part 3 §19, C53)"

[LUBAN-INIT]
text = "stage-0 is its own static binary and reads no Config"
status = "required"

[TOOLS-PROVENANCE]
text = "every external tool is a package of the index, for every architecture it is released for, unless the operating system itself is the tool (and the table says why); a missing tool's remedy is `xlings install <package>`, never a machine's package manager"
status = "required"

[HOST-DEPS-T0]
text = "what xlings and its tests take from the machine is the T0 list (kernel, sudo, apparmor_parser, mount, the OS's own tools); CI and tests install everything else through xlings (tools/lint_host_deps.sh)"
status = "required"

[LUBAN-ISO-UEFI]
text = "an exported ISO boots on UEFI without xorriso: an El Torito EFI entry written in-process (beside the BIOS default where the machine has a BIOS, as the default where it does not)"
status = "required"

[LUBAN-ISO-HYBRID]
text = "an exported ISO written to a drive boots it too: a hybrid GPT whose EFI system partition is the El Torito image, the backup table appended, still an ISO 9660 image"
status = "required"

[LUBAN-QCOW2]
text = "--qcow2 is written in-process (qcow2 v3, zero clusters unallocated) and reads back as the raw disk"
status = "required"

[CARRIER-WSL-SETUP]
text = "a Windows machine's first Linux SubOS gets its one-time setup from xlings -- WSL from the index (xim:wsl-installer, Microsoft's MSI) and the Virtual Machine Platform through the elevation door -- asked where it is needed, never a command to find and type"
status = "required"

[XVM-PROJECTION-DELTA]
text = "a change to a scope's activation (use, a registration, a removal) materialises the names that move and nothing else: the cost of switching one package does not grow with the SubOS"
status = "required"

# ── remove: versions (2026.10.12.2) ─────────────────────────────────

[XIM-REMOVE-GUARD-VERSION]
text = "removing a version is refused only when it breaks a dependent: one that links that payload, or runs its programs and has no other installed version meeting its constraint"
status = "required"

[XIM-REMOVE-OLDER-THAN]
text = "remove <name> --older-than V removes every older version nothing uses, keeps (and says why) what is active in a subos or project or linked, asks first, and --dry-run changes nothing"
status = "required"

[UX-THEME-ONCE]
text = "a configured theme that cannot be used is reported once per setting and cause, and never inside a SubOS view or a Luban root, where the default is used silently"
status = "required"

[SES-TTY-JOBCTL]
text = "a command on a terminal whose foreground is another process group (a background job, a brokered command on a session's terminal) never changes the terminal's modes, so the kernel never stops it -- nor `luban enter` with it"
status = "required"

[UPGRADE-OLD-HOME-LUBAN]
text = "an environment made from an edition on a home an older client filled (payloads without resolution records, or recorded against another runtime) is made without failures: the plan migrates the record or reinstalls the payload, and never asks the user to run --reconfig"
status = "required"

[SUBOS-OWN-HOME-INSIDE]
text = "inside a sandbox, a command for a home the sandbox owns (XLINGS_HOME it can write, e.g. mcpp's registry) runs there; only the session's read-only home goes to the broker or is owner-only"
status = "required"

[PERF-LARGE-HOME]
text = "in a home of thousands of targets and several known projects, use / install --use / remove / remove --older-than / list / self doctor of one package stay within their budgets: their cost is what the change moves, not what the home holds"
status = "required"

[LUBAN-NEW-OUTPUT]
text = "luban new / subos new --from names the edition and its chain once, prints no per-template or per-generation lines, and reports packages that failed only because a dependency did as one line under that cause"
status = "required"

[LUBAN-NEW-RERUN]
text = "an environment a failure left unfinished is finished by running the same luban new / subos new --from again; another edition under the same name is refused with the command that finishes it"
status = "required"

# ── upgrade and fault isolation (docs/specs/upgrade-and-compatibility.md) ──

[UPGRADE-LADDER]
text = "the first command of a new client runs the home's upgrade steps by itself, records {from, to, pending} and logs/upgrade.ndjson, and says nothing when nothing is pending"
status = "required"

[UPGRADE-PENDING-ONCE]
text = "what the upgrade cannot do by itself is said once, by the command that found it: how many root causes, the one command that repairs them and where the items are (each with its command in logs/upgrade.ndjson; -v prints them); the command asked for still runs"
status = "required"

[UPGRADE-FIRST-RECORD]
text = "a home without an upgrade record reports what it finds as already there, not as something this version could not do, and offers no way back"
status = "required"

[DOCTOR-REMEDY-CLEARS]
text = "a finding doctor reports with a repair is one the repair clears: the package's own registration at its payload root (`xvm.add(package.name)`) is not a broken program"
status = "required"

[HOME-FORMAT-STEPS]
text = "the steps that bring an older home to this client's layout are ordered, idempotent and recorded, each its own failure domain; the upgrade runs them and so does `self doctor --fix`"
status = "required"

[HOME-FORMAT-SWITCH-NOTE]
text = "switching the client to an older one says what of this home's layout it will not see, whether it can still write it, and the way back"
status = "required"

[LAYER-LUBAN-OWNS-MACHINE]
text = "a machine's boot entries and the images a machine boots are Luban's: xlings says where `subos boot` and `subos export --iso/--drive/--qcow2` went, keeps the implementation behind plumbing names, never imports luban.*, and a home whose stage-0 was xlings boots luban-init after the upgrade"
status = "required"

[OPS-JOURNAL]
text = "every command writes one operation journal (logs/ops/<date>/<trace>.ndjson) that the processes it runs join under the trace they inherit; credentials never reach it; `self log` lists and shows operations and bundles one without the home's paths or the user's name"
status = "required"

[LUBAN-PERSIST]
text = "an environment's persist setting decides what a session keeps of a root's own state: all, only /home, or nothing (a memory overlay, gone when the session ends); a backend without a mount namespace refuses it with the route"
status = "required"

[LUBAN-SETTINGS]
text = "an environment's machine settings (mode, persist, desktop, on-close, enter) are checked values in its machine.json, over its edition's (usr/share/luban/settings.json) and its manifest's (luban.settings); luban new takes the same ones as luban config; every key another luban wrote survives a change, and a file that cannot be read is an error, never the defaults"
status = "required"

[LUBAN-ARCHIVE]
text = "`luban export <n> x.luban` writes the manifest (edition, packages, policy, settings) and the root's own state, links as links, nothing of /usr, no persona; import refuses a path that leaves the environment, an existing name, and a policy looser than the edition's without -y"
status = "required"

[LUBAN-OUTPUT]
text = "luban's default output is one line per phase, the conclusion and the next step in luban's own commands; a step's own lines are -v's; --json is one event per line and the result"
status = "required"

[LUBAN-SHELL]
text = "an environment's login shell is its passwd's: a root made now gets the best shell its /usr has once its packages are in (fish, bash, else sh), or the one its edition names (login_shell) when it has it, and its login user the same; luban config --shell changes it, a shell the root lacks is refused with the install that brings it, and every way in reads the same answer -- a terminal joining a running session included"
status = "required"

[SUBOS-INSTANCES-APART]
text = "a sandboxed SubOS shares the home's common part (payloads, indexes, shims) read-only and never another instance: other instances' trees and their config (policy, persona, record) are out of sight; its own config is read-only; a backend that cannot hide them (proot) says so as a degradation and a policy that requires the file-system gate refuses it"
status = "required"

[LUBAN-MACHINE]
text = "luban enter <n> --mode machine boots the environment itself with its own kernel: its tree and the home are shared with the guest (9p), a supervisor outlives the terminal and serves every session over one socket, each session a pty with the root's login shell and the terminal's size; persist home/none and --temp boot a copy that goes with the machine; an image file boots as it is with its console on the terminal; closing follows the environment's on-close setting"
status = "required"

[LUBAN-TERM]
text = "the Luban OS window's console is a terminal whose screen follows what shells and full-screen programs write (cursor motion, erase, scroll regions, the alternate screen, SGR in three colour depths, wide characters, bracketed paste, the title), answers what a shell asks, keeps history, and sends keys as xterm does"
status = "required"

[LUBAN-CONSOLE-MOUSE]
text = "the console's pointer: a program that takes the mouse is sent its buttons, wheel and motion as xterm does (SGR when it asked, else X10); with Shift, or for a program that does not, a drag selects and copies, two clicks a word, three a line, the middle button pastes the last selection, the right one opens Copy and Paste, and the wheel scrolls back"
status = "required"

[LUBAN-DESKTOP-WIRE]
text = "opensal.wire carries a surface across an address space: damaged rectangles of pixels and every opensal event, whole whatever the cut of the stream, refusing what is not the protocol"
status = "required"

[LUBAN-OS-APP]
text = "the Luban OS app is a window that is a display: no system yet is quick start, one or more is the launcher (one list, the default first, a countdown that any input cancels, 0 for none), the system's console or desktop fills the window, the management panel holds everything else; it reaches environments and machines only through luban.service and luban.vm"
status = "required"

[LUBAN-AUDIO]
text = "sound is existing standards, no new protocol: a sandbox's audio grant maps the host's PipeWire / PulseAudio socket; a machine whose policy grants audio reaches it through a forwarded port relayed by luban (__pipe-unix), its sessions told PULSE_SERVER"
status = "required"

[ELEVATION-NOBODY-TO-ASK]
text = "administrator rights are never asked for where nobody can answer (agent mode, no terminal, the background of one): rights that need no question are used, otherwise nothing runs and the command that needs them is named; doctor's repair children run unattended: no terminal (a recipe's own sudo fails at once instead of waiting), the null device as input, and Ctrl-C at doctor's terminal ends them"
status = "required"

[UPGRADE-DOWNGRADE]
text = "a client older than the one that last upgraded the home changes no record and says how to go back to the newer one"
status = "required"

[FAULT-HOME-CONFIG]
text = "a home config that is not readable JSON, or a field of the wrong shape, is named by every command with its fix; self doctor reports it; --fix keeps the file and rebuilds the version records and the SubOS registry"
status = "required"

[FAULT-ISOLATION]
text = "an unreadable SubOS state stops nothing else: the other SubOS and the commands that do not need it carry on"
status = "required"

[LUBAN-DESKTOP-WLR]
text = "opensal-wlr shows a wlroots compositor's output as an opensal surface through its standard protocols only: screencopy into shared memory (the whole output first, then what it says changed, opaque), keys as evdev codes on a US keymap with the modifiers beside them (a host's repeat is not repeated), the pointer absolute on the output, the window's size as a custom mode; a compositor without screencopy is said so; a session is a wayland-sessions file with X-Opensal-Interfaces"
status = "required"

[XDESK-COMPOSITOR]
text = "xdesk is a wlroots compositor that speaks opensal.wire itself (a session file's X-Opensal-Native=true: it is given the stream, nothing is bridged): headless and software-rendered, no GPU; it shows its desktop at the size the window asks, takes the window's keys and pointer, opens a terminal (Alt+Return), arranges and decorates windows itself, and ends when the stream does; to a window that paces (its hello says so) it sends the next frame only once the last is shown (a second at most), so a slow channel does not pile frames up"
status = "required"

[XDESK-LAYOUT]
text = "xdesk.layout places windows without drawing anything: tile (one or two windows share the output, more scroll with the focused one in view, a new one beside the focus, widths through thirds, halves and the whole), floating (centred above, where it is put), the canvas (beside the focus, panned, zoomed around a point up to 1, an overview that fits every window, left back exactly where the view was, or into a chosen window), a layout per workspace; motion by a critically damped spring"
status = "required"

[XDESK-APPS]
text = "xdesk.apps reads freedesktop desktop entries (localized Name/Comment by the user's language, hidden and non-application entries skipped, the more specific directory's entry of an id winning), turns Exec into argv without field codes, and searches as a person types (a name's prefix first, then words, then generic names, keywords and comments)"
status = "required"

[XDESK-SHELL]
text = "xdesk draws its own shell with no GPU and no toolkit: windows' title bars (the title, a close button), a panel (classic: applications, workspaces, the focused title, a clock across the top; canvas: a pill at the bottom with the zoom and the overview), a launcher that searches the system's applications as one types and starts the chosen one, text shaped from the system's fonts (CJK by a fallback face); English or Chinese by the user's language"
status = "required"

[XDESK-TEXT-CLIPBOARD]
text = "the host's input method and clipboard reach a desktop's windows: xdesk asks the Luban OS window for the caret of the focused text field (text-input-v3) and gives it what the input method commits and composes (a character is not also sent as a key); the host's clipboard becomes the windows' selection as the desktop opens and whenever it changes, and a window's copy becomes the host's clipboard -- each way only as far as the environment's grants allow (clipboard, clipboard-paste; an environment without a policy as before)"
status = "required"

[LUBAN-OS-FIRST-USE]
text = "a first-time user, with nothing yet, makes a system from the Luban OS quick start and uses it without leaving the window: the quick start is what opens, the chosen edition is made for real (downloaded, set up) with its progress shown, the system's console opens by itself and runs what is typed, and the next start shows it in the list"
status = "required"

[LUBAN-OS-QUICK-START]
text = "the Luban OS quick start shows two groups -- consoles to shape (nano, tiny, core) and desktops ready to use (classic, the xdesk canvas) -- each with what it is, its standing (base, stable, preview, explore) and what is in it; whether it can be made here comes from the index (published, built for this machine's architecture) and, on a computer that cannot run Luban systems, is said before anything is tried; nano says it has no shell and is made without going in; what else the indexes offer is read from them (design 2026-10-18 §6.4): an official system it has no card for and another index's (said where it comes from) under More, a desktop edition's line in its index's words, the desktop it is made with from the luban-desktop packages, and a third party's part agreed to before it is made"
status = "required"

[LUBAN-OS-IMPORT]
text = "a system someone exported (.luban) is imported from the quick start, the launcher or by dropping the file on the window: a preview shows its edition, its packages and its isolation, lists in plain words what it may do beyond a new system's default (grants, host mounts, no isolation, a policy this version cannot read) and needs that agreed to; the import makes it from its edition, restores what it carried, and goes in"
status = "required"

[XDESK-CONFIG]
text = "a desktop's settings are the profile's defaults ($XDG_DATA_DIRS/xdesk/<profile>.ini, shipped with xdesk), a system's ($XDG_CONFIG_DIRS/xdesk/<profile>.ini, what an edition sets) and a person's own ($XDG_CONFIG_HOME/xdesk/<profile>.ini) over them key by key (a repeated key's list replaced whole); the terminal, what starts with it, gaps, workspaces, colours and the keyboard layout and repeat are set there, the command line winning; what a file gets wrong is said by line and skipped"
status = "required"

[LUBAN-MACHINE-DESKTOP]
text = "a machine whose root declares a desktop session shows it to the Luban OS window: the guest starts the session headless with its /run and /tmp its own, bridges it on a channel of the machine (opensal.wire), at the size the window asks; what is typed into it runs there"
status = "required"

[SUBOS-CMD-STDOUT]
text = "`subos use <n> --cmd <c>` is a script: its standard output is the command's alone, byte for byte -- no announcement of the entry"
status = "required"

[LUBAN-BOOT-ENTRIES]
text = "`luban boot` shows a machine's boot entries -- default, fallback, the next boot once -- and what this boot was (the entry, how it was chosen, whether it was marked good), as stage-0 recorded it"
status = "required"

[LUBAN-OS-INTERACTION]
text = "the Luban OS window is used as a person uses it -- keys (arrows, Enter, F2, the Host key), the pointer, text, the window's size and close -- tested headless with input injected as the window system delivers it: every view is reached, the highlight follows the choice, a desktop gets its input in its own pixels"
status = "required"

[LUBAN-OS-LAYOUT]
text = "every control of the Luban OS window is on screen, apart from the others and big enough to hit, at small, usual and large window sizes, in English and Chinese; what moves (the countdown) changes what is drawn; the screenshots are kept for people to look at"
status = "required"

[DOCTOR-LADDER]
text = "a repair rung is judged by the finding, not by its exit code: re-register runs config() again (--reconfig), a finding that outlives it goes to reinstall, and one that outlives a reinstall is reported as the check's fault, not healed"
status = "required"

[ROOT-PROGRAM-ENV]
text = "a program whose recipe registered an environment (vim's $VIM, curl's CA bundle, tmux's terminfo) keeps its shim in a root's /usr/bin, so the environment is there when it runs; a program with nothing to add links straight to its payload"
status = "required"

[ROOT-LOCALE]
text = "a root is entered with LANG=C.UTF-8 and without the host's LC_* and LANGUAGE, sandbox and machine alike: the locale the root's glibc has"
status = "required"

[DOMAIN-LUBAN-SYSTEM]
text = "a Luban system on Linux is made in the system prefix domain (/xlings): it shares no payload with the host's SubOS, its paths name no host user, luban finds its files in the domain's private home, and a system made before is moved there by `luban upgrade -y` with its /etc, /home, /root, /var and own packages"
status = "required"

[LAYER-VISIBILITY]
text = "each layer lists itself and what is below it: the host's `xlings subos list` counts the Luban systems in one line (--all lists them), and inside a system the domain's other systems are not listed"
status = "required"

[RUNTIME-SCOPE]
text = "one default runtime per environment: a payload bound to a runtime (the libc, the C++ runtime beside it) names its environment's indirection <home>/abi/<family>, not a runtime payload; a home's points at its pinned or newest runtime, a Luban system's at the one its generation carries; switching changes links, never a payload; an ordinary library stays bound by its payload"
status = "required"

[RUNTIME-PIN]
text = "a runtime is pinned as configuration (xlings config --runtime glibc@V, luban config <n> --runtime glibc@V) and followed again with @latest; a pin to a version not installed is refused with the install command; each switch is one rename, recorded in logs/abi.ndjson with its reason, and the state is abi.json"
status = "required"

[USER-PASSWORD]
text = "a Luban system user's password is typed hidden, confirmed, and stored only as its SHA-512 crypt hash ($6$) in the system's /etc/shadow, computed in-process; it never reaches a log, an argv or a file in clear"
status = "required"

[USER-LOGIN]
text = "a Luban system says who logs in (its etc/luban/login, root unless set): luban new --user makes that user (passwd, its group, wheel, shadow, its home), a desktop asks for one (lubanoser with -y; agent mode names the flags), luban config --login changes it, --user on enter and run chooses for one session, sandbox and machine alike"
status = "required"

[ID-HOSTNAME]
text = "a Luban system's host name is its name, sandbox and machine alike, unless its /etc/hostname names another (the edition's placeholder `luban` is not a name); a neutral identity keeps its persona's"
status = "required"

[ID-PROMPT]
text = "the prompt marks where you are: [luban] a system sharing the host's kernel, <luban> one with its own, :temp / :home when it keeps less; ANSI 16 colours only on a known terminal, none with NO_COLOR; the same from a login shell and after su - (etc/profile.d/luban.sh, written when missing, never rewritten)"
status = "required"

[ID-WELCOME]
text = "the welcome is two columns without a frame, at most 72 columns, ASCII when the locale is not UTF-8, colour only where it shows and never needed to read it; it names the system, how it runs (shared or its own kernel), what it keeps, who logs in, what xlings manages and the time, and how to leave"
status = "required"

[RECIPE-ADMIN-STEP]
text = "a recipe never runs sudo: it declares a step only an administrator may take (libxpkg system.admin_step: the command and why); xlings asks once after the install where somebody can answer and runs the steps through subos::elevation, recorded; where nobody can, the install finishes, the steps are kept in state/admin-steps.json and said with their commands, and self doctor reports them until --fix takes them at a terminal"
status = "required"

[HAL-DEVICES]
text = "openhal lists a machine's GPUs, displays, audio endpoints and input devices on Linux, macOS and Windows; what it cannot read it says with a reason, never as an empty list; every source passes the conformance check"
status = "required"

[PLATFORM-CAPS]
text = "luban status (and its --json, and the Luban OS app) says per way of running -- sandbox, machine, desktop -- whether it is ready on this computer, how it runs, and when not why and the next step; Linux, macOS and Windows alike"
status = "required"

[CONTROL-DESCRIBE]
text = "luban describes its verbs in openas (luban interface --describe): effect, arguments, options, what answers each; the description passes openas's conformance check; a verb runs from JSON arguments and is reported in openas's envelope ending with its result"
status = "required"

[CONTROL-PRINCIPAL]
text = "every operation's journal names its actor (openas: kind, name, the chain it acts for), inherited by what it starts, and each process's parent step"
status = "required"

[CARRIER-WSL2-LUBAN]
text = "on a Windows PC a Luban system lives in the Luban host machine (WSL 2): luban makes it there, describes it from the luban there, runs commands in it, removes it; a machine runs on the host machine's KVM or is refused with why and the next step"
status = "required"

[CARRIER-GUEST-CURRENT]
text = "a carrier's machine (WSL 2, a Mac's host machine) that reports another release is brought to the client's once per release (xlings self update there), never on every command"
status = "required"

# ── Luban OS distribution (design 2026-10-18) ──────────────────────

[LUBAN-DIST-XPKG]
text = "luban new takes any system and any components by --xpkg (repeatable, any index): it finds what each is (a system, a desktop, a package) from the fields and conventions it already has, says the right way when one is given where the other belongs, asks once for a third party's (with what it does beyond Luban), records the answer, and in agent mode fails with --yes"
status = "required"

[LUBAN-DIST-LINEAGE]
text = "a system says what it is in one way everywhere: its name and version, then the Luban edition it is built on (`myos 2026.11.1 (Luban desktop)`), its direct parent with its source, and its os-release (ID_LIKE=luban, LUBAN_BASE)"
status = "required"

[LUBAN-NAMESPACE]
text = "a namespace an index reserves is taken from that index only (another index's recipe in it is refused, naming the index and the file); luban's short names are the names in the luban: namespace, none listed in its code; replaces is honoured within one index"
status = "required"

[LUBAN-CAPS]
text = "luban, the Luban OS app, a machine's agent, a system and a component declare what they provide and need as named capabilities with integer levels (luban/specs/opencaps); a need is met by a provision at that level or above, an unknown name is not met and is said so, and a mismatch names which side is too old and its update"
status = "required"

[LUBAN-DESKTOP-KDE-ADAPTER]
text = "a KDE session is shown through opensal by an adapter for KWin: its picture from a virtual monitor the window's size, input injected, the pointer drawn by the host, the clipboard shared, a resize followed"
status = "planned"

[LUBAN-DESKTOP-SHELL]
text = "a desktop without a shell of its own (its session file's X-Luban-Shell=none) is given the Luban OS window's, through opensal Shell: the applications its session lists (share/applications in its XDG data dirs, field codes dropped, Terminal=true in the default terminal) and its windows (wlr foreign-toplevel), listed whole as they change; the window starts one by its id and brings one forward; a session with its own shell is not given one"
status = "required"

[LUBAN-ENTER-QUIET]
text = "a frontend that greets for itself (luban's welcome) asks xlings for no entering line with XLINGS_ENTER_QUIET=1, and a root entered through its private prefix domain is asked the same"
status = "required"

[LUBAN-SESSION-PEERS]
text = "terminals entering one environment are peers: the first starts its session in the background and joins it as later ones do, any of them leaves at once, Ctrl-C reaches only its own program, and the session ends a moment after the last; a session keeping only /home (or nothing) is joined by an entry keeping as much"
status = "required"

[LUBAN-DESKTOP-SWITCH]
text = "several desktops live in one system: luban config --desktop changes the default, luban enter --desktop opens another once, the Luban OS app's bar lists them; one desktop's defaults and autostart never reach another, and removing the one in use falls back to the console and says so"
status = "required"

[LUBAN-DESKTOP-CLASSIC]
text = "labwc, LXQt and KDE open in a machine and in a sandbox and can be used: drawn, a pointer, a terminal that shows the program it runs"
status = "planned"

[LUBAN-APP-WINDOW]
text = "luban run --display window shows one graphical program of a system as its own window on the host, titled as the program: run alone by the first session that says how (X-Luban-App-Exec, luban:compositor's labwc -S), without the window's shell, the window gone when the program ends; --display takes terminal (the default) or window, and a system with nothing to run it says what to install"
status = "required"

[LUBAN-PACKAGE-FORM]
text = "a package that changes form under its name (a bundle becoming a composite of atomic packages, or back) upgrades a system without changing its settings or sessions"
status = "planned"

# ── Luban OS: one tray, pointer and keyboard, arrangements, versions (design 2026-10-19 §23) ──

[LUBAN-OS-TRAY-PROCESS]
text = "one tray process per home (luban-os __tray, no display), each window its own process; liveness is a lock, never a pid; every behaviour of the tray before it (icon states, tooltip, menu, notifications, quit confirmation, no status bar, keep_in_tray, a hidden window finishing its job) holds"
status = "required"

[LUBAN-OS-LATENCY]
text = "the interactions of design 2026-10-19 §4.1 stay within their budgets (p95 on the luban-os lane), and a step that may take over 2 s says its first line within 2 s and something at least every 10 s"
status = "required"

[LUBAN-OS-POINTER]
text = "the host draws the pointer with the system's cursor (no frame when it moves): a shape name ('c') and an image ('C') from the desktop, the Luban theme, drawn into the frame only when the host does not take Cursor, the pointer lock released with the keyboard's chord, and an old xdesk session shown the default arrow"
status = "required"

[LUBAN-OS-KEYBOARD]
text = "entering a desktop grabs the keyboard; Ctrl+Alt+K toggles it; Ctrl+Alt alone opens the menu; the setting is honoured; an input method with nothing composed never swallows a non-character key"
status = "required"

[XDESK-ARRANGEMENTS]
text = "xdesk's space x arrangement: tiling, stacking and canvas (with tiled groups on it) per workspace, switched reversibly (back to the same layout), Super+m's chooser, splitting a column"
status = "required"

[XDESK-DRAG-SNAP]
text = "dragging a window previews exactly where it lands in each arrangement, offers sizes when it rests on a target, gaps resize what is either side, and the maximize button offers layouts"
status = "required"

[XDESK-WINDOW-MENU]
text = "a window's title-bar menu (maximize, float, always on top, on every workspace, to a workspace, app rules, close); on top stays above and on a canvas in view; rules are kept and applied; windows are named by their application"
status = "required"

[LUBAN-OS-WINDOW-TITLE]
text = "the Luban OS window's title is `Luban OS (<system>)` when it shows a system and `Luban OS` otherwise, in every view"
status = "required"

[LUBAN-VERSIONS]
text = "luban status says the versions of xlings, luban, luban-os (installed and running) and the index in one line, opens it with the next step when they disagree, and --json has versions with mismatches[].next"
status = "required"

[LUBAN-EDITION-PINNED]
text = "the version shown before a system is made is the version made (luban new, the quick start, --dry-run --json), and a newer one passed over is said"
status = "required"

[LUBAN-LS-SEARCH]
text = "luban ls without arguments is unchanged and takes a name pattern; luban search lists what the index offers (distributions, desktops) as the quick start groups it"
status = "required"

[SUBOS-FROM-NO-SILENT-INSTALLED]
text = "subos new --from without a version stops when the index cannot be read, and says so when it uses an installed version the index does not list"
status = "required"

[SUBOS-DOMAIN-RELAYED]
text = "a command routed into a prefix domain and asked through the interface brings back its data, progress and errors as events (luban history of a domain's system)"
status = "required"

[SUBOS-INDEX-SNAPSHOT]
text = "a new system's home starts from a copy of the host's index snapshot; an export carries it; an import uses no network; with no network a system is made, imported and entered from what is here"
status = "required"

[SUBOS-READONLY-USER]
text = "inside a system, a user's read-only xlings commands neither switch home nor print the notice; the first write says it once, without sudo"
status = "required"

[LUBAN-UPGRADE-REVERSIBLE]
text = "an upgrade is never forced and is undone by rollback: a frozen name to luban:, and a relayout through its archive (rollback --to relayout)"
status = "required"

[LUBAN-OS-QUICK-START-DESKTOPS]
text = "the quick start's four groups, with source, status, tier (unrated last), an index it cannot read said, the panel scrolling with Create in view, and six stages"
status = "required"

[LUBAN-OS-APP-CAPABILITIES]
text = "luban-os __capabilities answers without a display; an app that cannot be asked is not taken as compatible"
status = "required"

[XPKG-EXTENSIONS]
text = "a recipe's extensions are kept and handed on unchanged (package_info, search), within their type and size rules"
status = "required"

[LUBAN-CORE-TOOLS]
text = "core has cmake, yazi and procps-ng (and xmake on x86_64), each starting, and ps is procps-ng's"
status = "planned"

[I18N-DOMAINS]
text = "catalogues register by domain; English is complete in each; no key without English; arguments agree; the fallback chain and pick(); no tr(en, zh) in luban-os"
status = "required"

# ── a system's network, a user's own home, the prompt (design 2026-10-19 §27) ──

[LUBAN-MACHINE-NETWORK]
text = "a machine has an address, a route and name servers from the kernel's lease (not written into its tree) and the system's name, whatever its init does; a non-fatal network item in the self-check"
status = "required"

[LUBAN-NETWORK-PROXY]
text = "the host's proxy reaches a machine: read from the environment that starts it, a loopback address mapped to the host's NAT address, in /run/luban/network.env, in every session and the desktop; the network line of luban status and the banner says it"
status = "required"

[SUBOS-USER-HOME-SEED]
text = "a system user's own home starts from the system home's index snapshot and settings without the network; the first write asks once at a terminal; a package the system already has at that version is not installed again; a network failure is said once with the next step"
status = "required"

[LUBAN-PROMPT-MARK]
text = "every login shell (sh, bash, fish) shows the [luban]/<luban> mark; a system made before gets the fish script on its next entry"
status = "required"
