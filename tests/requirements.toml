# Requirement IDs and their status (design §24.4).
#
# Every ID here names a behaviour the SubOS design (or a finding it fixes)
# promises. Tests claim IDs with `covers = {...}` in their XTEST metadata;
# `xdev report --requirements tests/requirements.toml --fail-uncovered`
# fails when
#   - a `required` ID has no test, or
#   - a test names an ID this file does not declare (a typo would otherwise
#     cover nothing and look like coverage).
#
# kind   = "flow"       any test covers it
#        = "isolation"  only a test with `proves = "isolation"` (one that runs
#                       a real sandbox) covers it; the fake provider proves
#                       that the path is wired, not that anything is isolated
# status = "required"   built; must be covered
#        = "planned"    designed, its checkpoint has not landed yet; the
#                       commit that lands it flips the status
#        = "deferred"   not in this PR; `why` says so

# ── testkit (T1) ────────────────────────────────────────────────────

[NET-SOCKET-CAPS]
text = "consumer socket caps shorten download connection and read waits without expanding smaller caller budgets"
status = "required"

[NET-ENDPOINTS]
text = "network endpoint discovery preserves configured resource mirrors without fetching an index or installing packages"
status = "required"

[NET-PROBE]
text = "a resource GET probe uses download proxy and TLS settings and reports status without credential-bearing URLs"
status = "required"

[TK-RUN]
text = "the runner reports exit code, stdout and stderr"
status = "required"

[TK-HERMETIC]
text = "a run starts from the environment the test names, nothing inherited"
status = "required"

[TK-TIMEOUT]
text = "a timed-out run is killed with its process group"
status = "required"

[TK-PTY]
text = "a pty with nothing typed exposes a program that waits for input"
status = "required"

[LUBAN-FHS-PATHS]
