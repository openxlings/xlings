status = "required"

[F2]
text = "X11 is unreachable unless granted (no host abstract sockets)"
kind = "isolation"
status = "required"

[F3]
text = "only allow-listed environment variables enter the sandbox"
kind = "isolation"
status = "required"

[F4]
text = "host processes are invisible (pid namespace)"
kind = "isolation"
status = "required"

[F5]
text = "net=nat/none hides the host's network identity (ARP, interfaces)"
kind = "isolation"
status = "required"

[F6]
text = "other instances' trees are invisible"
kind = "isolation"
status = "required"

[F7]
text = "hostname, timezone and locale are neutral under private/locked"
