# How CI spends machines on the tests (tests/README.md, "Parallel runs").
#
# shards  machines the lane is split over; each takes whole families of test
#         binaries (unit/test_subos_*, ...) and builds each family with one
#         mcpp call, on the library it built once. The workflow's matrix.
# jobs    tests run at once on one machine (0 = one per processor); a test's
#         declared resources (`.resources = {"sandbox"}`) keep conflicting ones
#         apart.
# mcpp    what the build is given (a profile).
#
# `xdev test --lane-config <lane> --shard i/n` runs one machine's share;
# `python3 tools/ci/lane_matrix.py <lane>` prints the workflow's matrix.

# A shard costs half a minute to set up (the round's build is reused), so the
# unit lane is cut fine; its families take most of a shard's time.
[unit]
shards = 6
jobs = 4

[asan]
shards = 4
jobs = 2
mcpp = ["--profile", "asan"]

# Where the cases with no network and the latency budgets run (design
# 2026-10-19 §4.3, §9.3, §23): no lane of their own. A no-network case runs in
# a network namespace of its own (unshare -rn) wherever the lane has user
# namespaces -- this lane's e2e families, and the fresh suites with the
# release client; e2e/test_luban_os_latency runs where the Luban OS app does.

# Root scenarios (the distro suite), planned from measured durations.
[distro]
shards = 3

# The Luban OS desktop's real scenarios (design 2026-10-24 §11), run locally
# before a release on a machine with a display stack: a desktop on a virtual
# display driven through the bus, xdesk's sessions, the displays and the
# wire. CI runs the same tests in its e2e families; this lane is their set.
[luban-desktop]
jobs = 2
tests = ["test_luban_desktop", "test_luban_os_xdesk", "test_xdesk_", "test_openhal_emu", "test_clipboard_bridge"]
