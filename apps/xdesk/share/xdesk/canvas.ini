# xdesk's canvas profile: windows on an infinite canvas -- drag the
# background to pan, Super+wheel to zoom, Super+O for the overview.
# A system's own settings go in /etc/xdg/xdesk/canvas.ini, a person's in
# ~/.config/xdesk/canvas.ini; each wins key by key over what is here.

[desktop]
terminal = foot
# autostart = foot
gap = 12
workspaces = 4

[theme]
accent = #7aa2f7
background = #16181d

[keyboard]
layout = us
repeat_rate = 30
repeat_delay = 500
